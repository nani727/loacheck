<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B111E" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
<title>로아췍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 고정 상단바 → 넓은 화면(≥1040px)은 일일|주간 2단, 좁은 화면은 탭으로 한쪽씩 */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-done:#ECEFF4; --surface-warn:#FFF7E0;
  --line:#E0E4EC; --line-strong:#C9CFDA; --line-warn:#F2A900;
  --fg:#161A23; --muted:#687083; --faint:#9AA1B0;
  --accent:#3F51B5; --accent-fg:#3647A6; --accent-soft:rgba(63,81,181,.11);
  --guardian:#2196F3; --kurzan:#2E9E50; --gauge-empty:#E2E6EE; --seg-gap:#FFFFFF;
  --gold:#F29100; --gold-fg:#B86A00; --danger:#D93025;
  --shadow:0 1px 2px rgba(22,26,35,.06),0 4px 14px rgba(22,26,35,.05);
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B111E; --surface:#172030; --surface-done:#111824; --surface-warn:#13282C;
  --line:#26324A; --line-strong:#34425E; --line-warn:#00D9E6;
  --fg:#DCD7D1; --muted:#97A3B6; --faint:#66728A;
  --accent:#5466CC; --accent-fg:#A7B1E8; --accent-soft:rgba(110,128,230,.16);
  --guardian:#33ABDE; --kurzan:#1DAB51; --gauge-empty:#2C3850; --seg-gap:#172030;
  --gold:#CC7A00; --gold-fg:#FFAA2B; --danger:#FF6B5E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.18);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B111E; --surface:#172030; --surface-done:#111824; --surface-warn:#13282C;
  --line:#26324A; --line-strong:#34425E; --line-warn:#00D9E6;
  --fg:#DCD7D1; --muted:#97A3B6; --faint:#66728A;
  --accent:#5466CC; --accent-fg:#A7B1E8; --accent-soft:rgba(110,128,230,.16);
  --guardian:#33ABDE; --kurzan:#1DAB51; --gauge-empty:#2C3850; --seg-gap:#172030;
  --gold:#CC7A00; --gold-fg:#FFAA2B; --danger:#FF6B5E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.18);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ── 상단바 ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:19px;font-weight:700;letter-spacing:-.02em}
.brand b i{font-style:normal;color:var(--accent-fg)}
.sync{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.sync::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint)}
.sync[data-s="synced"]::before{background:var(--kurzan)}
.sync[data-s="saving"]::before,.sync[data-s="connecting"]::before{background:var(--gold)}
.sync[data-s="error"]::before{background:var(--danger)}
.tabs{display:flex;background:var(--surface-done);border:1px solid var(--line);border-radius:999px;padding:3px;margin-left:auto}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;color:var(--muted);font-size:13.5px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.tools{display:flex;gap:6px}
.tool{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;height:38px;padding:0 10px;color:var(--muted);font-weight:600;font-size:13px}
.tool svg{width:18px;height:18px;flex:none}
.tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-fg)}
.tool .t{display:none}
/* 로고 옆 이동 버튼 (좁은 화면에서는 둘째 줄로 내려가고, 넘치면 옆으로 밀어서 봄) */
.top-in{flex-wrap:wrap}
.nav{display:flex;gap:4px;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-btn{display:flex;align-items:center;gap:6px;flex:none;height:36px;padding:0 11px;border:1px solid transparent;border-radius:10px;background:none;color:var(--muted);font-weight:600;font-size:13.5px;white-space:nowrap}
.nav-btn svg{width:17px;height:17px;flex:none}
.nav-btn:hover{background:var(--surface-done);color:var(--fg)}
.nav-btn[aria-current="page"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-fg)}
@media (max-width:760px){.nav{order:5;flex-basis:100%;margin:0 -4px}.nav-btn{height:34px;padding:0 10px;font-size:13px}}
@media (max-width:480px){.nav{gap:2px}.nav-btn{flex:1 1 auto;justify-content:center;padding:0 6px;gap:4px;font-size:12.5px}.nav-btn svg{display:none}}

/* ── 보드 ── */
.board{max-width:1240px;margin:0 auto;display:grid;gap:28px;padding-block:18px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.board[data-view="daily"] .panel-weekly,.board[data-view="weekly"] .panel-daily{display:none}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 2px}
.panel-head h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.panel-head span{color:var(--muted);font-size:13px}
@media (min-width:1040px){
  .board{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .board[data-view] .panel{display:flex}
  .tabs{display:none}
  .tools{margin-left:auto}
  .tool .t{display:inline}
}
@media (min-width:640px){.tool .t{display:inline}}
/* ── 캐릭터 선택 (누르면 그 캐릭터 숙제가 맨 위로) ── */
.picker{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.brand-home{border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer;display:block;line-height:0}
/* 로고: 라이트 모드 = 눈 뜬 캐릭터, 다크 모드 = 눈 감은 캐릭터 */
.logo{display:block;width:auto}
.logo.dk{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo.lt{display:none}:root:not([data-theme="light"]) .logo.dk{display:block}}
:root[data-theme="dark"] .logo.lt{display:none}
:root[data-theme="dark"] .logo.dk{display:block}
/* 다크 모드 로고 마우스 반응: 기본(눈 감음) → 올리면 눈 뜸 → 누르고 있으면 윙크 → 떼면 눈 뜸 → 벗어나면 기본 */
.logo-set{display:block;position:relative;line-height:0;width:max-content;margin-inline:auto}
.brand .logo-set{margin-inline:0}
.logo.dkh,.logo.dkp{display:none;position:absolute;left:0;top:0;opacity:0;pointer-events:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo.dkh,:root:not([data-theme="light"]) .logo.dkp{display:block}}
:root[data-theme="dark"] .logo.dkh,:root[data-theme="dark"] .logo.dkp{display:block}
@media (hover:hover){.logo-set:hover .logo.dk{opacity:0}.logo-set:hover .logo.dkh{opacity:1}}
.logo-set:active .logo.dk,.logo-set:active .logo.dkh{opacity:0}
.logo-set:active .logo.dkp{opacity:1}
.logo-head{height:46px}
.login-logo{display:flex;justify-content:center;margin:0 0 4px}
.logo-login{height:96px}
@media (max-width:480px){.logo-head{height:34px}}
.pick-txt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.pick-spec{flex:none;align-self:center;border-radius:8px;border:1px solid var(--line-strong);background:var(--bg);color:var(--sec-spec);font-size:12px;font-weight:700;line-height:1.2;padding:6px 8px;white-space:nowrap;transition:border-color .15s,background .15s}
.pick-spec:hover{border-color:var(--sec-spec);background:color-mix(in srgb,var(--sec-spec) 12%,var(--surface))}
.pick{cursor:pointer;display:flex;align-items:center;gap:8px;min-width:0;padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;transition:border-color .15s,background .15s,transform .1s}
.pick:hover{border-color:var(--line-strong)}
.pick:active{transform:scale(.98)}
.pick-txt b{font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick-txt small{font-size:11.5px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.pick[aria-pressed="true"] b{color:var(--accent-fg)}
@media (max-width:480px){.pick .pj{display:none}}
@media (max-width:480px){.pick{flex-direction:column;align-items:stretch;gap:6px}.pick-spec{align-self:stretch;padding:4px 6px;font-size:11.5px}}
@media (max-width:420px){.pick{padding:8px 9px}.pick-txt b{font-size:13px}}

/* ── 공통 부품 ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card.done{background:var(--surface-done);box-shadow:none}
.card.done .cname{color:var(--muted)}
.card.warn{background:var(--surface-warn);border-color:var(--line-warn)}
.chead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.cname{font-size:16px;font-weight:700}
.cmeta{color:var(--muted);font-size:12.5px}
.ctag{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.card.warn .ctag{color:var(--gold-fg);border-color:var(--line-warn)}
.row{display:flex;align-items:center;gap:10px;min-height:34px}
.lbl{width:84px;flex:none;font-size:14px}
.card.done .lbl{color:var(--muted)}
.gwrap{flex:3 1 0;display:flex;align-items:center;gap:8px;min-width:96px;max-width:220px}
.gauge{--n:5;--v:0;position:relative;flex:1;height:13px;border-radius:3px;background:var(--gauge-empty);overflow:hidden}
.gauge::before{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--v) * 100%);background:var(--c,var(--guardian))}
.gauge::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(100% / var(--n) - 2px),var(--seg-gap) calc(100% / var(--n) - 2px) calc(100% / var(--n)))}
.gval{font-size:12px;color:var(--muted);width:34px;flex:none}
/* 게이지 슬라이더: 모양은 그대로, 누르거나 끌어서 값 조절 (세로 스크롤은 그대로 됨) */
.slide{cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none;align-self:stretch}
.slide .gauge{pointer-events:none}
.slide.dragging .gauge::before{transition:none}
.gauge::before{transition:width .3s ease}
.spacer{flex:1}
.step{display:flex;gap:4px}
.sbtn{width:32px;height:32px;border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;font-weight:700;font-size:17px;line-height:1;display:grid;place-items:center;color:var(--fg)}
.sbtn:hover{border-color:var(--accent)}
.chk{width:32px;height:32px;flex:none;border:1.5px solid var(--faint);background:transparent;border-radius:7px;display:grid;place-items:center;padding:0}
.chk svg{width:18px;height:18px;opacity:0}
.chk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.chk[aria-pressed="true"] svg{opacity:1}
.chk:hover{border-color:var(--accent)}

/* ── 일일: 생기 / 카게·필보 ── */
.strip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.life-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.life-top b{font-weight:600}
.life-top .num{font-weight:700}
.life-top .eta{margin-left:auto;color:var(--kurzan);font-size:13px;font-weight:600}
.bar{height:10px;border-radius:999px;background:var(--gauge-empty);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--c,var(--kurzan));transition:width .35s ease}
.life-top{align-items:center}
.life-nums{display:inline-flex;align-items:baseline;gap:4px}
.life-cur{width:6.2ch;border:1px solid transparent;border-bottom:1px dashed var(--line-strong);border-radius:6px;background:transparent;color:var(--fg);font:inherit;font-weight:700;padding:2px 4px;text-align:right;cursor:text}
.life-cur:hover{border-color:var(--line-strong)}
.life-cur:focus{outline:none;border-color:var(--kurzan);background:var(--bg)}
.pbtn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.life-top .save{display:none;background:var(--kurzan);color:#fff}
.life-top.editing .save{display:inline-block}
.life-br{display:none}
@media (max-width:480px){.life-top b{order:1}.life-top .eta{order:2}.life-br{display:block;order:3;flex-basis:100%;height:0}.life-nums{order:4}.life-top .pbtn{order:5}}
.strip-sep{border-top:1px dashed var(--line-strong);margin:2px 0}
.pbtn{height:38px;padding:0 14px;border-radius:9px;border:1.5px solid var(--kurzan);background:transparent;font-weight:700}
.pbtn:disabled{border-color:var(--line);color:var(--faint);cursor:default}
.pbtn.ok{background:var(--kurzan);color:#fff;border-color:var(--kurzan)}
.exp{display:flex;gap:10px;flex-wrap:wrap}
.exp-head{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:0;text-align:left;color:var(--muted);font-weight:600;font-size:13.5px}
.exp-head span{flex:1}
.exp-head svg{width:18px;height:18px;transition:transform .2s}
.exp-head[aria-expanded="true"] svg{transform:rotate(180deg)}
.exp-head:disabled{cursor:default}
.reddot{width:7px;height:7px;border-radius:50%;background:var(--danger);flex:none}
.exp-item{flex:1 1 160px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.exp-item .ico,.xr .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
/* 유리 스타일: 두꺼운 유리 테두리 + 왼쪽 위 빛 반사로 볼록하게 (사용자가 '유리 스타일'로 이름 붙임) */
.exp-item .ico.glass,.xr .ico.glass{position:relative;width:36px;height:36px;padding:0;border-radius:24%;display:block;overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,.5)}
.ico.glass .in{display:grid;place-items:center;width:100%;height:100%;border-radius:inherit;object-fit:cover;background:#000}
/* 유리 크기 = 그림 크기 (틈 없음). 흰 윤곽선 없이 빛 반사·그림자만 그림 위에 얹음 */
.ico.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.8),inset 1px 1px 2px rgba(255,255,255,.55),inset -2px -2px 4px rgba(0,0,0,.6)}
.ico.glass::after{content:"";position:absolute;left:14%;top:12%;width:34%;height:22%;border-radius:50%;background:radial-gradient(rgba(255,255,255,.9),rgba(255,255,255,0) 70%);transform:rotate(-25deg);pointer-events:none}
/* 물방울 스타일 (시안 A): 위쪽 반달 광택 + 아래 안쪽 그림자. .glass.drop 이면 유리 스타일 대신 이걸로 */
.ico.glass.drop{border-radius:22%;box-shadow:0 2px 5px rgba(0,0,0,.45)}
.ico.glass.drop::before{box-shadow:inset 0 -4px 7px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.35)}
.ico.glass.drop::after{left:8%;right:8%;top:4%;width:auto;height:46%;transform:none;border-radius:50% 50% 45% 45%/70% 70% 30% 30%;background:linear-gradient(rgba(255,255,255,.75),rgba(255,255,255,.08))}
.exp-item.on .ico.glass .in{opacity:.55;filter:grayscale(.4)}
.exp-item.solo{border:0;padding:0}
.total .exp-item{flex:none}
.total .estate-toggle{margin:6px auto -4px}
.total .exp-item.sep{margin-top:4px;padding-top:12px;border-top:1px dashed var(--line-strong);border-radius:0}
.exp-item.estate .ico .in{background:linear-gradient(160deg,#3E9A5A,#174A2A)}
.exp-item.serka .ico .in{background:linear-gradient(160deg,#C9A23A,#5C4410);font-size:9.5px;letter-spacing:-.03em}
.exp-item b{flex:1;font-weight:600}
.exp-item.on b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.note{color:var(--muted);font-size:13px}

/* ── 주간 ── */
.raids{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.raid{position:relative;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 10px 8px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.raid:hover{border-color:var(--accent)}
.raid .rn{font-weight:700;font-size:14px}
.pips{display:flex;gap:3px}
.pips i{flex:1;height:5px;border-radius:2px;background:linear-gradient(var(--accent),var(--accent)) left/0% 100% no-repeat,var(--gauge-empty);transition:background-size .3s ease}
.pips i.on{background-size:100% 100%}
.raid .rg{font-size:12px;color:var(--gold-fg);font-weight:600}
.goldrow{display:flex;align-items:center;gap:12px}
.cleared-toggle{display:flex;align-items:center;justify-content:center;gap:4px;border:0;background:none;color:var(--muted);font-size:12.5px;padding:2px 0 0;margin-bottom:-4px}
.cleared-toggle svg{width:16px;height:16px;transition:transform .2s}
.cleared-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.goldrow .bar{flex:1;height:9px}
.goldrow .bar>i{--c:var(--gold)}
.goldrow .g{font-weight:700;color:var(--gold-fg);font-size:13.5px;white-space:nowrap}
.sub{border-top:1px dashed var(--line);padding-top:6px;display:flex;flex-direction:column;gap:2px}
.total{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.total .goldrow .bar{height:11px}
.total-top{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px}

.cards{display:flex;flex-direction:column;gap:10px}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent-fg);font-weight:600;padding:0;text-decoration:underline}

/* ── 설정 시트 ── */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,8,15,.45);display:flex;justify-content:flex-end}
.sheet{width:min(520px,100%);height:100%;background:var(--bg);overflow-y:auto;border-left:1px solid var(--line);
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.sheet-head{display:flex;align-items:center;justify-content:space-between}
.sheet-head h2{margin:0;font-size:19px}
.group h3{margin:0 0 6px;font-size:13px;color:var(--accent-fg);letter-spacing:.02em}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px}
.opt{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt div{flex:1;min-width:0}
.opt b{display:block;font-weight:600}
.opt small{color:var(--muted);font-size:12.5px}
.sw{width:44px;height:26px;border-radius:999px;border:0;background:var(--line-strong);position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.roster{display:flex;flex-direction:column;gap:8px;padding:10px 0}
.rrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 72px 48px 34px;gap:6px;align-items:center}
.rrow.head{font-size:11.5px;color:var(--muted)}
.api{display:flex;flex-direction:column;gap:10px;padding:12px 0}
.api-row{display:flex;gap:8px;flex-wrap:wrap}
.api-row input{flex:1;min-width:140px;height:38px;border:1px solid var(--line-strong);border-radius:9px;background:var(--bg);color:var(--fg);padding:0 12px;font:inherit}
.api-row .tool{height:38px}
.api-msg{font-size:12.5px;color:var(--kurzan)}
.api-msg.err{color:var(--danger)}
.found{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;max-height:340px;overflow-y:auto}
.found label{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.found label:last-child{border-bottom:0}
.found input{width:18px;height:18px;accent-color:var(--accent)}
.found b{display:block;font-size:14px}
.found small{color:var(--muted);font-size:12px}
.rrow input{width:100%;min-width:0;height:34px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--fg);padding:0 8px;font:inherit;font-size:13.5px}
.del{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--muted);padding:0;font-size:12px}
.del.arm{border-color:var(--danger);color:var(--danger);width:auto;padding:0 6px}
.add{height:38px;border:1px dashed var(--line-strong);border-radius:9px;background:none;font-weight:600;color:var(--accent-fg)}
.fine{font-size:12.5px;color:var(--muted);margin:0}
/* ── 로그인 ── */
.login{min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px 24px;display:flex;flex-direction:column;gap:12px}
.login-card h1{margin:0;font-size:28px;letter-spacing:-.02em}
.login-card h1 i{font-style:normal;color:var(--accent-fg)}
.login-card p{margin:0;color:var(--muted);font-size:13.5px}
.login-card label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600}
.login-card input{height:44px;border:1px solid var(--line-strong);border-radius:10px;background:var(--bg);color:var(--fg);padding:0 12px;font:inherit;font-size:15px}
.mainbtn{height:46px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;font-size:15px}
.mainbtn:disabled{opacity:.45;cursor:default}
.msg{font-size:13px;color:var(--danger)}
.msg.ok{color:var(--kurzan)}
.login-links{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:4px}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted)}
/* ── 메뉴 패널 (오른쪽 15%, 본문은 밀리지 않음) ── */
.menu-scrim{position:fixed;inset:0;z-index:15;background:transparent}
.menu{position:fixed;top:0;right:0;bottom:0;z-index:16;width:clamp(220px,15vw,320px);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-right:env(safe-area-inset-right,0px);display:flex;flex-direction:column;animation:menuIn .22s cubic-bezier(.2,.8,.2,1)}
.menu.closing{animation:menuOut .18s ease-in forwards}
@keyframes menuIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes menuOut{to{transform:translateX(100%)}}
.menu-head{display:flex;align-items:center;justify-content:space-between;padding:0 14px 10px;font-weight:700;color:var(--muted);font-size:12.5px;letter-spacing:.04em}
.menu-row{display:flex;align-items:center;gap:12px;border:0;border-top:1px solid var(--line);background:none;padding:15px 16px;text-align:left;font-size:15px;font-weight:600;color:var(--fg)}
.menu-row:last-child{border-bottom:1px solid var(--line)}
.menu-row svg{width:20px;height:20px;color:var(--muted);flex:none}
.menu-row[aria-current="page"]{background:var(--accent-soft);color:var(--accent-fg)}
.menu-row[aria-current="page"] svg{color:var(--accent-fg)}
.menu-row:hover{background:var(--surface-done)}

/* ── 스펙 현황 ── */
:root{--sec-grid:#0E8FC7;--sec-refine:#D9640A;--sec-adv:#D02B2E;--sec-spec:#3E9A08;--pick:#93B6FF;--pick-fg:#0B111E;--pick-line:#3F51B5;--slot:#E7EAF0;--field-bg:#F3F6FF;--field-fg:#3F51B5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sec-grid:#1BA9E8;--sec-refine:#F07A1A;--sec-adv:#E5383B;--sec-spec:#5AD10F;--slot:#1A2232;--field-bg:#151C2B;--field-fg:#93B6FF}}
:root[data-theme="dark"]{--sec-grid:#1BA9E8;--sec-refine:#F07A1A;--sec-adv:#E5383B;--sec-spec:#5AD10F;--slot:#1A2232;--field-bg:#151C2B;--field-fg:#93B6FF}
.page{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:18px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page-head{display:flex;align-items:center;gap:10px}
.page-head h2{margin:0;font-size:19px;flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.page-head h2 small{font-size:13px;color:var(--muted);font-weight:500}
/* 스펙 수정 화면: 캐릭터 이름 줄은 스크롤해도 위에 고정 */
.page-head.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,59px));z-index:4;background:var(--bg);margin:-8px -16px 0;padding:8px 16px 10px;border-bottom:1px solid var(--line)}
.spec-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.spec-card:hover{border-color:var(--accent)}
.spec-card .info{flex:1;min-width:0}
.spec-card b{font-size:16px}
.spec-card small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.spec-card .nums{display:flex;gap:14px;font-size:13px;color:var(--muted);text-align:right}
.spec-card .nums b{display:block;font-size:15px;color:var(--fg)}
.spec-card svg{width:18px;height:18px;color:var(--faint);flex:none}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-title{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-bottom:3px solid var(--sec);padding-bottom:6px}
.sec-title h3{margin:0;font-size:24px;font-weight:800;color:var(--sec);letter-spacing:-.02em}
.sec-title select{border:1px solid var(--line-strong);background:var(--bg);color:var(--fg);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px}
.grid-wrap{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);column-gap:10px}
.grid-col{text-align:center;color:var(--sec);font-weight:700;font-size:18px;padding:4px 0 10px}
.grid-row{display:contents}
.grid-row>*{padding:10px 0}
.grid-row:not(:last-child)>*{border-bottom:2px dashed var(--line-strong)}
.grid-lbl{display:grid;place-items:center;color:var(--sec);font-weight:800;font-size:20px;min-width:30px}
.gcell{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gbtn{height:34px;border:0;border-radius:7px;background:var(--slot);color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums;padding:0}
.gbtn[aria-pressed="true"]{background:var(--pick);color:var(--pick-fg);font-weight:700}
.parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.part{display:flex;gap:5px;min-width:0}
.plabel{flex:none;width:56px;display:grid;place-items:center;border-radius:9px;border:2px solid var(--sec);background:color-mix(in srgb,var(--sec) 14%,var(--surface));color:var(--sec);font-weight:700;font-size:14px}
.pval{flex:1;min-width:0;min-height:44px;display:flex;align-items:stretch;border-radius:9px;border:2px solid var(--pick-line);background:var(--field-bg);color:var(--field-fg);padding:0;overflow:hidden;cursor:text}
.pval input{border:0;background:transparent;color:inherit;font:inherit;text-align:center;font-variant-numeric:tabular-nums;min-width:0;padding:0 3px;margin:0;height:auto;cursor:text}
.pval input:focus{outline:none;background:color-mix(in srgb,var(--field-fg) 14%,transparent);border-radius:4px}
.pval input::placeholder{color:var(--field-fg);opacity:.35}
.pval .big{font-size:19px;flex:1 1 0;width:0;text-align:right}
.pval .small{font-size:11.5px;flex:1 1 0;width:0;text-align:left;padding-top:11px}
.pval .full{font-size:19px;flex:1 1 0;width:0}
/* 재련&상급 재련: 한 칸에 두 줄 (윗줄 재련, 아랫줄 상급재련) */
.pval.two{flex-direction:column}
.pline{flex:1;display:flex;align-items:stretch;min-height:36px}
.pline+.pline{border-top:2px dashed color-mix(in srgb,var(--pick-line) 70%,transparent)}
.pval.two .small{padding-top:9px}
.pval.two .full{font-size:17px}
.part .plabel{font-size:13.5px}
.sec-title select.gear-pick{border:0;background:transparent;color:var(--muted);font-size:14px;padding:4px 2px;cursor:pointer}
@media (max-width:560px){.parts{gap:8px}.plabel{width:46px}.part .plabel{font-size:12.5px}.pval.two .full,.pval .big{font-size:17px}}
/* 좁은 휴대폰: 부위 이름을 칸 위로 올려서 숫자 칸을 넓게 */
@media (max-width:440px){.parts{gap:8px 6px}.part{flex-direction:column;gap:4px}.plabel{width:auto;height:26px}.part .plabel{font-size:12.5px}.pval .small{font-size:10.5px}}
.stat-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 20px;color:var(--sec);font-size:20px;font-weight:600}
.stat-row span{display:flex;align-items:baseline;gap:8px}
.stat-row b{font-variant-numeric:tabular-nums}
.stat-row input{width:7.5em;border:0;border-bottom:2px solid var(--sec);background:transparent;color:var(--sec);font:inherit;font-weight:700;font-variant-numeric:tabular-nums;padding:0 2px}
.stat-row input:focus{outline:none}
.hint{font-size:12px;color:var(--muted);margin:0}
.hist-week{display:flex;flex-direction:column;gap:12px}
.hist-week+.hist-week{border-top:2px dashed var(--line-strong);padding-top:16px}
.hist-week h3{margin:0;font-size:13px;color:var(--muted);font-weight:600}
.hist-char{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.hist-char b{display:block;margin-bottom:6px}
.hist-char ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px;font-variant-numeric:tabular-nums}
:root{--honor:#AF29C5;--dispatch:#C52982}
.strip .row.dispatch{min-height:34px}
.row.dispatch.done .lbl{color:var(--muted);text-decoration:line-through}
/* ── 카게·필보 알림 토스트 (오른쪽 아래) ── */
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:10px;width:min(340px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;background:var(--surface);border:1px solid var(--line-strong);border-left:4px solid var(--gold);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:8px;animation:toastIn .28s cubic-bezier(.2,.8,.2,1)}
.toast.out{animation:toastOut .22s ease-in forwards}
@keyframes toastIn{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateX(30px);opacity:0}}
.toast-head{display:flex;align-items:center;gap:8px}
.toast-head b{flex:1;font-size:14.5px}
.toast-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.toast-x:hover{background:var(--surface-done)}
.toast p{margin:0;color:var(--muted);font-size:13px}
.toast-items{display:flex;flex-wrap:wrap;gap:6px}
.toast-items button{height:32px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);padding:0 10px;font-weight:600;font-size:13px}
.toast-items button:hover{border-color:var(--accent);color:var(--accent-fg)}
.vol{width:150px;accent-color:var(--accent)}
/* ── 융화재료 계산기 ── */
.fz{--res-n:#8A96A3;--res-p:#3FA46A;--res-r:#4F7FD6;--res-w:#9567C9;--res-g:var(--gold);--hl:color-mix(in srgb,var(--gold) 18%,transparent);--hl-ink:var(--gold-fg);--plus:#2E9D5B;--minus:var(--danger);
  max-width:1040px}
.fz .mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.fz-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.fz-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 14px}
.fz-head h3{margin:0;font-size:17px;font-weight:700}
.fz-note{color:var(--muted);font-size:12.5px}
.fz-fold{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0;font-weight:700;font-size:17px;text-align:left}
.fz-fold svg{width:18px;height:18px;transition:transform .2s}
.fz-fold[aria-expanded="true"] svg{transform:rotate(90deg)}
.fz-btn{height:32px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);padding:0 12px;font-weight:600;font-size:13px}
.fz-btn:disabled{opacity:.6;cursor:default}
.fz-err{margin-top:10px;color:var(--danger);font-size:13px}
.fz-tablewrap{margin-top:12px;overflow-x:auto}
.fz-table{width:100%;border-collapse:collapse;font-size:13.5px}
.fz-table th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line-strong)}
.fz-table td{padding:7px 8px;border-bottom:1px solid var(--line)}
.fz-table th.r,.fz-table td.r{text-align:right}
.fz-table tr.grp td{background:var(--bg);color:var(--muted);font-size:12px;font-weight:700;padding:5px 8px}
.fz-table tr.best td{background:var(--hl)}
.fz-table tr.best td:first-child{font-weight:700}
.fz-plus{color:var(--plus);font-weight:600}.fz-minus{color:var(--minus);font-weight:600}
.fz-pick{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line-strong);font-size:13.5px}
.fz-pick select{border:1px solid var(--line-strong);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 8px;font:inherit}
.fz-pick b{color:var(--accent-fg)}
.fz-fields{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:14px}
.fz-prices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line-strong)}
.fz-prices.one{grid-template-columns:minmax(0,1fr);max-width:320px}
.fz-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.fz-field label{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;min-width:0}
.fz-field label span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fz-dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.fz-field input{width:100%;min-width:0;font:500 16px "IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--fg);background:var(--bg);border:1px solid var(--line-strong);border-radius:8px;padding:9px 10px;text-align:right}
.fz-field input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.fz-field small{color:var(--muted);font-size:11.5px}
/* 추천: 가루로 교환할 재료 칸을 노란 테두리로 강조 */
.fz-field.rec input{border:2px solid #F2C230;box-shadow:0 0 0 3px color-mix(in srgb,#F2C230 22%,transparent)}
.fz-field small.rec-tag{color:#C99A00;font-weight:700}
:root[data-theme="dark"] .fz-field small.rec-tag{color:#F2C230}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fz-field small.rec-tag{color:#F2C230}}
.fz-field small.max{color:var(--hl-ink);background:var(--hl);border-radius:6px;padding:4px 8px;font-weight:600;align-self:flex-start;font-size:12.5px}
.fz-recipe{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-size:12.5px;color:var(--muted)}
.fz-recipe b{color:var(--fg);font-weight:600}
.fz-recipe span{display:inline-flex;align-items:center;gap:5px}
.fz-summary{background:var(--accent-soft);border-radius:var(--r);padding:12px 16px;font-size:14px}
.fz-routes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.fz-route{display:flex;flex-direction:column;gap:14px;min-width:0}
.fz-route-head p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.fz-route-head h3{margin:0;font-size:16px}
.fz-block{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.fz-block h4{margin:0;font-size:12.5px;font-weight:600;color:var(--muted)}
.fz-big{display:flex;align-items:baseline;gap:6px}
.fz-big .n{font:600 36px/1 "IBM Plex Mono",ui-monospace,Menlo,monospace;color:var(--accent-fg)}
.fz-big .u{font-size:15px;font-weight:600}
.fz dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:7px 12px}
.fz dt{color:var(--muted);font-size:13.5px;min-width:0}
.fz dd{margin:0;font:600 14.5px "IBM Plex Mono",ui-monospace,Menlo,monospace;text-align:right}
.fz dt.key,.fz dd.key{background:var(--hl);color:var(--hl-ink)}
.fz dt.key{padding:2px 8px;border-radius:4px 0 0 4px;font-weight:600}
.fz dd.key{padding:2px 8px;border-radius:0 4px 4px 0}
.fz-left{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.fz-chips{display:flex;flex-wrap:wrap;gap:6px}
.fz-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:999px;padding:2px 10px 2px 8px;font-size:12.5px}
.fz-chip b{font:600 13px "IBM Plex Mono",ui-monospace,Menlo,monospace}
.fz-chip.key{background:var(--hl);border-color:transparent;color:var(--hl-ink)}
.fz-need{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:14px}
.fz-need-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.fz-need-col h4{margin:0;font-size:13.5px}
.fz-tabs{display:flex;background:var(--surface-done);border:1px solid var(--line);border-radius:999px;padding:3px}
.fz-tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:700;color:var(--muted);font-size:14px}
.fz-tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.fz-items{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.fz-items button{border:1.5px solid var(--line-strong);background:var(--bg);border-radius:10px;padding:7px 12px;font-weight:600;font-size:13.5px}
.fz-items button small{color:var(--muted);font-weight:500}
.fz-items button[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-fg)}
.fz-legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.fz-legend span{display:inline-flex;align-items:center;gap:5px}
.fz-mline{display:inline-block;width:16px;border-top:2px dashed var(--danger)}
.fz-chart{margin-top:10px;padding-left:46px}
.fz-plot{position:relative;height:260px;border-bottom:1px solid var(--line-strong)}
.fz-tick{position:absolute;left:0;right:0;border-top:1px solid var(--line);height:0}
.fz-tick span{position:absolute;right:calc(100% + 6px);top:-8px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.fz-market{position:absolute;left:0;right:0;border-top:2px dashed var(--danger);z-index:2;pointer-events:none;height:0}
.fz-market span{position:absolute;right:0;top:3px;font-size:11px;font-weight:700;color:var(--danger);background:var(--surface);padding:0 4px;border-radius:4px}
.fz-grps{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.fz-grp{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:100%;padding:0 2px}
.fz-bar{position:relative;flex:1;max-width:26px;min-width:0;display:flex;flex-direction:column-reverse;border:0;padding:0;background:none;border-radius:4px 4px 0 0;transform-origin:bottom;cursor:pointer}
.fz-bar.empty{background:repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 6px);height:6px;cursor:default}
.fz-bar i{display:block;width:100%;flex:none}
.fz-bar i:last-of-type{border-radius:4px 4px 0 0}
.fz-bar.sel{outline:2px solid var(--fg);outline-offset:1px}
.fz-bar.min{box-shadow:0 0 0 2px #F2C230}
.fz-btot{position:absolute;bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.fz-star{position:absolute;bottom:calc(100% + 14px);left:50%;transform:translateX(-50%);color:#E0A800;font-size:15px;line-height:1}
.fz-glabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:4px}
.fz-glab{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.fz-glab b{font-size:13px;white-space:nowrap}
.fz-sub3{display:flex;justify-content:center;gap:3px;width:100%;padding:0 2px}
.fz-sub3 i{flex:1;max-width:26px;font-style:normal;font-size:10px;color:var(--muted);text-align:center}
.fz-detail{display:flex;flex-direction:column;gap:4px;margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--bg);font-size:13px}
.fz-detail span{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
@media (max-width:560px){.fz-chart{padding-left:38px}.fz-plot{height:220px}.fz-btot{display:none}.fz-bar.min .fz-btot{display:block}.fz-grps,.fz-glabs{gap:3px}.fz-grp{gap:2px;padding:0}.fz-glab b{font-size:11.5px}.fz-star{bottom:calc(100% + 13px)}}
.fz-sub{display:block;font-size:11px;color:var(--muted);font-weight:400}
.fz-warn{color:#E0A100;cursor:help}
.fz-basis{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:10px;font-size:13px}
.fz-basis select{border:1px solid var(--line-strong);background:var(--bg);color:var(--fg);border-radius:8px;padding:5px 8px;font:inherit}
.fz-need-zero{color:var(--muted);font-size:12.5px;margin-top:-4px}
.fz-fusion{border-top:1px dashed var(--line-strong);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.fz-fusion dt small{font-size:11.5px}
.fz-fusion dd{font-family:inherit;font-size:13.5px}
.fz-need-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fz-need-h .fz-btn{height:28px;padding:0 10px;font-size:12.5px}
.fz-need-total{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.fz-need-total .n{font:600 28px/1.1 "IBM Plex Mono",ui-monospace,Menlo,monospace;color:var(--accent-fg)}
.fz-need-total .u{font-weight:600}
.fz-short{font-size:13.5px}
.fz-ok{color:var(--plus);font-weight:600}
.fz-lack{color:var(--hl-ink);background:var(--hl);border-radius:4px;padding:1px 6px;font-weight:600}
.fz-foot{color:var(--muted);font-size:12.5px;display:flex;flex-direction:column;gap:4px}
.fz-foot p{margin:0}
@media (max-width:820px){.fz-need{grid-template-columns:minmax(0,1fr)}.fz-fields{grid-template-columns:repeat(3,minmax(0,1fr))}.fz-routes{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.fz-table{font-size:12.5px}.fz-table th,.fz-table td{padding:6px 4px}.fz-table .wide{display:none}}
@media (max-width:440px){.fz-fields{grid-template-columns:repeat(2,minmax(0,1fr))}.fz-big .n{font-size:30px}.fz-prices{grid-template-columns:minmax(0,1fr)}}



/* ── 팔찌 점수 ── */
.page.bz{max-width:1000px}
.page.inv{max-width:1000px}
.inv-sum{display:flex;flex-wrap:wrap;gap:8px}
.inv-sum .chip{display:inline-flex;align-items:baseline;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.inv-sum .chip b{color:var(--fg);font-size:15px}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.inv-head{display:flex;align-items:baseline;gap:8px}
.inv-head b{font-size:16px}
.inv-head small{color:var(--muted);font-size:12.5px}
.inv-row{display:flex;align-items:center;gap:6px}
.inv-name{flex:1;min-width:0;height:34px;border:1px solid transparent;background:transparent;border-radius:8px;padding:0 8px;font:inherit;font-size:14px;color:var(--fg)}
.inv-name:hover{border-color:var(--line)}
.inv-name:focus{border-color:var(--accent);background:var(--surface);outline:none}
.inv-name::placeholder{color:var(--faint)}
.inv-cnt{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.inv-step{width:28px;height:32px;border:0;background:transparent;color:var(--muted);font-size:16px;font-weight:700}
.inv-step:hover:not(:disabled){background:var(--accent-soft);color:var(--accent-fg)}
.inv-step:disabled{opacity:.35;cursor:default}
.inv-num{width:52px;height:32px;border:0;border-inline:1px solid var(--line);background:transparent;text-align:center;font:inherit;font-size:15px;font-weight:700;color:var(--fg)}
.inv-num:focus{outline:none;background:var(--accent-soft)}
.inv-unit{color:var(--muted);font-size:13px}
.inv-del{min-width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:var(--faint);font-size:15px;padding:0 6px}
.inv-del:hover{color:var(--muted);background:var(--line)}
.inv-del.arm{background:#d9534f;color:#fff;font-size:12px;font-weight:700}
.inv-add{align-self:flex-start;border:1px dashed var(--line);background:transparent;border-radius:8px;height:30px;padding:0 10px;color:var(--muted);font-size:13px;font-weight:600}
.inv-add:hover{border-color:var(--accent);color:var(--accent-fg)}
.inv-empty{margin:0;color:var(--muted);font-size:13px}
.bz-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:720px){.bz-grid{grid-template-columns:minmax(0,1fr)}}
.bz-total{font-size:20px;font-weight:800;color:var(--accent-fg)}
.bz-list{list-style:none;margin:10px 0 6px;padding:0;display:flex;flex-direction:column;gap:6px}
.bz-list li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.bz-list .bz-name{flex:1;min-width:0;font-weight:600;font-size:13.5px}
.bz-list .bz-name small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bz-list b{font-size:15px}
.bz-g{flex:none;display:inline-grid;place-items:center;min-width:34px;height:22px;padding:0 5px;border-radius:6px;font-size:12px;font-weight:700;color:#111;background:var(--gc)}
.bz-t{flex:none;min-width:48px;text-align:center;font-size:12px;font-weight:700;border:1px solid var(--line-strong);border-radius:6px;padding:2px 5px;color:var(--fg)}
.bz-raw pre{margin:8px 0 0;padding:8px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font-size:12px;white-space:pre-wrap;word-break:break-all}
.bz-tsel{flex:none;min-width:64px;font:inherit;font-size:12px;font-weight:700;border:1px solid var(--line-strong);border-radius:6px;padding:2px 4px;background:var(--bg);color:var(--fg);cursor:pointer}
.bz-tsel.changed{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-fg)}
.bz-rules li{display:flex;align-items:center;gap:8px}
.bz-rules ul{list-style:none;padding-left:0}
.bz-side{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--surface-done)}
.bz-side b{font-size:20px}
.bz-side.win{background:var(--accent-soft);outline:2px solid var(--accent)}
.bz-cfg{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:10px}
.bz-cfg label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.bz-num{width:60px;height:32px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;text-align:right;padding:0 8px}
.bz-rules{margin-top:12px;font-size:13px}
.bz-rules summary{cursor:pointer;color:var(--accent-fg);font-weight:600}
.bz-rules ul{margin:8px 0 0;padding-left:18px;display:grid;gap:3px}
.bz-drop{display:flex;align-items:center;gap:16px;min-height:120px;padding:16px 18px;border:2px dashed var(--line-strong);border-radius:var(--r);background:var(--surface);cursor:pointer;outline:none;transition:border-color .15s,background .15s}
.bz-drop:hover,.bz-drop:focus,.bz-drop.over{border-color:var(--accent);background:var(--accent-soft)}
.bz-drop:focus .bz-drop-txt b::after{content:" · 붙여넣을 준비 됐어요";font-weight:500;font-size:13px;color:var(--accent-fg)}
.bz-drop img{flex:none;max-width:220px;max-height:124px;border-radius:8px;border:1px solid var(--line);object-fit:contain;background:#000}
.bz-drop-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.bz-drop-txt b{font-size:16px}
.bz-drop-txt span{font-size:14px}
.bz-drop-txt small{font-size:12.5px;color:var(--muted)}
.bz-drop kbd{font:inherit;font-size:12px;font-weight:700;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--bg)}
@media (max-width:560px){.bz-drop{flex-direction:column;align-items:flex-start}.bz-drop img{max-width:100%}}
.tool:disabled{opacity:.45;cursor:default}
.bz-mode{display:flex;flex-wrap:wrap;gap:6px 18px;margin:6px 0 4px;font-size:13.5px}
.bz-mode label{display:flex;align-items:center;gap:6px;cursor:pointer}
.bz-mode input{accent-color:var(--accent);width:16px;height:16px}
.bz-rec{display:flex;gap:8px;margin-top:8px}
.bz-rec select{flex:1;border:1px solid var(--line-strong);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 8px;font:inherit}
.tool.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-fg)}
/* ── 원정대 일일 숙제 카드 ── */
.card.expd .row.xr{gap:10px}
.xr .ico.glass{width:32px!important;height:32px!important;flex:none}
.xr-name{width:92px;flex:none;font-size:14px;white-space:nowrap}
.row.xr.on .xr-name,.row.xr.on .isl-top b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.row.xr.on .ico.glass .in{opacity:.55;filter:grayscale(.4)}
.ico.glass .in.xr-txt{color:#fff;font-size:11px;font-weight:700}
.ico.glass .in.xr-txt.estate{background:linear-gradient(160deg,#3E9A5A,#174A2A)}
.ico.glass .in.xr-txt.serka{background:linear-gradient(160deg,#C9A23A,#5C4410);font-size:9.5px;letter-spacing:-.03em}
.xr-name.wide{width:auto;flex:1 1 auto;min-width:0;white-space:normal}
.ico.glass .in.xr-txt.voyage{background:linear-gradient(160deg,#2B9DB0,#0D4250)}
.ico.glass .in.xr-txt.dispatch{background:linear-gradient(160deg,#D94A9A,#6B1446)}
.row.xr.island{align-items:flex-start;padding:4px 0}
.row.xr.island .chk{align-self:center}
.row.xr.dispatch .gwrap{max-width:180px}
/* ── 모험 섬 ── */
.exp-item.island{flex:none;align-items:flex-start;padding:8px 10px}
.exp-item.island .ico.glass{margin-top:2px}
.ico.glass .in.isl-txt{background:linear-gradient(160deg,#2E8FD6,#0E3D6B);color:#fff;font-size:12px;font-weight:700}
.isl-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.isl-top{display:flex;align-items:baseline;gap:8px}
.isl-top b{font-weight:600;flex:none}
.isl-next{font-size:12.5px;color:var(--accent-fg);font-weight:600}
.exp-item.on .isl-top b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.isl-list{display:flex;flex-wrap:wrap;gap:4px 6px}
.isl-chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.isl-chip.gold{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent)}
.isl-chip i{font-style:normal;font-size:11px;font-weight:700;border-radius:4px;padding:0 4px}
.isl-chip i.t-gold{color:var(--gold-fg)}
.isl-chip i.t-card{color:#8E6FD8}
.isl-chip i.t-silling{color:var(--muted)}
.isl-chip i.t-coin{color:#2E9E8F}
.isl-times{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.isl-times .past{opacity:.5;text-decoration:line-through}
.isl-times .next{color:var(--accent-fg);font-weight:700}
.isl-msg{font-size:12.5px;color:var(--muted)}
.isl-list.voy .isl-chip b{font-weight:700;font-size:12px;margin-right:2px}
.isl-list.voy .isl-chip.past{opacity:.45;text-decoration:line-through;text-decoration-thickness:1px}
.isl-list.voy .isl-chip.next{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-fg)}
.exp-item.island .chk{align-self:center}
/* ── 스펙 현황(신) ── */
:root{--fx-green:#5E9A00;--fx-orange:#D96300;--fx-purple:#9B4FB8;--fx-blue:#1E88B8;--fx-lock:#8A8F99;--s2-box:#373C47;--s2-head:#2E8A00;--s2-num:#3F51B5;--s2-bar:#AF29C5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--fx-green:#9CF006;--fx-orange:#F67500;--fx-purple:#CF93E2;--fx-blue:#69CAEC;--fx-lock:#7F7F7F;--s2-head:#50E307;--s2-num:#93B6FF}}
:root[data-theme="dark"]{--fx-green:#9CF006;--fx-orange:#F67500;--fx-purple:#CF93E2;--fx-blue:#69CAEC;--fx-lock:#7F7F7F;--s2-head:#50E307;--s2-num:#93B6FF}
.page.s2{max-width:1060px}
.s2-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;color:var(--s2-head);font-size:22px;font-weight:500;border-bottom:2px solid var(--s2-head);padding-bottom:6px}
.s2-top span{display:flex;align-items:baseline;gap:8px}
.s2-top input{width:6.5em;border:0;border-bottom:1px dashed color-mix(in srgb,var(--s2-head) 60%,transparent);background:transparent;color:inherit;font:inherit;font-variant-numeric:tabular-nums;padding:0 2px}
.s2-top input:focus{outline:none;border-bottom-style:solid}
.s2-top input::placeholder,.s2-ref input::placeholder{color:inherit;opacity:.35}
.s2-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;align-items:start}
@media (max-width:820px){.s2-cols{grid-template-columns:minmax(0,1fr)}}
.s2-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.s2-h{margin:0 auto;font-size:26px;font-weight:800;padding:0 40px 4px;border-bottom:2px solid var(--fg);letter-spacing:-.02em}
.s2-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px 10px}
.s2-item{grid-column:span 2;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.s2-item:nth-child(7){grid-column:2 / span 2}
.s2-badge{width:100%;max-width:120px;height:32px;border-radius:7px;border:2px solid var(--g-line);background:var(--s2-box);color:var(--g-ink);font-weight:700;font-size:14px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s2-badge:hover{filter:brightness(1.12)}
.s2-dots{display:flex;gap:6px;border:0;background:none;padding:2px 4px;border-radius:6px}
.s2-dots i{width:8px;height:8px;border-radius:50%}
.s2-dots:hover{background:var(--surface-done)}
.s2-gems{display:flex;gap:1px}
.s2-gem{border:0;background:none;padding:0;width:21px;height:21px;display:grid;place-items:center;border-radius:4px}
.s2-gem img{width:19px;height:19px;display:block}
.s2-gem:hover{background:var(--surface-done)}
.s2-ref{display:flex;align-items:baseline;justify-content:center;gap:3px;color:var(--s2-num);font-variant-numeric:tabular-nums}
.s2-ref input{border:0;background:transparent;color:inherit;font:inherit;padding:0 1px;border-radius:4px;cursor:text}
.s2-ref input:focus{outline:none;background:color-mix(in srgb,var(--s2-num) 14%,transparent)}
.s2-ref .big{width:2.1ch;font-size:19px;text-align:right}
.s2-ref .small{width:4.6ch;font-size:11.5px;text-align:left}
.s2-det{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.s2-dh{display:block;width:100%;min-height:36px;border-radius:7px;border:2px solid var(--g-line,#C2A866);background:var(--s2-box);color:var(--g-ink,#DAD2BC);font-weight:700;font-size:15px;text-align:center;padding:6px 10px}
.s2-dh.empty{border-color:#2F91C7;color:#9FB7FF;font-weight:600}
.s2-pick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;max-width:420px;width:100%;margin:0 auto}
.s2-pick .s2-badge{grid-column:span 2;max-width:none}
.s2-pick .s2-badge:nth-child(7){grid-column:2 / span 2}
.s2-rows{display:flex;flex-direction:column;gap:4px}
.s2-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center;min-height:30px;font-size:15px}
.s2-row select{justify-self:end;max-width:100%;appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--fg);font:inherit;font-weight:600;text-align:right;text-align-last:right;padding:2px 4px;border-radius:5px;cursor:pointer}
.s2-row select:hover,.s2-row select:focus{background:var(--surface-done);outline:none}
.s2-row select option{background:var(--surface);color:var(--fg)}
.s2-fxv{justify-self:start;width:8ch;border:0;background:transparent;font:inherit;font-weight:700;font-variant-numeric:tabular-nums;padding:2px 4px;border-radius:5px;cursor:text}
.s2-fxv:hover,.s2-fxv:focus{background:var(--surface-done);outline:none}
.s2-row.locked{display:block;border:0;background:none;color:var(--fx-lock);text-align:center;font:inherit;font-size:15px;border-radius:5px}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

/* ───────────── Firebase 연결 정보 (Firebase 콘솔 → 웹 앱의 firebaseConfig) ───────────── */
const firebaseConfig = {
  apiKey: "AIzaSyBAj13bBs7aCehZWaMvAJjitt-yC7nAcmE",
  authDomain: "loacheck-6fdfd.firebaseapp.com",
  projectId: "loacheck-6fdfd",
  storageBucket: "loacheck-6fdfd.firebasestorage.app",
  messagingSenderId: "666551983975",
  appId: "1:666551983975:web:6fc788503e765de0aed9c2",
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const fdb = getFirestore(fbApp);

/* ───────────── 고정 데이터 ───────────── */
// 레이드 관문별 골드 (패치로 바뀌면 여기 숫자만 수정)
const RAIDS = {
  "2막":[5500,11000], "3막":[4000,7000,10000], "4막":[10000,17000],
  "종막":[11000,21000], "세르카":[13000,19000]
};
const raidTitlesFor = lv => lv >= 1710 ? ["4막","종막","세르카"] : ["2막","3막","4막"];
const DEFAULT_ROSTER = [
  {id:"c1",name:"라바샥",job:"소울이터",level:1710,chaNum:1},
  {id:"c2",name:"베샤몔",job:"데모닉",level:1710,chaNum:2},
  {id:"c3",name:"아크틕",job:"차원술사",level:1710,chaNum:3},
  {id:"c4",name:"예배댱",job:"발키리",level:1700,chaNum:4},
  {id:"c5",name:"세라믝",job:"기상술사",level:1710,chaNum:5},
  {id:"c6",name:"아이언맨이될래요",job:"스카우터",level:1710,chaNum:6},
];
const MAX_GAUGE=5, PARADISE_MAX=5, SIGN_MAX=3, HONOR_MAX=3, HOURGLASS_LV=1730, DISPATCH_MAX=2;
const MAX_LIFE=11500, LIFE_TICK=30, TICK_MS=600000, LIFE_USE=4240;
const DAYS=["일","월","화","수","목","금","토"];
const CHAOS_DAYS=[1,4,6,0], BOSS_DAYS=[2,5,0];

/* ───────────── 로아 시간 (한국 06:00 기준) ───────────── */
// 게임 날짜 = 1970-01-01부터 센 날 수. 한국(+9h)에서 6시간 빼면 UTC+3h.
const loaDay = (t=Date.now()) => Math.floor((t + 3*3600e3) / 86400e3);
const dow = d => ((d + 4) % 7 + 7) % 7;               // 0=일 … 3=수
const weekStart = d => d - ((dow(d) - 3 + 7) % 7);    // 가장 최근 수요일
function dayLabel(d){ const x=new Date(d*86400e3); return `${x.getUTCMonth()+1}월 ${x.getUTCDate()}일 (${DAYS[dow(d)]})`; }

/* ───────────── 상태 ───────────── */
const INV_DEFAULT = [{id:"r1", name:"지옥 열쇠"}, {id:"r2", name:"큐브 입장권"}];
function freshState(){
  return { v:1,
    settings:{guardian:true, kurzan:true, guild:true, raids:true, paradise:false, medal:false, sign:false, honor:true, hourglass:true, estateBox:true, serka:true, dispatch:true, island:true, voyage:true, sortOnlyAll:false},
    roster: DEFAULT_ROSTER.map(c=>({...c})), progress:{},
    expedition:{chaos:false, field:false, estateBox:false, serka:false, dispatch:0, island:false, voyage:false},
    life:{energy:MAX_LIFE, ts:Date.now()},
    lastDaily: loaDay(), lastWeekly: loaDay(), updatedAt: Date.now(), apiKey: "",
    specs: {}, specHistory: {weekStart: weekStart(loaDay()), base: {}, archive: []},
    inv: {rows: INV_DEFAULT.map(r=>({...r})), counts: {}} };
}
function normalize(d){
  const s=freshState(); if(!d || typeof d!=="object") return s;
  return { v:1,
    settings:{...s.settings, ...(d.settings||{})},
    roster: Array.isArray(d.roster) ? d.roster.map(c=>({id:String(c.id), name:String(c.name??""), job:String(c.job??""), level:Number(c.level)||0, chaNum:Number(c.chaNum)||0})) : s.roster,
    progress: (d.progress && typeof d.progress==="object") ? d.progress : {},
    expedition:{chaos:!!d.expedition?.chaos, field:!!d.expedition?.field, estateBox:!!d.expedition?.estateBox, serka:!!d.expedition?.serka, island:!!d.expedition?.island, voyage:!!d.expedition?.voyage, dispatch:Math.max(0,Math.min(DISPATCH_MAX,Number(d.expedition?.dispatch)||0))},
    life:{energy:Number(d.life?.energy ?? MAX_LIFE), ts:Number(d.life?.ts || Date.now())},
    lastDaily: Number.isFinite(d.lastDaily) ? d.lastDaily : loaDay(),
    lastWeekly: Number.isFinite(d.lastWeekly) ? d.lastWeekly : loaDay(),
    updatedAt: Number(d.updatedAt)||0,
    apiKey: typeof d.apiKey==="string" ? d.apiKey : "",
    specs: (d.specs && typeof d.specs==="object") ? d.specs : {},
    specHistory: {
      weekStart: Number.isFinite(d.specHistory?.weekStart) ? d.specHistory.weekStart : weekStart(loaDay()),
      base: (d.specHistory?.base && typeof d.specHistory.base==="object") ? d.specHistory.base : {},
      archive: Array.isArray(d.specHistory?.archive) ? d.specHistory.archive : [] },
    inv: normInv(d.inv) };
}
// 큐브&지옥: 행 이름은 원정대 공통(rows), 개수는 캐릭터별(counts[캐릭터 id][행 id])
function normInv(v){
  if(!v || typeof v!=="object" || !Array.isArray(v.rows)) return {rows: INV_DEFAULT.map(r=>({...r})), counts: {}};
  const rows = v.rows.filter(r=>r && r.id!=null).map(r=>({id:String(r.id), name:String(r.name??"")}));
  const counts = {};
  if(v.counts && typeof v.counts==="object") for(const [cid, m] of Object.entries(v.counts)){
    if(!m || typeof m!=="object") continue; counts[cid] = {};
    for(const [rid, n] of Object.entries(m)){ const x = Math.max(0, Math.floor(Number(n)||0)); if(x) counts[cid][rid] = x; }
  }
  return {rows, counts};
}
function P(id){
  const p = S.progress[id] ||= {};
  p.daily ||= {};
  // 빈 값만 채움 (객체를 새로 만들면, 애니메이션 중에 기다리던 체크가 옛 객체에 들어가 사라지는 문제가 있었음)
  for (const k of ["guardian","kurzan"]){ const h = (p.daily[k] ||= {}); h.done ??= false; h.gauge ??= 0; h.used ??= 0; }
  const g = (p.daily.guild ||= {}); g.done ??= false; delete g.gauge; delete g.used;   // 예전 버그로 길드에 붙은 빈 게이지 값 정리
  p.raids ||= {};
  if(!Number.isFinite(p.paradise)) p.paradise = PARADISE_MAX;
  p.medal = !!p.medal;
  if(!Number.isFinite(p.sign)) p.sign = 0;
  if(!Number.isFinite(p.honor)) p.honor = HONOR_MAX;   // 명예 부여: 3/3에서 시작, 0이면 완료
  p.hourglass = !!p.hourglass;                          // 할의 모래시계 (1730 이상)
  return p;
}

let S = freshState();
let localKey = "loacheck-state";
const ui = { page:"main", specId:null, menu:false, drafts:{}, showClearedDaily:new Set(), showCleared:new Set(), expOpen:true, expKey:"", view:"daily", edit:false, sortSlot:false, settings:false, lifeInput:"", flash:null, armDel:null,
  apiKeyInput:"", apiName:"", apiFound:null, apiChecked:new Set(), apiMsg:"", apiErr:false, apiBusy:false,
  authReady:false, user:null, signUp:false, loginEmail:"", loginPw:"", loginMsg:"", loginOk:false, busy:false };
try{ const u=JSON.parse(localStorage.getItem("loacheck-ui")||"{}"); ui.view=u.view==="weekly"?"weekly":"daily"; ui.sortSlot=!!u.sortSlot; ui.pin=u.pin||null; }catch(e){}
const saveUi = () => { try{ localStorage.setItem("loacheck-ui", JSON.stringify({view:ui.view, sortSlot:ui.sortSlot, alarm:ui.alarm!==false, volume:ui.volume, pin:ui.pin||null})); }catch(e){} };

/* ───────────── 초기화 (매일 06시 / 수요일 06시) ───────────── */
function applyResets(){
  const today = loaDay(); let changed = false;
  const passed = today - S.lastDaily;
  if (passed >= 1){
    for (const c of S.roster){
      const p = P(c.id);
      for (const k of ["guardian","kurzan"]){
        const h = p.daily[k];
        const missed = h.done ? passed - 1 : passed;   // 마지막 날 했으면 그날은 휴게 안 쌓임
        h.gauge = Math.min(MAX_GAUGE, h.gauge + 0.5*missed);
        h.done = false; h.used = 0;
      }
      p.daily.guild.done = false;
    }
    S.expedition = {...S.expedition, chaos:false, field:false, dispatch:0, island:false, voyage:false};   // 영지 상자(주간)는 그대로
    S.lastDaily = today; changed = true;
  } else if (passed < 0){ S.lastDaily = today; changed = true; }
  if (S.lastWeekly < weekStart(today)){
    for (const c of S.roster){ const p=P(c.id); p.raids={}; p.paradise=PARADISE_MAX; p.medal=false; p.sign=0; p.honor=HONOR_MAX; p.hourglass=false; }
    S.expedition.estateBox = false; S.expedition.serka = false;   // 주간 원정대 숙제
    S.lastWeekly = today; changed = true;
  }
  if (specRollover()) changed = true;
  return changed;
}

/* ───────────── 스펙 현황 (앱 data/Spec.kt와 같은 규칙) ───────────── */
const GRID = [["oSun","질서","해"],["cSun","혼돈","해"],["oMoon","질서","달"],["cMoon","혼돈","달"],["oStar","질서","별"],["cStar","혼돈","별"]];
const GRID_VALUES = [10,14,17,18,19,20];
const PARTS = [["helmet","투구"],["shoulder","견갑"],["chest","상의"],["pants","하의"],["gloves","장갑"],["weapon","무기"]];
const GEAR = {tremor:{name:"운명의 전율", base:1675}, fury:{name:"운명의 업화", base:1590}};
const ADV_MAX = 4000, REFINE_MAX = 25;
const fin = v => typeof v==="number" && Number.isFinite(v);
function blankSpec(){
  return { gear:null, grid:Object.fromEntries(GRID.map(g=>[g[0],null])),
    refine:Object.fromEntries(PARTS.map(p=>[p[0],{lv:null,exp:0}])),
    adv:Object.fromEntries(PARTS.map(p=>[p[0],null])), power:null, brace:null };
}
function normSpec(x){
  const b = blankSpec(); if(!x || typeof x!=="object") return b;
  b.gear = (x.gear==="tremor"||x.gear==="fury") ? x.gear : null;
  for(const [k] of GRID){ const v=x.grid?.[k]; b.grid[k] = GRID_VALUES.includes(v) ? v : null; }
  for(const [k] of PARTS){
    const r = x.refine?.[k] || {};
    b.refine[k] = {lv: fin(r.lv) ? r.lv : null, exp: fin(r.exp) ? r.exp : 0};
    b.adv[k] = fin(x.adv?.[k]) ? x.adv[k] : null;
  }
  b.power = fin(x.power) ? x.power : null;
  b.brace = fin(x.brace) ? x.brace : null;   // 팔찌 점수
  return b;
}
const SPEC = id => (S.specs[id] = normSpec(S.specs[id]));
const advStage = v => Math.min(40, Math.floor((v||0)/100));
// 아이템 레벨 = 6부위 평균 (소수 셋째 자리부터 버림), 부위 = 기본값(전율 1675/업화 1590) + 재련×5 (+ 업화만 상급재련 단계×1). 재련이 하나라도 비면 계산 안 함.
function specItemLevel(sp){
  if(PARTS.some(([k])=>sp.refine[k].lv==null)) return null;
  const gear = sp.gear||"tremor", base = GEAR[gear].base;
  const avg = PARTS.reduce((a,[k])=>a + base + sp.refine[k].lv*5 + (gear==="fury" ? advStage(sp.adv[k]) : 0), 0) / 6;
  return Math.floor(avg*100 + 1e-6) / 100;   // 게임처럼 버림 (1734.1666 → 1734.16)
}
const f2 = v => (Math.round(v*100)/100).toFixed(2);
const pad4 = v => String(v).padStart(4,"0");
const refText = r => r.lv + (r.exp>0 ? `(${f2(r.exp)})` : "");
// 주 시작 시점(base) → 지금(cur) 변화 기록. 처음 입력(빈칸→값)은 기록하지 않음.
function specDiffLines(b, c){
  const out = [];
  for(const [k,col,row] of GRID) if(b.grid[k]!=null && c.grid[k]!=null && c.grid[k]>b.grid[k]) out.push(`${col}의 ${row} ${b.grid[k]} -> ${c.grid[k]}`);
  for(const [k,name] of PARTS){
    const x=b.refine[k], y=c.refine[k];
    if(x.lv!=null && y.lv!=null && (x.lv!==y.lv || f2(x.exp)!==f2(y.exp))) out.push(`${name} 재련 ${refText(x)} -> ${refText(y)}`);
  }
  for(const [k,name] of PARTS) if(b.adv[k]!=null && c.adv[k]!=null && b.adv[k]!==c.adv[k]) out.push(`${name} 상급재련 ${pad4(b.adv[k])} -> ${pad4(c.adv[k])}`);
  const li=specItemLevel(b), lc=specItemLevel(c);
  if(li!=null && lc!=null && f2(li)!==f2(lc)) out.push(`아이템 레벨 ${f2(li)} -> ${f2(lc)}`);
  if(b.power!=null && c.power!=null && f2(b.power)!==f2(c.power)) out.push(`전투력 ${f2(b.power)} -> ${f2(c.power)}`);
  if(b.brace!=null && c.brace!=null && b.brace!==c.brace) out.push(`팔찌 점수 ${fmt(b.brace)} -> ${fmt(c.brace)}`);
  return out;
}
// 처음 입력한 값은 이번 주 시작값으로 삼음
function syncBase(id){
  const cur = SPEC(id), h = S.specHistory, b = normSpec(h.base[id]);
  if(b.gear==null && cur.gear!=null) b.gear = cur.gear;
  for(const [k] of GRID) if(b.grid[k]==null && cur.grid[k]!=null) b.grid[k] = cur.grid[k];
  for(const [k] of PARTS){
    if(b.refine[k].lv==null && cur.refine[k].lv!=null) b.refine[k] = {...cur.refine[k]};
    if(b.adv[k]==null && cur.adv[k]!=null) b.adv[k] = cur.adv[k];
  }
  if(b.power==null && cur.power!=null) b.power = cur.power;
  if(b.brace==null && cur.brace!=null) b.brace = cur.brace;
  h.base[id] = b;
}
// 수요일 06시가 지나면: 지난주 기록을 보관함(archive)으로 옮기고, 지금 스펙을 새 주의 시작값으로
function specRollover(){
  const ws = weekStart(loaDay()), h = S.specHistory;
  if(h.weekStart >= ws) return false;
  const chars = [];
  for(const c of [...S.roster].sort(bySlot)){
    const lines = specDiffLines(normSpec(h.base[c.id]), SPEC(c.id));
    if(lines.length) chars.push({name:c.name, lines});
  }
  if(chars.length) h.archive.unshift({weekStart:h.weekStart, chars});
  h.archive = h.archive.slice(0, 26);
  h.base = Object.fromEntries(S.roster.map(c=>[c.id, JSON.parse(JSON.stringify(SPEC(c.id)))]));
  h.weekStart = ws;
  return true;
}

/* ───────────── 계산 ───────────── */
function toggleHw(h){
  if(!("gauge" in h)){ h.done = !h.done; return; }   // 길드 출석은 휴게 게이지가 없음
  if(!h.done){ const cost = h.gauge >= 1 ? 1 : 0; h.gauge -= cost; h.used = cost; h.done = true; }
  else { h.gauge = Math.min(MAX_GAUGE, h.gauge + (h.used||0)); h.used = 0; h.done = false; }
}
// 생활의 기운: 실제로는 1분에 3씩 꾸준히 쌓임 (10분에 30).
// 게임 화면은 10분마다 몰아서 보여주는데, 그 기준 시각이 캐릭터 선택·장소 이동 때마다 바뀌고 그때 쌓인 만큼(1분당 3) 정산됨
// (2026-11-23 사용자 확인: 캐릭터 변경 때 +15, +20 같은 값이 오름) → 사이트는 '실제로 쌓인 양'을 보여줌. 게임 화면은 이보다 0~29 늦게 따라옴
// exact = 소수까지 포함한 값 (저장할 때 이 값을 써서 오차가 쌓이지 않게), cur = 화면 값(버림)
function lifeStatus(now=Date.now()){
  const el = Math.max(0, now - S.life.ts);
  const exact = Math.max(0, Math.min(MAX_LIFE, S.life.energy + el * LIFE_TICK / TICK_MS));
  const cur = Math.floor(exact + 1e-9);
  const mins = exact >= MAX_LIFE ? 0 : Math.ceil((MAX_LIFE - exact) / LIFE_TICK * TICK_MS / 60000);
  return {cur, exact, mins};
}
function raidsOf(c){
  const p = P(c.id);
  return raidTitlesFor(c.level).map(t=>{
    const gates = RAIDS[t] || [30000];
    const cleared = Math.min(p.raids[t]||0, gates.length);
    return {title:t, gates, cleared, full: cleared>=gates.length,
      earned: gates.slice(0,cleared).reduce((a,b)=>a+b,0), max: gates.reduce((a,b)=>a+b,0)};
  });
}
// 설정의 '표시할 숙제'에서 켠 것만 (앱 AppSettings.showsDaily / visibleGaugeHomeworks와 같음)
const shownGauge = () => ["guardian","kurzan"].filter(k=>S.settings[k]!==false);
const shownDaily = () => [...shownGauge(), ...(S.settings.guild ? ["guild"] : [])];
const dailyDone = c => { const d=P(c.id).daily; return shownDaily().every(k=>d[k].done); };
const hasHourglass = c => (Number(c.level)||0) >= HOURGLASS_LV;
const weeklyDone = c => { const p=P(c.id); return (S.settings.raids===false || raidsOf(c).every(r=>r.full)) && (!S.settings.paradise||p.paradise===0) && (!S.settings.medal||p.medal) && (!S.settings.sign||p.sign>=SIGN_MAX)
  && (S.settings.honor===false||p.honor===0) && (S.settings.hourglass===false||!hasHourglass(c)||p.hourglass); };
const gaugeSum = c => { const d=P(c.id).daily; return shownGauge().reduce((a,k)=>a + d[k].gauge + (S.settings.sortOnlyAll ? d[k].used : 0), 0); };
// 아이템 레벨 표시: 1712.50 (앱 formatItemLevel과 같음)
const fmtLv = v => (Number(v)||0).toFixed(2);
// '카던' 이름은 레벨에 따라 다름 (저장 키는 그대로 kurzan, 앱 chaosContentName과 같음)
const chaosName = lv => (Number(lv)||0) < 1640 ? "카오스 던전" : (Number(lv)||0) < 1730 ? "쿠르잔 전선" : "혼돈의 균열";
const goldOf = c => raidsOf(c).reduce((a,r)=>({earned:a.earned+r.earned, max:a.max+r.max}), {earned:0,max:0});
const bySlot = (a,b) => a.chaNum-b.chaNum || a.name.localeCompare(b.name,"ko");
// 캐릭터 선택에서 고른 캐릭터는 일일·주간 모두 맨 위
const pinCmp = (a,b) => (b.id===ui.pin) - (a.id===ui.pin);
function dailyCmp(a,b){ const p=pinCmp(a,b); if(p) return p; if(ui.sortSlot) return bySlot(a,b); return (dailyDone(a)-dailyDone(b)) || (gaugeSum(b)-gaugeSum(a)) || a.name.localeCompare(b.name,"ko"); }
function weeklyCmp(a,b){ const p=pinCmp(a,b); if(p) return p; if(ui.sortSlot) return bySlot(a,b); const ga=goldOf(a), gb=goldOf(b); return (weeklyDone(a)-weeklyDone(b)) || ((gb.max-gb.earned)-(ga.max-ga.earned)) || a.name.localeCompare(b.name,"ko"); }

// 정렬은 0.4초 늦게 따라감 (체크하자마자 카드가 튀지 않게)
const dOrd={order:null,timer:null}, wOrd={order:null,timer:null}, wMemo={key:null,order:null};
function settle(o, target, hold){
  const same = o.order && o.order.length===target.length && target.every(id=>o.order.includes(id));
  if(!same){ clearTimeout(o.timer); o.timer=null; o.order=target; return o.order; }
  if(o.order.join()===target.join()){ clearTimeout(o.timer); o.timer=null; return o.order; }
  if(!hold){ clearTimeout(o.timer); o.timer=setTimeout(()=>{ o.timer=null; o.order=null; render(); }, 400); }
  return o.order;
}
function weeklyTarget(){
  // 관문 하나 깰 때마다 움직이지 않도록, 레이드 완료/주간 완료가 바뀔 때만 다시 계산
  const key = (ui.sortSlot?"s":"g") + (ui.pin||"") + JSON.stringify(S.settings) + S.roster.map(c=>c.id+":"+raidsOf(c).map(r=>+r.full).join("")+(+weeklyDone(c))).join("|");
  if(key!==wMemo.key) wMemo.key=key, wMemo.order=[...S.roster].sort(weeklyCmp).map(c=>c.id);
  return wMemo.order;
}

/* ───────────── 저장 & 기기 간 동기화 (Firebase) ───────────── */
// 저장 위치: users/{계정id}/data/state  — 휴대폰 앱과 같은 문서, 같은 형식
let docRef=null, unsub=null, initialSynced=false, dirty=false, saving=false, saveAgain=false, lastSavedKey="", saveTimer=null, loadTimer=null, syncState="connecting";
const SYNC_TEXT = {connecting:"동기화 연결 중…", saving:"저장 중…", synced:"휴대폰과 동기화됨", error:"동기화 실패 · 이 브라우저에는 저장됨", slow:"서버 응답이 늦어요"};
// 키 순서와 저장 시각을 무시하고 내용만 비교
const sortKeys = v => Array.isArray(v) ? v.map(sortKeys) : (v && typeof v==="object") ? Object.keys(v).sort().reduce((o,k)=>(o[k]=sortKeys(v[k]),o),{}) : v;
const keyOf = obj => JSON.stringify(sortKeys({...obj, updatedAt:0}));
function setSync(s){ syncState=s; const el=document.querySelector("[data-sync]"); if(el){ el.dataset.s=s; el.textContent=SYNC_TEXT[s]; } }
function saveLocal(){ try{ localStorage.setItem(localKey, JSON.stringify(S)); }catch(e){} }
// 애니메이션이 끝나길 기다리는 체크들. 다른 숙제를 연달아 눌러 화면이 다시 그려져도 체크가 사라지지 않도록,
// 저장(commit)하기 전에 기다리던 체크를 먼저 모두 반영함
const pendingApply = new Set();
function delayedApply(apply, ms){
  const job = { run(){ if(job.done) return false; job.done = true; pendingApply.delete(job); apply(); return true; } };
  pendingApply.add(job);
  setTimeout(()=>{ if(job.run()) commit(); }, ms);   // 애니메이션과 상관없이 시간이 되면 반드시 반영
}
function commit(){ [...pendingApply].forEach(j=>j.run()); S.updatedAt=Date.now(); saveLocal(); render(); dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush, 500); }
async function flush(){
  if(!docRef || !initialSynced) return;
  if(saving){ saveAgain=true; return; }
  saving=true; setSync("saving");
  const snapshot = JSON.parse(JSON.stringify(S)), key = keyOf(snapshot);
  try{ await setDoc(docRef, snapshot); lastSavedKey=key; if(keyOf(S)===key) dirty=false; setSync("synced"); }
  catch(e){ setSync("error"); setTimeout(()=>{ if(dirty) flush(); }, 3000); }
  finally{ saving=false; if(saveAgain){ saveAgain=false; flush(); } }
}
function onSnap(snap){
  if(snap.metadata.hasPendingWrites) return;
  const definitive = !snap.metadata.fromCache;
  if(definitive) clearTimeout(loadTimer);
  const first = definitive && !initialSynced;
  if(definitive) initialSynced = true;
  if(!snap.exists()){ if(first) flush(); else if(definitive) setSync("synced"); return; }   // 처음이면 이 브라우저 기록을 올림
  const data = snap.data(), key = keyOf(data);
  if(key===lastSavedKey){ if(definitive) setSync("synced"); return; }
  if(!first && (dirty || saving)) return;   // 방금 여기서 바꾼 게 더 최신 → 곧 덮어씀
  S = normalize(data); lastSavedKey=key; dirty=false; clearTimeout(saveTimer);
  dOrd.order=wOrd.order=null; wMemo.key=null;
  const changed = applyResets(); saveLocal(); render();
  setSync(definitive ? "synced" : "connecting");
  if(changed) commit();
  calLoad(false);
}
onAuthStateChanged(auth, user=>{
  if(unsub){ unsub(); unsub=null; }
  clearTimeout(loadTimer); clearTimeout(saveTimer);
  ui.authReady = true; ui.user = user; ui.busy = false;
  docRef = null; initialSynced = false; dirty = false; saving = false; lastSavedKey = "";
  if(user){
    localKey = "loacheck-state-" + user.uid;
    try{ S = normalize(JSON.parse(localStorage.getItem(localKey))); }catch(e){ S = freshState(); }
    if(applyResets()) saveLocal();
    dOrd.order=wOrd.order=null; wMemo.key=null;
    docRef = doc(fdb, "users", user.uid, "data", "state");
    setSync("connecting");
    loadTimer = setTimeout(()=>setSync("slow"), 10000);
    unsub = onSnapshot(docRef, {includeMetadataChanges:true}, onSnap, ()=>{ clearTimeout(loadTimer); setSync("error"); });   // 앱과 같게: 서버 연결 신호도 받음
  }
  render();
});

/* ───────────── 로스트아크 Open API ───────────── */
// 앱 data/LostArkApi.kt와 같은 동작. 원정대 목록: GET /characters/{이름}/siblings
const LOA_API = "https://developer-lostark.game.onstove.com";
async function fetchSiblings(name){
  if(!S.apiKey) throw new Error("먼저 API 키를 저장해 주세요.");
  if(!name.trim()) throw new Error("캐릭터 이름을 입력해 주세요.");
  let res;
  try{
    res = await fetch(`${LOA_API}/characters/${encodeURIComponent(name.trim())}/siblings`,
      {headers:{accept:"application/json", authorization:"bearer "+S.apiKey}});
  }catch(e){
    throw new Error("웹에서는 로스트아크 서버에 연결하지 못했어요. 휴대폰 앱의 설정에서 불러오면 웹에도 자동으로 반영돼요.");
  }
  if(res.status===401) throw new Error("API 키가 올바르지 않아요. 키를 다시 확인해 주세요.");
  if(res.status===429) throw new Error("요청이 너무 많아요. 1분 뒤 다시 시도해 주세요.");
  if(res.status===503) throw new Error("로스트아크 서버 점검 중이에요. 나중에 다시 시도해 주세요.");
  if(!res.ok) throw new Error(`정보를 불러오지 못했어요. (오류 ${res.status})`);
  const data = await res.json().catch(()=>null);
  if(!Array.isArray(data) || !data.length) throw new Error("캐릭터를 찾을 수 없어요. 이름을 확인해 주세요.");
  return data.map(o=>({server:String(o.ServerName||""), name:String(o.CharacterName||""), job:String(o.CharacterClassName||""),
    level: parseFloat(String(o.ItemAvgLevel||"0").replace(/,/g,""))||0})).sort((a,b)=>b.level-a.level);
}
const newId = () => "c" + Math.random().toString(36).slice(2,12);
// 체크한 캐릭터는 추가/갱신, 불러온 목록에 있지만 체크 해제한 캐릭터는 제거, 목록에 없는 캐릭터는 그대로
function applyRosterImport(found, checked){
  const byName = Object.fromEntries(found.map(f=>[f.name,f]));
  const next = [];
  for(const c of S.roster){
    const f = byName[c.name];
    if(!f) next.push(c);
    else if(checked.has(c.name)) next.push({...c, job:f.job, level:f.level});
    else delete S.progress[c.id];
  }
  let num = Math.max(0, ...S.roster.map(c=>c.chaNum)) + 1;
  for(const f of found) if(checked.has(f.name) && !S.roster.some(c=>c.name===f.name)) next.push({id:newId(), name:f.name, job:f.job, level:f.level, chaNum:num++});
  S.roster = next;
}
async function apiSearch(){
  ui.apiBusy=true; ui.apiMsg="불러오는 중…"; ui.apiErr=false; render();
  try{
    const list = await fetchSiblings(ui.apiName);
    const main = list.find(f=>f.name===ui.apiName.trim())?.server;
    ui.apiFound = list.sort((a,b)=>((a.server===main?0:1)-(b.server===main?0:1)) || b.level-a.level);
    ui.apiChecked = new Set(list.filter(f=>S.roster.some(c=>c.name===f.name)).map(f=>f.name));
    ui.apiMsg = "원정대에 넣을 캐릭터를 체크하고 '적용'을 누르세요. 체크를 해제한 캐릭터는 목록에서 빠져요.";
  }catch(e){ ui.apiMsg=e.message; ui.apiErr=true; }
  ui.apiBusy=false; render();
}
async function apiRefresh(){
  if(!S.roster.length) return;
  ui.apiBusy=true; ui.apiMsg="레벨을 불러오는 중…"; ui.apiErr=false; render();
  try{
    const first = [...S.roster].sort(bySlot)[0];
    const byName = Object.fromEntries((await fetchSiblings(first.name)).map(f=>[f.name,f]));
    let changed = 0;
    S.roster = S.roster.map(c=>{ const f=byName[c.name]; if(!f || (f.job===c.job && f.level===c.level)) return c; changed++; return {...c, job:f.job, level:f.level}; });
    ui.apiMsg = changed ? `${changed}명의 직업·레벨을 갱신했어요.` : "이미 최신 레벨이에요.";
    if(changed) commit();
  }catch(e){ ui.apiMsg=e.message; ui.apiErr=true; }
  ui.apiBusy=false; render();
}
