function header(){
  return `<header class="top"><div class="top-in">
    <div class="brand"><button class="brand-home" data-act="go-home" aria-label="일일·주간 숙제 화면으로">${logoImgs("logo-head")}</button><span class="sync" data-sync data-s="${syncState}">${SYNC_TEXT[syncState]}</span></div>
    ${navBar()}
    ${ui.page==="main" ? `<div class="tabs" role="tablist">
      <button role="tab" aria-selected="${ui.view==="daily"}" data-act="view" data-v="daily">일일</button>
      <button role="tab" aria-selected="${ui.view==="weekly"}" data-act="view" data-v="weekly">주간</button>
    </div>` : ""}
    <div class="tools" ${ui.page==="main" ? "" : 'style="margin-left:auto"'}>
      ${ui.page==="main" ? `<button class="tool" aria-pressed="${ui.sortSlot}" data-act="slot" aria-label="캐릭터 선택창 순서">${ICON.slot}<span class="t">선택창 순</span></button>` : ""}
    </div>
  </div></header>`;
}

// 로고 옆 이동 버튼 (메뉴 창 대신). 누르면 바로 그 화면으로
function navBar(){
  const b = (act, icon, label, current) => `<button class="nav-btn" data-act="${act}" ${current?'aria-current="page"':""}>${icon}<span>${label}</span></button>`;
  return `<nav class="nav" aria-label="화면 이동">
    ${b("go-main", ICON.list, "숙제", ui.page==="main" && !ui.settings)}
    ${b("go-specs", ICON.spec, "스펙 현황(구)", (ui.page==="specs"||ui.page==="spec"||ui.page==="history") && !ui.settings)}
    ${b("go-spec2", ICON.spec, "스펙 현황(신)", ui.page==="spec2" && !ui.settings)}
    ${b("go-inv", ICON.box, "큐브&지옥", ui.page==="inv" && !ui.settings)}
    ${b("go-brace", ICON.calc, "팔찌 점수", ui.page==="brace" && !ui.settings)}
    ${b("go-fusion", ICON.calc, "융화재료 계산기", ui.page==="fusion" && !ui.settings)}
    ${b("settings", ICON.gear, "설정", ui.settings)}
  </nav>`;
}

// 캐릭터 선택: 선택창 순서로 3칸씩. 누르면 그 캐릭터가 맨 위, 다시 누르면 원래 순서
function pickerBar(){
  if(!S.roster.length) return "";
  if(ui.pin && !S.roster.some(c=>c.id===ui.pin)) ui.pin = null;
  return `<nav class="picker" aria-label="캐릭터 선택">${[...S.roster].sort(bySlot).map(c=>
    // 바로가기 버튼 안에 '스펙 현황' 버튼 (버튼 안의 버튼이라 바깥은 div + role=button)
    `<div class="pick" role="button" tabindex="0" data-act="pin" data-id="${c.id}" aria-pressed="${ui.pin===c.id}"><span class="pick-txt"><b>${esc(c.name)}</b><small><span class="pj">${esc(c.job)} · </span>${fmtLv(c.level)}</small></span><button class="pick-spec" data-act="open-spec" data-id="${c.id}" aria-label="${esc(c.name)} 스펙 현황">스펙 현황</button></div>`).join("")}</nav>`;
}

function dailyPanel(){
  const today = loaDay(), d = dow(today), life = lifeStatus();
  const eta = life.mins<=0 ? "가득 참" : life.mins>=60 ? `${Math.floor(life.mins/60)}시간 ${life.mins%60}분 뒤 가득` : `${life.mins}분 뒤 가득`;
  // 생기 숫자를 눌러 바로 고침 → 오른쪽에 저장 버튼이 나타남 (엔터로도 저장)

  const order = settle(dOrd, [...S.roster].sort(dailyCmp).map(c=>c.id), ui.edit);
  const byId = Object.fromEntries(S.roster.map(c=>[c.id,c]));
  const cards = order.map(id=>byId[id]).filter(Boolean).map(dailyCard).join("");

  return `<section class="panel panel-daily">
    <div class="panel-head"><h2>일일 숙제</h2><span class="num">${dayLabel(today)}</span></div>
    <div class="strip">
      <div class="life-top ${ui.lifeEditing?"editing":""}"><b>생활의 기운</b><i class="life-br"></i>
        <span class="num life-nums"><input id="life-cur" class="life-cur num" inputmode="numeric" autocomplete="off" aria-label="현재 생활의 기운 (눌러서 고치기)" value="${ui.lifeEditing ? esc(ui.lifeInput) : fmt(life.cur)}" size="6"><span class="note">/ ${fmt(MAX_LIFE)}</span></span>
        <button class="pbtn sm ${ui.flash==="use"?"ok":""}" data-act="life-use">${ui.flash==="use"?"반영됨":"-"+fmt(LIFE_USE)}</button>
        <button class="pbtn sm save" id="life-save" data-act="life-save">저장</button>
        <span class="eta">${eta}</span></div>
      <div class="bar"><i data-bkey="life" style="width:${life.cur/MAX_LIFE*100}%"></i></div>
    </div>
    ${expCard()}
    <div class="cards">${cards || emptyRoster()}</div>
  </section>`;
}

/* ── 원정대 일일 숙제 카드: 카오스 게이트 · 필드 보스 · 모험 섬 · 특수 파견 ──
   캐릭터 카드처럼 끝낸 줄은 스르륵 숨기고, 아래 '완료한 숙제 N개 보기'를 누르면 한꺼번에 펼침 (ui.showExpDone) */
function expRows(){
  const d = dow(loaDay()), x = S.expedition, rows = [];
  if(CHAOS_DAYS.includes(d)) rows.push({k:"chaos", done:!!x.chaos});
  if(BOSS_DAYS.includes(d)) rows.push({k:"field", done:!!x.field});
  if(S.settings.island!==false) rows.push({k:"island", done:!!x.island});
  // 항해 협동: 캘린더를 아직 못 받았으면 보여주고, 받았는데 오늘 없으면 숨김
  if(S.settings.voyage!==false && (!S.apiKey || !CAL?.voyages || voyagesToday().length)) rows.push({k:"voyage", done:!!x.voyage});
  if(S.settings.dispatch!==false) rows.push({k:"dispatch", done:(x.dispatch||0) >= DISPATCH_MAX});
  return rows;
}
function expCard(){
  const rows = expRows(); if(!rows.length) return "";
  const doneN = rows.filter(r=>r.done).length, all = doneN===rows.length, show = !!ui.showExpDone;
  if(!doneN) ui.showExpDone = false;
  const html = rows.filter(r=>show || !r.done).map(r=>
    r.k==="chaos" ? simpleExpRow("chaos", "카오스 게이트", ICON_CHAOS) :
    r.k==="field" ? simpleExpRow("field", "필드 보스", ICON_BOSS) :
    r.k==="island" ? islandRow() : r.k==="voyage" ? voyageRow() : dispatchRow()).join("");
  return `<article class="card expd ${all?"done":""}" data-card="expd">
    <div class="chead"><span class="cname">원정대 일일 숙제</span>${all?`<span class="ctag">완료</span>`:""}</div>
    ${html}
    ${doneN ? `<button class="cleared-toggle" data-act="show-exp-done" aria-expanded="${show}">${show ? "완료한 숙제 숨기기" : `완료한 숙제 ${doneN}개 보기`}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>` : ""}
  </article>`;
}
// 카오스 게이트 / 필드 보스 한 줄
function simpleExpRow(k, name, icon){
  const on = !!S.expedition[k];
  return `<div class="row xr ${on?"on":""}"><span class="ico glass"><img class="in" src="${icon}" alt=""></span><span class="xr-name">${name}</span><span class="spacer"></span>${chk(on,"exp",`data-k="${k}"`,`${name} 완료`)}</div>`;
}
// 특수 파견 (0/2에서 시작, 2/2면 완료)
function dispatchRow(){
  const v = S.expedition.dispatch || 0, done = v >= DISPATCH_MAX;
  return `<div class="row xr dispatch ${done?"on":""}"><span class="ico glass"><span class="in xr-txt dispatch">파견</span></span><span class="xr-name">특수 파견</span>${slideGauge("dispatch","exp","",v,DISPATCH_MAX,1,"--dispatch","특수 파견")}<span class="spacer"></span>
    <div class="step"><button class="sbtn" data-act="dispatch" data-d="-1" aria-label="특수 파견 줄이기">−</button><button class="sbtn" data-act="dispatch" data-d="1" aria-label="특수 파견 늘리기">+</button></div></div>`;
}
// 모험 섬 (오늘의 섬 목록·시간은 로스트아크 API 캘린더에서)
function islandRow(){
  const done = !!S.expedition.island;
  const isl = islandsToday(), now = Date.now();
  const times = [...new Set(isl.flatMap(i=>i.times))].sort((a,b)=>a-b);
  const next = times.find(t=>t > now);
  const hm = t => { const d = new Date(t + 9*3600e3); return `${String(d.getUTCHours()).padStart(2,"0")}:${String(d.getUTCMinutes()).padStart(2,"0")}`; };
  let info;
  if(!S.apiKey) info = `<small class="isl-msg">설정 → 로스트아크 API에 키를 넣으면 오늘의 모험 섬이 보여요.</small>`;
  else if(!isl.length) info = `<small class="isl-msg">${CALS.loading ? "불러오는 중…" : CALS.err ? esc(CALS.err) : "오늘 모험 섬 정보가 없어요."}</small>`;
  else info = `<div class="isl-list">${isl.map(i=>`<span class="isl-chip ${i.tags.includes("골드")?"gold":""}">${esc(i.name)}${i.tags.map(t=>`<i class="t-${ISL_TAG_CLS[t]}">${t}</i>`).join("")}</span>`).join("")}</div>
    <small class="isl-times">${times.map(t=>`<span class="${t===next?"next":t<now?"past":""}">${hm(t)}</span>`).join("")}</small>`;
  const icon = (isl.find(i=>i.tags.includes("골드")) || isl[0])?.icon;
  return `<div class="row xr island ${done?"on":""}">
    <span class="ico glass">${icon ? `<img class="in" src="${esc(icon)}" alt="">` : `<span class="in isl-txt">섬</span>`}</span>
    <div class="isl-info"><div class="isl-top"><b>모험 섬</b><span class="isl-next">${next ? `다음 ${hm(next)}` : isl.length ? "오늘 일정 끝" : ""}</span></div>${info}</div>
    ${chk(done,"island","",`모험 섬 완료`)}</div>`;
}

// 항해 협동 (오늘의 항해·시각은 로스트아크 API 캘린더에서)
function voyageRow(){
  const done = !!S.expedition.voyage, list = voyagesToday(), now = Date.now();
  const times = [...new Set(list.flatMap(v=>v.times))].sort((a,b)=>a-b), next = times.find(t=>t > now);
  const hm = t => { const d = new Date(t + 9*3600e3); return `${String(d.getUTCHours()).padStart(2,"0")}:${String(d.getUTCMinutes()).padStart(2,"0")}`; };
  let info = "";
  if(!S.apiKey) info = `<small class="isl-msg">설정 → 로스트아크 API에 키를 넣으면 오늘의 항해가 보여요.</small>`;
  else if(!list.length) info = CALS.loading ? `<small class="isl-msg">불러오는 중…</small>` : CALS.err ? `<small class="isl-msg">${esc(CALS.err)}</small>` : "";
  else {
    // 지역마다 시각이 달라서 '시각 + 지역'을 한 칸씩, 시간 순으로 (지난 건 흐리게, 다음 건 강조)
    const slots = list.flatMap(v=>v.times.map(t=>({t, name:v.name}))).sort((a,b)=>a.t-b.t || a.name.localeCompare(b.name,"ko"));
    info = `<div class="isl-list voy">${slots.map(x=>`<span class="isl-chip ${x.t===next?"next":x.t<now?"past":""}"><b class="num">${hm(x.t)}</b>${esc(x.name)}</span>`).join("")}</div>`;
  }
  const icon = list[0]?.icon;
  return `<div class="row xr island voyage ${done?"on":""}">
    <span class="ico glass">${icon ? `<img class="in" src="${esc(icon)}" alt="">` : `<span class="in xr-txt voyage">항해</span>`}</span>
    <div class="isl-info"><div class="isl-top"><b>항해 협동</b><span class="isl-next">${next ? `다음 ${hm(next)}` : list.length ? "오늘 일정 끝" : ""}</span></div>${info}</div>
    ${chk(done,"voyage","",`항해 협동 완료`)}</div>`;
}

function dailyCard(c){
  const d = P(c.id).daily, done = dailyDone(c);
  const warn = shownGauge().some(k=>d[k].gauge>=MAX_GAUGE && !d[k].done);
  const row = (k, label, color) => {
    const h = d[k];
    return `<div class="row"><span class="lbl">${label}</span>
      ${slideGauge("rest", c.id, k, h.gauge, MAX_GAUGE, 0.5, color, `${c.name} ${label} 휴식 게이지`)}
      <span class="spacer"></span>${chk(h.done,"hw",`data-id="${c.id}" data-k="${k}"`,`${c.name} ${label} 완료`)}</div>`;
  };
  // 끝낸 일일 숙제는 숨김. '완료한 숙제 N개 보기' 또는 수정 모드에서 다시 보임 (앱 DailyCharacterCard와 같은 동작)
  const showCleared = ui.edit || ui.showClearedDaily.has(c.id);
  const show = k => showCleared || !d[k].done;
  const clearedCount = shownDaily().filter(k=>d[k].done).length;
  return `<article class="card ${done?"done":""} ${warn?"warn":""}" data-card="d-${c.id}">
    <div class="chead"><span class="cname">${esc(c.name)}</span><span class="cmeta">${esc(c.job)} · Lv.${fmtLv(c.level)}</span>${warn?`<span class="ctag">휴게 가득</span>`:done?`<span class="ctag">완료</span>`:""}</div>
    ${S.settings.guardian!==false && show("guardian") ? row("guardian","가디언 토벌","--guardian") : ""}
    ${S.settings.kurzan!==false && show("kurzan") ? row("kurzan",chaosName(c.level),"--kurzan") : ""}
    ${S.settings.guild && show("guild") ? `<div class="row"><span class="lbl">길드 출석</span><span class="spacer"></span>${chk(d.guild.done,"hw",`data-id="${c.id}" data-k="guild"`,`${c.name} 길드 출석 완료`)}</div>` : ""}
    ${clearedCount && !ui.edit ? `<button class="cleared-toggle" data-act="show-cleared-daily" data-id="${c.id}" aria-expanded="${showCleared}">${showCleared ? "완료한 숙제 숨기기" : `완료한 숙제 ${clearedCount}개 보기`}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>` : ""}
  </article>`;
}

// 주간 원정대 숙제 (체크 하나씩, 수요일 06시 초기화). k = 설정 키이자 expedition 저장 키
const EXP_WEEKLY = [
  {k:"estateBox", name:"영지 활동 지원 상자 구입", ico:"영지", cls:"estate"},
  {k:"serka", name:"세르카 교환", ico:"세르카", cls:"serka"},
];
function weeklyPanel(){
  const order = settle(wOrd, weeklyTarget(), false);
  const byId = Object.fromEntries(S.roster.map(c=>[c.id,c]));
  const total = S.roster.reduce((a,c)=>{ const g=goldOf(c); return {earned:a.earned+g.earned, max:a.max+g.max}; }, {earned:0,max:0});
  const cards = order.map(id=>byId[id]).filter(Boolean).map(weeklyCard).join("");

  return `<section class="panel panel-weekly">

    ${S.settings.raids!==false ? `<div class="total"><div class="total-top"><span>원정대 획득 골드</span><span class="num">${fmt(total.max)} G 중</span></div>
      <div class="goldrow"><div class="bar"><i data-bkey="gold-total" style="width:${total.max?total.earned/total.max*100:0}%;--c:var(--gold)"></i></div><span class="g num" data-nkey="gold-total" data-n="${total.earned}">${fmt(total.earned)} G</span></div></div>` : ""}
    ${expWeeklyCard()}

/* ── 원정대 주간 숙제 카드: 영지 활동 지원 상자 구입 · 세르카 교환 ──
   일일 원정대 카드와 같음: 끝낸 줄은 숨기고 '완료한 숙제 N개 보기'로 한꺼번에 펼침 (ui.showWExpDone) */
function expWeeklyCard(){
  const items = EXP_WEEKLY.filter(x=>S.settings[x.k]!==false); if(!items.length) return "";
  const doneN = items.filter(x=>S.expedition[x.k]).length, all = doneN===items.length, show = !!ui.showWExpDone;
  if(!doneN) ui.showWExpDone = false;
  const rows = items.filter(x=>show || !S.expedition[x.k]).map(x=>{ const on = !!S.expedition[x.k];
    return `<div class="row xr ${on?"on":""}"><span class="ico glass"><span class="in xr-txt ${x.cls}">${x.ico}</span></span><span class="xr-name wide">${x.name}</span><span class="spacer"></span>${chk(on,"exp",`data-k="${x.k}"`,`${x.name} 완료`)}</div>`; }).join("");
  return `<article class="card expd ${all?"done":""}" data-card="wexpd">
    <div class="chead"><span class="cname">원정대 주간 숙제</span>${all?`<span class="ctag">완료</span>`:""}</div>
    ${rows}
    ${doneN ? `<button class="cleared-toggle" data-act="show-wexp-done" aria-expanded="${show}">${show ? "완료한 숙제 숨기기" : `완료한 숙제 ${doneN}개 보기`}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>` : ""}
  </article>`;
}

// 끝낸 주간 숙제(다 깬 레이드, 낙원 0, 메달 교환, 이정표 3/3, 명예 0/3, 모래시계)는 숨기고,
// '완료한 숙제 N개 보기'를 누르면 다시 보여줌 (앱 WeeklyCharacterCard와 같은 동작)
function weeklyCard(c){
  const p = P(c.id), raids = raidsOf(c), g = goldOf(c), done = weeklyDone(c);
  const showCleared = ui.showCleared.has(c.id);
  const raidsOn = S.settings.raids!==false;
  const shownRaids = showCleared ? raids : raids.filter(r=>!r.full);
  const paraDone = p.paradise===0, signDone = p.sign>=SIGN_MAX, honorDone = p.honor===0;
  const honorOn = S.settings.honor!==false, glassOn = S.settings.hourglass!==false && hasHourglass(c);
  const clearedCount = (raidsOn ? raids.filter(r=>r.full).length : 0) + (S.settings.paradise && paraDone ? 1 : 0) + (S.settings.medal && p.medal ? 1 : 0) + (S.settings.sign && signDone ? 1 : 0)
    + (honorOn && honorDone ? 1 : 0) + (glassOn && p.hourglass ? 1 : 0);

  const tiles = shownRaids.map(r=>`<button class="raid" data-act="raid" data-id="${c.id}" data-r="${esc(r.title)}"
      aria-label="${esc(c.name)} ${esc(r.title)} ${r.cleared}/${r.gates.length}관문. ${r.full?"누르면 0관문으로 되돌림":"누르면 다음 관문 클리어"}">
      <span class="rn">${esc(r.title)}</span>
      <span class="pips">${r.gates.map((_,i)=>`<i data-pkey="${c.id}-${esc(r.title)}-${i}" class="${i<r.cleared?"on":""}"></i>`).join("")}</span>
      <span class="rg num">${r.full ? "완료 · 누르면 되돌림" : `${r.cleared+1}관 +${fmt(r.gates[r.cleared])}`}</span>
    </button>`).join("");
  const extras = [];
  if(S.settings.paradise && (showCleared || !paraDone)) extras.push(`<div class="row"><span class="lbl">낙원:천상</span>${slideGauge("para",c.id,"",p.paradise,PARADISE_MAX,1,"--guardian",`${c.name} 낙원`)}<span class="spacer"></span>
      <div class="step"><button class="sbtn" data-act="para" data-id="${c.id}" data-v="0" aria-label="낙원 0으로">0</button><button class="sbtn" data-act="para" data-id="${c.id}" data-d="-1" aria-label="낙원 줄이기">−</button><button class="sbtn" data-act="para" data-id="${c.id}" data-d="1" aria-label="낙원 늘리기">+</button></div></div>`);
  if(S.settings.medal && (showCleared || !p.medal)) extras.push(`<div class="row"><span class="lbl">클리어 메달</span><span class="note">교환</span><span class="spacer"></span>${chk(p.medal,"medal",`data-id="${c.id}"`,`${c.name} 클리어 메달 교환 완료`)}</div>`);
  if(S.settings.sign && (showCleared || !signDone)) extras.push(`<div class="row"><span class="lbl">이정표 미션</span>${slideGauge("sign",c.id,"",p.sign,SIGN_MAX,1,"--kurzan",`${c.name} 이정표 미션`)}<span class="spacer"></span>
      <div class="step"><button class="sbtn" data-act="sign" data-id="${c.id}" data-d="-1" aria-label="이정표 줄이기">−</button><button class="sbtn" data-act="sign" data-id="${c.id}" data-d="1" aria-label="이정표 늘리기">+</button></div></div>`);
  if(honorOn && (showCleared || !honorDone)) extras.push(`<div class="row"><span class="lbl">명예 부여</span>${slideGauge("honor",c.id,"",p.honor,HONOR_MAX,1,"--honor",`${c.name} 명예 부여`)}<span class="spacer"></span>
      <div class="step"><button class="sbtn" data-act="honor" data-id="${c.id}" data-d="-1" aria-label="명예 부여 줄이기">−</button><button class="sbtn" data-act="honor" data-id="${c.id}" data-d="1" aria-label="명예 부여 늘리기">+</button></div></div>`);
  if(glassOn && (showCleared || !p.hourglass)) extras.push(`<div class="row"><span class="lbl" style="white-space:nowrap">할의 모래시계</span><span class="spacer"></span>${chk(p.hourglass,"hourglass",`data-id="${c.id}"`,`${c.name} 할의 모래시계 완료`)}</div>`);
  const allRaidsDone = raids.every(r=>r.full);
  return `<article class="card ${done?"done":""}" data-card="w-${c.id}">
    <div class="chead"><span class="cname">${esc(c.name)}</span><span class="cmeta">${esc(c.job)} · Lv.${fmtLv(c.level)}</span>${done?`<span class="ctag">완료</span>`:""}</div>
    ${raidsOn && tiles ? `<div class="raids">${tiles}</div>` : ""}
    ${raidsOn && (showCleared || !allRaidsDone) ? `<div class="goldrow"><div class="bar"><i data-bkey="gold-${c.id}" style="width:${g.max?g.earned/g.max*100:0}%;--c:var(--gold)"></i></div><span class="g num" data-nkey="gold-${c.id}" data-n="${g.max-g.earned}" data-pre="남은 ">남은 ${fmt(g.max-g.earned)} G</span></div>` : ""}
    ${extras.length ? `<div class="sub">${extras.join("")}</div>` : ""}
    ${clearedCount ? `<button class="cleared-toggle" data-act="show-cleared" data-id="${c.id}" aria-expanded="${showCleared}">${showCleared ? "완료한 숙제 숨기기" : `완료한 숙제 ${clearedCount}개 보기`}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>` : ""}
  </article>`;
}

/* ───────────── 융화재료 계산기 (웹 전용) ───────────── */

  {k:"fish", name:"낚시",  n:"생선",          p:"붉은 살 생선",  r:"아비도스 태양 잉어"},
  {k:"arch", name:"고고학", n:"고대 유물",     p:"희귀한 유물",   r:"아비도스 유물"},
  {k:"hunt", name:"수렵",  n:"두툼한 생고기", p:"다듬은 생고기", r:"아비도스 두툼한 생고기"},
  {k:"mine", name:"채광",  n:"철광석",        p:"묵직한 철광석", r:"아비도스 철광석"},
  {k:"herb", name:"채집",  n:"들꽃",          p:"수줍은 들꽃",   r:"아비도스 들꽃"},
];
// 희귀재료 100개를 가루로 얻을 때 필요한 일반/고급재료 묶음(100개) 수: 가루 1000개 = 12.5회 구매
const FZ_LOTS_FOR_100_RARE = { n: (100/FZ_RARE_PER_EX*FZ_POWDER_PER_EX/FZ_POWDER_PER_BUY)*FZ_COST_N/100,   // 12.5
                               p: (100/FZ_RARE_PER_EX*FZ_POWDER_PER_EX/FZ_POWDER_PER_BUY)*FZ_COST_P/100 }; // 6.25
// 융화재료: 상자 1개에서 나오는 개수 (아비도스 10개 / 상급 아비도스 10개)
const FZ_FUSION = [ {name:"아비도스 융화 재료", per:10}, {name:"상급 아비도스 융화 재료", per:10} ];
const FZ_KEY = "loacheck-fusion";
let FZ = {A:0,B:0,C:0,D:0,W:0,pN:0,pP:0,T:30,field:"auto",open:true,prices:{},fusion:{},ts:0};
try{ Object.assign(FZ, JSON.parse(localStorage.getItem(FZ_KEY)||"{}")); }catch(e){}
if(!FZ.fusion) FZ.fusion = {};
if(!FZ.raw) FZ.raw = {};            // 거래소 원래 값 {min 최저가, avg 전일 평균가, recent 최근 거래가} (생활재료 100개 / 융화재료 1개 기준)
if(!FZ.basis) FZ.basis = "safe";    // 계산에 쓸 가격 기준
// 거래소 API는 최저가에 몇 개가 올라와 있는지(등록 수량)는 알려주지 않음 → 최저가가 전일 평균보다 많이 싸면 물량이 적을 수 있어서 '안전' 기준을 기본으로
const FZ_BASIS = { safe:"안전 (최저가·전일 평균가 중 높은 값)", min:"최저가", avg:"전일 평균가", recent:"최근 거래가" };
function fzEff(q){
  if(!q) return null;
  const avg = q.avg || q.min, recent = q.recent || q.min;
  return FZ.basis==="min" ? q.min : FZ.basis==="avg" ? avg : FZ.basis==="recent" ? recent : Math.max(q.min, avg);
}
// 최저가가 전일 평균가보다 10% 넘게 싸면 '물량 적을 수 있음' 표시
const fzThin = q => q && q.avg && q.min < q.avg * 0.9;
// 가격 기준이 바뀌거나 새로 불러오면 계산용 가격을 다시 만듦
function fzRebuild(){
  Object.entries(FZ.raw).forEach(([n,q])=>{
    const v = fzEff(q); if(v==null) return;
    if(FZ_FUSION.some(x=>x.name===n)) FZ.fusion[n] = v; else FZ.prices[n] = v;
  });
  fzApplyFieldPrices();
}
const fzSave = () => { try{ localStorage.setItem(FZ_KEY, JSON.stringify(FZ)); }catch(e){} };
let fzLoading = false, fzError = "";

// 희귀재료 교환 손익 (희귀재료 100개 기준, 골드). 양수 = 가루로 교환이 이득
function fzProfit(f, grade){
  const r = FZ.prices[f.r], m = FZ.prices[grade==="n" ? f.n : f.p];
  if(r==null || m==null) return null;
  return r - FZ_LOTS_FOR_100_RARE[grade] * m;
}
// 추천: 6개 분야 × (일반재료로 가루 / 고급재료로 가루) 12가지 중, 같은 수(상자 30개)를 처음부터 골드로 만들 때 골드가 가장 적게 드는 조합
// (보유 재료는 분야마다 달라서 비교할 때는 0으로 둠. 계산은 fzPlanBuy 그대로)
const FZ_CMP_BOXES = 30;
function fzCostFor(f, route){
  const pN = FZ.prices[f.n], pP = FZ.prices[f.p];
  if(pN==null || pP==null) return null;
  return fzPlanBuy(route, {A:0,B:0,C:0,D:0,W:0,pN,pP}, FZ_CMP_BOXES).cost;
}
function fzRecommend(onlyField){
  let best = null;
  (onlyField ? [onlyField] : FZ_FIELDS).forEach(f=>["N","P"].forEach(route=>{
    const cost = fzCostFor(f, route);
    if(cost!=null && (!best || cost < best.cost)) best = {f, route, cost};
  }));
  return best;
}
const fzField = () => FZ.field==="auto" ? (fzRecommend()?.f || null) : FZ_FIELDS.find(f=>f.k===FZ.field) || null;
// 지금 분야에서 가루로 교환할 재료 (N = 일반재료, P = 고급재료)
const fzRec = () => { const f = fzField(); return f ? fzRecommend(f) : null; };
function fzApplyFieldPrices(){
  const f = fzField(); if(!f) return;
  if(FZ.prices[f.n]!=null) FZ.pN = Math.round(FZ.prices[f.n]);
  if(FZ.prices[f.p]!=null) FZ.pP = Math.round(FZ.prices[f.p]);
}

// 거래소 최저가 (100개 기준 가격으로 맞춤)
// perUnit: true면 1개 가격, 아니면 100개 가격. cats: 찾아볼 거래소 분류 (생활 90000, 강화 재료 50000)
async function fzMarketPrice(name, perUnit=false, cats=[90000]){
  for(const cat of cats){
    const q = await fzMarketPriceIn(name, cat);
    if(q!=null){ if(perUnit){ q.min/=100; q.avg/=100; q.recent/=100; } return q; }
  }
  return null;
}
async function fzMarketPriceIn(name, cat){
  let res;
  try{
    res = await fetch(`${LOA_API}/markets/items`, {method:"POST",
      headers:{accept:"application/json","content-type":"application/json", authorization:"bearer "+S.apiKey},
      body: JSON.stringify({Sort:"CURRENT_MIN_PRICE", SortCondition:"ASC", CategoryCode:cat, ItemName:name, PageNo:1})});
  }catch(e){ throw new Error("로스트아크 서버에 연결하지 못했어요. 잠시 뒤 다시 시도해 주세요."); }
  if(res.status===401) throw new Error("API 키가 올바르지 않아요. 설정에서 키를 확인해 주세요.");
  if(res.status===429) throw new Error("요청이 너무 많아요. 1분 뒤 다시 시도해 주세요.");
  if(res.status===503) throw new Error("로스트아크 서버 점검 중이에요.");
  if(!res.ok) throw new Error(`가격을 불러오지 못했어요. (오류 ${res.status})`);
  const data = await res.json().catch(()=>null);
  const it = (data?.Items||[]).find(x=>x.Name===name);
  if(!it || it.CurrentMinPrice==null) return null;
  const k = 100 / (Number(it.BundleCount)||1);   // 100개 기준으로 맞춤
  return { min: Number(it.CurrentMinPrice)*k, avg: (Number(it.YDayAvgPrice)||0)*k, recent: (Number(it.RecentPrice)||0)*k };
}
async function fzLoad(force){
  if(fzLoading) return;
  if(!S.apiKey){ fzError = "설정 → 로스트아크 API에서 키를 먼저 저장해 주세요."; if(ui.page==="fusion") render(); return; }
  if(!force && Date.now()-FZ.ts < 10*60e3 && Object.keys(FZ.prices).length >= 18 && Object.keys(FZ.fusion).length >= FZ_FUSION.length) return;   // 10분 안에 불러온 값은 그대로 사용
  fzLoading = true; fzError = ""; if(ui.page==="fusion") render();
  const names = FZ_FIELDS.flatMap(f=>[f.n, f.p, f.r]);
  const [out, fout] = await Promise.all([
    Promise.all(names.map(n=>fzMarketPrice(n).then(v=>({v}), e=>({e})))),
    Promise.all(FZ_FUSION.map(x=>fzMarketPrice(x.name, true, [50000, 90000]).then(v=>({v}), e=>({e})))),   // 융화재료는 1개 가격
  ]);
  const err = [...out, ...fout].find(o=>o.e)?.e;
  const prices = {}; names.forEach((n,i)=>{ if(out[i].v!=null) prices[n] = out[i].v; });
  const fusion = {}; FZ_FUSION.forEach((x,i)=>{ if(fout[i].v!=null) fusion[x.name] = fout[i].v; });
  FZ.raw = {...FZ.raw, ...prices, ...fusion};
  if(Object.keys(prices).length) FZ.ts = Date.now();
  fzRebuild(); fzSave();
  const missing = [...names.filter(n=>!(n in prices)), ...FZ_FUSION.map(x=>x.name).filter(n=>!(n in fusion))];
  fzError = err ? err.message : missing.length ? `거래소에서 못 찾은 재료: ${missing.join(", ")}` : "";
  fzLoading = false;
  if(ui.page==="fusion") render();
}

// ---- 계산 (아티팩트와 같은 규칙) ----
const fzCdiv = (a,b) => a <= 0 ? 0 : Math.ceil(a/b);
function fzSolveOwned(route, s){
  const kmax = route==="N" ? Math.floor(s.A/FZ_COST_N) : Math.floor(s.B/FZ_COST_P);
  let best = null;
  for(let k=0; k<=kmax; k++){
    const n = s.A - (route==="N" ? FZ_COST_N*k : 0), p = s.B - (route==="P" ? FZ_COST_P*k : 0);
    const powder = s.W + FZ_POWDER_PER_BUY*k, e = Math.floor(powder/FZ_POWDER_PER_EX), rare = s.C + FZ_RARE_PER_EX*e;
    const x = Math.min(Math.floor(n/FZ_REC.n), Math.floor(p/FZ_REC.p), Math.floor(rare/FZ_REC.r), Math.floor(s.D/FZ_REC.g));
    if(best===null || x > best.x) best = {k, x};
  }
  const X = best.x, K = best.k, powderAll = s.W + FZ_POWDER_PER_BUY*K;
  const eUsed = Math.min(Math.floor(powderAll/FZ_POWDER_PER_EX), fzCdiv(FZ_REC.r*X - s.C, FZ_RARE_PER_EX));
  return { x:X, k:K, e:eUsed, m:0, q:0,
    left:{ n: s.A - (route==="N" ? FZ_COST_N*K : 0) - FZ_REC.n*X, p: s.B - (route==="P" ? FZ_COST_P*K : 0) - FZ_REC.p*X,
           r: s.C + FZ_RARE_PER_EX*eUsed - FZ_REC.r*X, w: powderAll - FZ_POWDER_PER_EX*eUsed, g: s.D - FZ_REC.g*X },
    buyGold:0 };
}
function fzPlanBuy(route, s, X){
  const eNeed = fzCdiv(FZ_REC.r*X - s.C, FZ_RARE_PER_EX);
  const k = fzCdiv(FZ_POWDER_PER_EX*eNeed - s.W, FZ_POWDER_PER_BUY);
  const needN = FZ_REC.n*X + (route==="N" ? FZ_COST_N*k : 0), needP = FZ_REC.p*X + (route==="P" ? FZ_COST_P*k : 0);
  const m = fzCdiv(needN - s.A, FZ_LOT), q = fzCdiv(needP - s.B, FZ_LOT);
  const buyGold = m*s.pN + q*s.pP, cost = FZ_REC.g*X + buyGold, powderAll = s.W + FZ_POWDER_PER_BUY*k;
  return { x:X, k, e:eNeed, m, q, buyGold, cost,
    left:{ n: s.A + FZ_LOT*m - needN, p: s.B + FZ_LOT*q - needP, r: s.C + FZ_RARE_PER_EX*eNeed - FZ_REC.r*X,
           w: powderAll - FZ_POWDER_PER_EX*eNeed, g: s.D - cost } };
}
function fzSolveBuy(route, s){
  for(let X = Math.floor(s.D/FZ_REC.g); X >= 0; X--){ const plan = fzPlanBuy(route, s, X); if(plan.cost <= s.D) return plan; }
  return fzPlanBuy(route, s, 0);
}
const fzState = () => ({A:FZ.A, B:FZ.B, C:FZ.C, D:FZ.D, W:FZ.W, pN:FZ.pN, pP:FZ.pP});
const fzMaxBoxes = () => { const s = fzState(); return Math.max(fzSolveBuy("N",s).x, fzSolveBuy("P",s).x); };

// ---- 화면 ----
const FZ_RES = { n:{name:"일반",color:"var(--res-n)"}, p:{name:"고급",color:"var(--res-p)"}, r:{name:"희귀",color:"var(--res-r)"}, w:{name:"가루",color:"var(--res-w)"}, g:{name:"골드",color:"var(--res-g)"} };
const fzDot = c => `<i class="fz-dot" style="background:${c}"></i>`;
const fzRow = (label, value, key) => `<dt${key?' class="key"':""}>${label}</dt><dd${key?' class="key"':""}>${value}</dd>`;
const fzChips = (left, keyRes) => `<div class="fz-chips">${["n","p","r","w","g"].map(k=>`<span class="fz-chip${k===keyRes?" key":""}">${fzDot(FZ_RES[k].color)}${FZ_RES[k].name} <b>${fmt(left[k])}</b></span>`).join("")}</div>`;
function fzOwnedBlock(res, route){
  const src = route==="N" ? "일반재료" : "고급재료", keyRes = route==="N" ? "p" : "n", keyName = route==="N" ? "고급재료" : "일반재료";
  return `<div class="fz-block"><h4>가진 재료만 사용 (재료 구매 없음)</h4><div class="fz-big"><span class="n">${fmt(res.x)}</span><span class="u">상자</span></div>
    <dl>${fzRow(src+"로 가루 구매", fmt(res.k)+"회", true)}${fzRow("가루 → 희귀재료 교환", fmt(res.e)+"회", true)}${fzRow("남는 "+keyName, fmt(res.left[keyRes])+"개")}</dl>
    <div><div class="fz-left">제작 후 남는 자원</div>${fzChips(res.left, keyRes)}</div></div>`;
}
function fzBuyBlock(res, route){
  const src = route==="N" ? "일반재료" : "고급재료", keyRes = route==="N" ? "p" : "n", keyName = route==="N" ? "고급재료" : "일반재료";
  let rows = fzRow(src+" 구매 (골드, 100개씩)", fmt(route==="N" ? res.m : res.q)+"회", true);
  if(route==="N" && res.q > 0) rows += fzRow("고급재료 구매 (골드, 100개씩)", fmt(res.q)+"회");
  if(route==="P" && res.m > 0) rows += fzRow("일반재료 구매 (골드, 100개씩)", fmt(res.m)+"회");
  rows += fzRow(src+"로 가루 구매", fmt(res.k)+"회", true) + fzRow("가루 → 희귀재료 교환", fmt(res.e)+"회", true)
        + fzRow("재료 구매에 쓴 골드", fmt(res.buyGold)) + fzRow("상자 제작에 쓴 골드", fmt(res.x*FZ_REC.g)) + fzRow("남는 "+keyName, fmt(res.left[keyRes])+"개");
  return `<div class="fz-block"><h4>골드로 재료까지 구매</h4><div class="fz-big"><span class="n">${fmt(res.x)}</span><span class="u">상자</span></div>
    <dl>${rows}</dl><div><div class="fz-left">제작 후 남는 자원</div>${fzChips(res.left, keyRes)}</div></div>`;
}
function fzRouteCard(route, own, buy){
  const title = route==="N" ? "1. 일반재료로 가루 구매" : "2. 고급재료로 가루 구매";
  const rule = route==="N" ? "일반재료 100개 → 가루 80개 → (100개당) 희귀재료 10개" : "고급재료 50개 → 가루 80개 → (100개당) 희귀재료 10개";
  const goal = route==="N" ? "상자를 최대로 만들 때 남는 고급재료가 최소가 되는 구매 횟수" : "상자를 최대로 만들 때 남는 일반재료가 최소가 되는 구매 횟수";
  return `<section class="fz-panel fz-route"><div class="fz-route-head"><h3>${title}</h3><p>${rule}</p><p>${goal}</p></div>${fzOwnedBlock(own, route)}${fzBuyBlock(buy, route)}</section>`;
}
function fzNeedCol(route, p, s){
  const src = route==="N" ? "일반재료" : "고급재료", title = route==="N" ? "1. 일반재료로 가루 구매" : "2. 고급재료로 가루 구매";
  let rows = fzRow(`상자 제작 골드 (${fmt(p.x)} × ${FZ_REC.g})`, fmt(p.x*FZ_REC.g)) + fzRow("재료 구매 골드", fmt(p.buyGold)) + fzRow(src+" 구매 (100개씩)", fmt(route==="N" ? p.m : p.q)+"회");
  if(route==="N" && p.q > 0) rows += fzRow("고급재료 구매 (100개씩)", fmt(p.q)+"회");
  if(route==="P" && p.m > 0) rows += fzRow("일반재료 구매 (100개씩)", fmt(p.m)+"회");
  rows += fzRow(src+"로 가루 구매", fmt(p.k)+"회") + fzRow("가루 → 희귀재료 교환", fmt(p.e)+"회");
  const diff = p.cost - s.D;
  const st = diff > 0 ? `<span class="fz-lack">골드 ${fmt(diff)} 부족</span>` : `<span class="fz-ok">골드 충분 (${fmt(-diff)} 남음)</span>`;
  return `<div class="fz-need-col"><h4 class="fz-need-h">${title}<button class="fz-btn" data-act="fz-notify" data-route="${route}" aria-label="${title} 내용을 윈도우 알림으로 띄우기">띄우기</button></h4><div class="fz-need-total"><span class="n">${fmt(p.cost)}</span><span class="u">골드 필요</span></div>
    <div class="fz-need-zero">(모든 재료가 없을 시 ${fmt(fzPlanBuy(route, {A:0,B:0,C:0,D:0,W:0,pN:s.pN,pP:s.pP}, p.x).cost)}골드 필요)</div>
    <div class="fz-short">현재 골드 <b class="mono">${fmt(s.D)}</b> · ${st}</div><dl>${rows}</dl>${fzFusionBlock(route)}</div>`;
}
// 결과 부분만 (입력할 때마다 이 부분만 다시 그림)
function fzResults(){
  const s = fzState(), T = FZ.T;
  const ownN = fzSolveOwned("N", s), ownP = fzSolveOwned("P", s), buyN = fzSolveBuy("N", s), buyP = fzSolveBuy("P", s);
  const better = buyN.x===buyP.x ? "두 경로의 상자 수가 같아요." : buyN.x > buyP.x ? `일반재료 경로가 ${fmt(buyN.x-buyP.x)}개 더 많아요.` : `고급재료 경로가 ${fmt(buyP.x-buyN.x)}개 더 많아요.`;
  const extra = (!s.pN || !s.pP) ? " 재료 가격이 비어 있거나 0이라 재료 구매 골드가 0으로 계산돼요." : "";
  const needN = fzPlanBuy("N", s, T), needP = fzPlanBuy("P", s, T);
  const cheaper = needN.cost===needP.cost ? "두 경로의 필요 골드가 같아요." : needN.cost < needP.cost ? `일반재료 경로가 ${fmt(needP.cost-needN.cost)} 골드 더 적게 들어요.` : `고급재료 경로가 ${fmt(needN.cost-needP.cost)} 골드 더 적게 들어요.`;
  return {
    summary: `골드로 재료까지 사면 일반재료 경로 <b class="mono">${fmt(buyN.x)}</b>개, 고급재료 경로 <b class="mono">${fmt(buyP.x)}</b>개를 만들 수 있어요. ${better}${extra}`,

// '띄우기': 필요한 골드 ~ 가루 교환 횟수를 윈도우 알림으로 1분간 띄움 (재료 사고 만드는 동안 보도록)
async function fzNotify(route){
  const s = fzState(), p = fzPlanBuy(route, s, FZ.T);
  const src = route==="N" ? "일반재료" : "고급재료", diff = p.cost - s.D;
  // 간단히 4줄: 첫 줄은 알림 제목, 나머지 3줄은 내용
  // 재료 이름은 지금 분야의 실제 이름으로 (예: 생선, 붉은 살 생선). 희귀재료는 알림이 길어지지 않게 '희귀재료' 그대로
  const f = fzField(), nName = f?.n || "일반재료", pName = f?.p || "고급재료";
  const srcName = route==="N" ? nName : pName;
  const title = `${nName} ${fmt(p.m)}회 구매`;
  const lines = [`${pName} ${fmt(p.q)}회 구매`, `${srcName}${(()=>{ const j=(srcName.charCodeAt(srcName.length-1)-0xAC00)%28; return /[가-힣]$/.test(srcName) && j && j!==8 ? "으로" : "로"; })()} ${fmt(p.k)}회 가루 구매`, `가루로 희귀재료 ${fmt(p.e)}회 교환`];
  await askNotif();
  if(notifPerm()==="granted"){
    try{
      const n = new Notification(title, {body: lines.join("\n"), tag:"loacheck-fusion-"+route, renotify:true, requireInteraction:true, silent:true});
      n.onclick = ()=>{ window.focus(); n.close(); };
      setTimeout(()=>n.close(), 60000);   // 1분 뒤 닫힘
      return;
    }catch(e){}
  }
  // 윈도우 알림을 못 쓰면 사이트 안 알림으로 1분간
  const box = document.getElementById("toasts"), id = "t" + (++toastSeq), el = document.createElement("div");
  el.className = "toast"; el.id = id;
  el.innerHTML = `<div class="toast-head"><b>${esc(title)}</b><button class="toast-x" data-act="toast-close" data-t="${id}" aria-label="알림 닫기">×</button></div><p>${lines.map(esc).join("<br>")}</p><p>윈도우 알림을 쓰려면 설정 → 알림에서 'PC 화면 위에 알림 띄우기'를 허용해 주세요.</p>`;
  box.appendChild(el); setTimeout(()=>closeToast(id), 60000);
}
// 재료를 모두 골드로 사서 만들 때 상자 1개 비용 (상자 30개 기준, 지금 칸에 들어간 일반/고급재료 가격 사용)
function fzBoxCost(route){
  if(!FZ.pN || !FZ.pP) return null;
  return fzPlanBuy(route, {A:0,B:0,C:0,D:0,W:0,pN:FZ.pN,pP:FZ.pP}, FZ_CMP_BOXES).cost / FZ_CMP_BOXES;
}
// 융화재료 1개: 거래소 가격 − 만들 때 드는 가격 (양수 = 제작이 이득)
function fzFusionGain(route, x){
  const price = FZ.fusion[x.name], box = fzBoxCost(route);
  if(price==null || box==null) return null;
  return price - box / x.per;
}

function fzFusionBlock(route){

}

/* ── 비교 그래프: 6개 분야 × (일반재료로 교환 / 고급재료로 교환 / 희귀재료 그냥 구매) = 18개 막대 ──
   막대 하나 = 융화재료 1개를 만드는 데 드는 골드 (보유량은 0으로 보고, 상자 30개를 골드로 만든다고 계산한 뒤 1개당으로 나눔)
   아래부터 쌓는 순서: 골드(제작비) → 일반재료 → 고급재료 → 희귀재료(교환에 쓴 재료 또는 직접 산 희귀재료) */
const FZ_SEG = [ {k:"g", name:"골드 (제작비)", color:"#F2C230"}, {k:"n", name:"일반재료", color:"#C9CFD8"}, {k:"p", name:"고급재료", color:"#3FA46A"}, {k:"r", name:"희귀재료", color:"#4F7FD6"} ];
const FZ_ROUTE_NAME = { N:"일반재료로 교환", P:"고급재료로 교환", R:"희귀재료 구매" };
function fzBar(f, route, per){
  const pN = FZ.prices[f.n], pP = FZ.prices[f.p], pR = FZ.prices[f.r], X = FZ_CMP_BOXES;
  if(pN==null || pP==null || (route==="R" && pR==null)) return null;
  let seg;
  if(route==="R"){
    // 교환 없이 전부 구매: 일반·고급·희귀 모두 100개 단위로 삼
    seg = { g: FZ_REC.g*X, n: fzCdiv(FZ_REC.n*X, FZ_LOT)*pN, p: fzCdiv(FZ_REC.p*X, FZ_LOT)*pP, r: fzCdiv(FZ_REC.r*X, FZ_LOT)*pR };
  } else {
    const pl = fzPlanBuy(route, {A:0,B:0,C:0,D:0,W:0,pN,pP}, X);
    // 가루 구매에 쓴 재료(k회)는 '희귀재료' 칸으로, 나머지는 원래 재료 칸으로
    const exch = route==="N" ? pl.k*FZ_COST_N/FZ_LOT*pN : pl.k*FZ_COST_P/FZ_LOT*pP;
    seg = { g: FZ_REC.g*X, n: pl.m*pN - (route==="N" ? exch : 0), p: pl.q*pP - (route==="P" ? exch : 0), r: exch };
  }
  const d = X * per;   // 융화재료 개수로 나눠 1개당 골드
  Object.keys(seg).forEach(k=>seg[k] = Math.max(0, seg[k]) / d);
  return { f, route, seg, total: seg.g + seg.n + seg.p + seg.r };
}
let fzChartAnimKey = "";
function fzChart(){
  const item = FZ_FUSION.find(x=>x.name===FZ.chartItem) || FZ_FUSION[0];
  const groups = FZ_FIELDS.map(f=>({f, bars:["N","P","R"].map(r=>fzBar(f, r, item.per))}));
  const all = groups.flatMap(g=>g.bars).filter(Boolean);
  const pick = `<div class="fz-items" role="radiogroup" aria-label="제작할 아이템">${FZ_FUSION.map(x=>`<button role="radio" aria-checked="${x===item}" data-act="fz-item" data-v="${esc(x.name)}">${esc(x.name)} <small>(상자당 ${x.per}개)</small></button>`).join("")}</div>`;
  if(!all.length) return pick + `<p class="fz-note" style="margin:14px 0 4px">재료 가격을 불러오면 그래프가 나와요. 오른쪽 위 '새로고침'을 눌러 주세요.</p>`;
  const min = all.reduce((a,b)=>b.total < a.total ? b : a);
  const market = FZ.fusion[item.name];
  // 세로축 눈금: 보기 좋은 숫자로
  const top = Math.max(...all.map(b=>b.total), market||0) * 1.12;
  const stepRaw = top / 5, mag = Math.pow(10, Math.floor(Math.log10(stepRaw))), step = [1,2,2.5,5,10].map(x=>x*mag).find(x=>x >= stepRaw);
  const nTick = Math.ceil(top / step), yMax = step * nTick;
  const sel = all.find(b=>`${b.f.k}-${b.route}`===ui.fzBar) || min;
  const ticks = Array.from({length:nTick+1}, (_,i)=>`<div class="fz-tick" style="bottom:${i/nTick*100}%"><span>${fmt(Math.round(step*i))}</span></div>`).join("");
  const bars = groups.map(g=>`<div class="fz-grp">${g.bars.map((b,i)=>{
      const route = ["N","P","R"][i];
      if(!b) return `<div class="fz-bar empty"></div>`;
      const isMin = b===min, key = `${g.f.k}-${route}`;
      const tip = `${g.f.name} · ${FZ_ROUTE_NAME[route]}: 1개당 ${fmt(Math.round(b.total))}골드`;
      return `<button class="fz-bar ${isMin?"min":""} ${b===sel?"sel":""}" data-act="fz-bar" data-v="${key}" style="height:${b.total/yMax*100}%" title="${tip}" aria-label="${tip}">
        ${isMin ? `<span class="fz-star">★</span>` : ""}<span class="fz-btot">${fmt(Math.round(b.total))}</span>
        ${FZ_SEG.map(sg=>`<i style="height:${b.seg[sg.k]/b.total*100}%;background:${sg.color}"></i>`).join("")}</button>`;
    }).join("")}</div>`).join("");
  const labels = groups.map(g=>`<div class="fz-glab"><span class="fz-sub3"><i>일</i><i>고</i><i>희</i></span><b>${g.f.name}</b></div>`).join("");
  const detail = `<div class="fz-detail"><b>${sel.f.name} · ${FZ_ROUTE_NAME[sel.route]}${sel===min?" ★ 가장 적게 듦":""}</b>
    <span>${FZ_SEG.map(sg=>`${fzDot(sg.color)}${sg.name} ${fmt(Math.round(sg.k==="g"?sel.seg.g:sel.seg[sg.k]))}`).join(" · ")} = <b>${item.name} 1개당 ${fmt(Math.round(sel.total))}골드</b></span>
    ${market!=null ? `<span class="fz-note">거래소 ${item.name} 가격 ${fmt(Math.round(market))}골드 → ${market>=sel.total ? `<span class="fz-plus">제작이 ${fmt(Math.round(market-sel.total))}골드 이득</span>` : `<span class="fz-minus">제작이 ${fmt(Math.round(sel.total-market))}골드 손해</span>`}</span>` : ""}</div>`;
  const animKey = item.name + "|" + all.map(b=>Math.round(b.total)).join(",");
  return `${pick}
    <div class="fz-legend">${FZ_SEG.map(sg=>`<span>${fzDot(sg.color)}${sg.name}</span>`).join("")}${market!=null ? `<span><i class="fz-mline"></i>거래소 가격</span>` : ""}</div>
    <div class="fz-chart" data-anim="${esc(animKey)}" role="group" aria-label="${item.name} 1개를 만드는 데 드는 골드 비교">
      <div class="fz-plot">${ticks}${market!=null && market < yMax ? `<div class="fz-market" style="bottom:${market/yMax*100}%"><span>거래소 ${fmt(Math.round(market))}</span></div>` : ""}<div class="fz-grps">${bars}</div></div>
      <div class="fz-glabs">${labels}</div>
    </div>
    ${detail}
    <p class="fz-note" style="margin:6px 0 0">세로축 = ${item.name} 1개를 만드는 데 드는 골드 (보유 재료는 없다고 보고 계산). 막대마다 왼쪽부터 일반재료로 교환 / 고급재료로 교환 / 희귀재료 그냥 구매. 막대를 누르면 내역이 보여요.</p>`;
}
// 그래프가 새로 그려질 때(아이템을 바꾸거나 가격이 바뀔 때)만 아래에서 위로 솟는 애니메이션

function fzInput(el){

  fzSave(); fzUpdate();
}

function historyPage(){
  const h = S.specHistory;
  const weekLabel = ws => dayLabel(ws).replace(/ \(.\)/,"") + " 수요일 주";
  const block = chars => chars.map(ch=>`<div class="hist-char"><b>${esc(ch.name)}</b><ul>${ch.lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul></div>`).join("");
  const current = [...S.roster].sort(bySlot).map(c=>({name:c.name, lines:specDiffLines(normSpec(h.base[c.id]), SPEC(c.id))})).filter(x=>x.lines.length);
  const weeks = [`<div class="hist-week"><h3>이번 주 · ${weekLabel(h.weekStart)}</h3>${current.length ? block(current) : `<p class="hint">이번 주 스펙업 기록이 아직 없어요.</p>`}</div>`]
    .concat(h.archive.map(w=>`<div class="hist-week"><h3>${weekLabel(w.weekStart)}</h3>${block(w.chars||[])}</div>`));
  return `<main class="page">
    <div class="page-head"><button class="tool" data-act="back" aria-label="뒤로">${ICON.back}</button><h2>스펙업 히스토리</h2></div>
    ${weeks.join("")}
  </main>`;
}

// 스펙 숫자 입력 적용 (입력을 멈추고 2초 뒤, 또는 Enter)
const specTimers = {};
function applySpecInput(el){
  if(el.dataset.spec==="s2") return applyS2Input(el);   // 스펙 현황(신)
  const id = el.dataset.id, k = el.dataset.k, kind = el.dataset.spec, raw = el.value.trim();
  delete ui.drafts[el.id]; clearTimeout(specTimers[el.id]);
  const sp = SPEC(id), il0 = specItemLevel(sp);
  if(kind==="lv"){ const n=parseInt(raw,10); sp.refine[k].lv = raw==="" ? null : (Number.isFinite(n) ? Math.max(0,Math.min(REFINE_MAX,n)) : sp.refine[k].lv); }
  else if(kind==="exp"){ const n=parseFloat(raw); sp.refine[k].exp = raw==="" ? 0 : (Number.isFinite(n) ? Math.max(0,Math.min(99.99,Math.round(n*100)/100)) : sp.refine[k].exp); }
  else if(kind==="adv"){ const n=parseInt(raw,10); sp.adv[k] = raw==="" ? null : (Number.isFinite(n) ? Math.max(0,Math.min(ADV_MAX,n)) : sp.adv[k]); }
  else if(kind==="brace"){ const n=parseFloat(raw.replace(/,/g,"")); sp.brace = raw==="" ? null : (Number.isFinite(n) ? Math.max(0,Math.round(n)) : sp.brace); }
  else if(kind==="power"){ const n=parseFloat(raw.replace(/,/g,"")); sp.power = raw==="" ? null : (Number.isFinite(n) ? Math.max(0,Math.round(n*100)/100) : sp.power); }
  specLevelToRoster(id, il0); syncBase(id); commit();
}

function s2Norm(d){
  const b = s2Default(); if(!d || typeof d!=="object") return b;
  const num = (v, dflt) => fin(v) ? v : dflt;
  const fixItem = (x, base, fxDef, rows, locked) => {
    x = (x && typeof x==="object") ? x : {};
    const fx = Array.isArray(x.fx) ? x.fx.filter(f=>f && fxDef[f.k]).map(f=>({k:f.k, v:num(f.v,0)})).slice(0, rows) : base.fx;
    if(!locked) while(fx.length < rows) fx.push({k:Object.keys(fxDef)[fx.length % rows], v:0});   // 장신구는 잠금 없음 → 항상 3줄
    return { grade: S2_GRADE[x.grade] ? x.grade : base.grade, gems: Math.max(0, Math.min(4, num(x.gems, base.gems)|0)),
             lv: x.lv===null ? null : num(x.lv, base.lv), exp: num(x.exp, base.exp), fx };
  };
  return { ilv: d.ilv===null ? null : num(d.ilv, b.ilv), power: d.power===null ? null : num(d.power, b.power),
    eq: Object.fromEntries(S2_EQ.map(([k])=>[k, fixItem(d.eq?.[k], b.eq[k], FX_EQ, S2_EQ_ROWS, true)])),
    ac: Object.fromEntries(S2_AC.map(([k])=>[k, fixItem(d.ac?.[k], b.ac[k], FX_AC, S2_AC_ROWS, false)])) };
}

function placeS2Pop(){
  const g = ui.s2Grade, pop = document.querySelector(".s2-pop"); if(!g || !pop) return;
  const btn = document.querySelector(`.s2-badge[data-act="s2-grade"][data-side="${g.side}"][data-k="${g.k}"]`);
  if(!btn){ pop.style.visibility = "visible"; return; }
  const r = btn.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight, m = 8, gap = 6;
  let x = r.right - 10;                                   // 오른쪽 아래
  if(x + w > innerWidth - m) x = r.left + 10 - w;         // 자리 없으면 왼쪽 아래
  x = Math.max(m, Math.min(x, innerWidth - w - m));
  let y = r.bottom + gap;
  if(y + h > innerHeight - m && r.top - gap - h >= m) y = r.top - gap - h;
  pop.style.left = x + "px"; pop.style.top = y + "px"; pop.style.visibility = "visible";
}

function applyS2Input(el){
  const f = el.dataset.f, side = el.dataset.side, k = el.dataset.k, raw = el.value.trim();
  delete ui.drafts[el.id]; clearTimeout(specTimers[el.id]);
  const n = parseFloat(raw.replace(/[^0-9.\-]/g,""));
  if(f==="ilv") S2.ilv = raw==="" ? null : (fin(n) ? Math.max(0, Math.round(n*100)/100) : S2.ilv);
  else if(f==="power") S2.power = raw==="" ? null : (fin(n) ? Math.max(0, Math.round(n*100)/100) : S2.power);
  else {
    const it = S2[side][k];
    if(f==="lv"){ const v = parseInt(raw,10); it.lv = raw==="" ? null : (fin(v) ? Math.max(0, Math.min(side==="eq" ? REFINE_MAX : 99, v)) : it.lv); }
    else if(f==="exp"){
      if(side==="eq") it.exp = raw==="" ? 0 : (fin(n) ? Math.max(0, Math.min(99.99, Math.round(n*100)/100)) : it.exp);
      else if(raw==="") it.exp = 0;
      else if(fin(n)) it.exp = Math.max(0, Math.min(S2_PHASE_MAX, Math.floor(n)));   // 마력 포획도 0~10000 (위상은 자동으로 안 올림)
    }
    else if(f==="fxv"){ const fx = it.fx[Number(el.dataset.i)]; if(fx && raw!=="" && fin(n)) fx.v = s2Fx(side)[fx.k].fmt==="int" ? Math.round(n) : Math.round(n*100)/100; }
  }
  s2Save(); render();
}

// 한 줄짜리 효과: '이름 +숫자' (체력 +4500, 추가 피해 +3.00%, 치명타 적중률 +2.60%, 아군 공격력 강화 효과 +3.00% …)

const BZ_STAT = /^([가-힣/]+\+|[가-힣/]*[가-힣][^가이을를는의에도다\d+.,%]\+?)\d[\d.,]*%?$/;   // '+'를 못 읽어도 능력치 이름이면 한 줄 효과
const BZ = { cfg:null, fixed:null, sel:null, tip:null, stream:null, video:null, timer:null, busy:false, worker:null, status:"", lastSig:null, prevSig:null, lastKey:"", err:"" };
try{ BZ.cfg = JSON.parse(localStorage.getItem("loacheck-brace-cfg")); }catch(e){}
try{ BZ.mode = localStorage.getItem("loacheck-brace-mode") === "auto" ? "auto" : "key"; }catch(e){ BZ.mode = "key"; }   // key = '/' 키를 눌렀을 때만, auto = 화면이 바뀌면 자동
if(!BZ.cfg?.tier || !BZ.cfg?.grade) BZ.cfg = bzDefaultCfg();
BZ.cfg.over ||= {};
try{ const st = JSON.parse(localStorage.getItem("loacheck-brace")); if(st){ BZ.fixed = st.fixed||null; BZ.sel = st.sel||null; BZ.tip = st.tip||null; } }catch(e){}
const bzSaveCfg = () => { try{ localStorage.setItem("loacheck-brace-cfg", JSON.stringify(BZ.cfg)); }catch(e){} };
const bzSaveState = () => { try{ localStorage.setItem("loacheck-brace", JSON.stringify({fixed:BZ.fixed, sel:BZ.sel, tip:BZ.tip})); }catch(e){} };
const bzScore = (tier, grade) => tier && grade ? Math.round((BZ.cfg.tier[tier]||0) * (BZ.cfg.grade[grade]||0) / 100) : 0;
// 효과 구분 이름: 표에서 찾은 효과면 그 이름, 못 찾은 효과면 숫자를 뺀 글자
const bzKey = e => e.key || e.rule || String(e.text||"").replace(/[\s\d.,+%]/g,"").slice(0,40);
// 실제로 쓸 티어: 사용자가 바꾼 티어가 있으면 그것 ("none" = 점수 없음)
const bzT = e => { const o = BZ.cfg.over?.[bzKey(e)]; return o==="none" ? null : (o || e.tier || null); };
const bzSum = list => (list||[]).reduce((a,e)=>a + bzScore(bzT(e), e.grade), 0);

// ── 글자 인식 엔진 (처음 쓸 때 한 번 내려받음) ──
const BZ_CDN = { lib:"https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js", worker:"https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js",
  core:"https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1", lang:"https://cdn.jsdelivr.net/npm/@tesseract.js-data/kor/4.0.0_best_int" };
function bzLoadScript(src){ return new Promise((ok, bad)=>{ if(window.Tesseract) return ok(); const el = document.createElement("script"); el.src = src; el.onload = ok; el.onerror = ()=>bad(new Error("글자 인식 도구를 내려받지 못했어요. 인터넷 연결을 확인해 주세요.")); document.head.appendChild(el); }); }
async function bzWorker(){
  if(BZ.worker) return BZ.worker;
  bzSetStatus("글자 인식 도구 준비 중… (처음 한 번만 몇 초 걸려요)");
  await bzLoadScript(BZ_CDN.lib);
  BZ.worker = await Tesseract.createWorker("kor", 1, { workerPath:BZ_CDN.worker, corePath:BZ_CDN.core, langPath:BZ_CDN.lang });
  return BZ.worker;
}
// 밝은 글자만 남기기: 가장 밝은 색 채널이 기준보다 밝으면 검정 글자, 나머지는 흰 바탕 (+ 확대)
function bzPrep(src, rect, scale, th=115){
  const w = Math.max(1, Math.round(rect.w*scale)), h = Math.max(1, Math.round(rect.h*scale));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d"); g.imageSmoothingQuality = "high";
  g.drawImage(src, rect.x, rect.y, rect.w, rect.h, 0, 0, w, h);
  const im = g.getImageData(0, 0, w, h), d = im.data;
  for(let i=0;i<d.length;i+=4){ const m = Math.max(d[i],d[i+1],d[i+2]); const v = m >= th ? 0 : 255; d[i]=d[i+1]=d[i+2]=v; d[i+3]=255; }
  g.putImageData(im, 0, 0); return c;
}
// 인식 결과 → 줄 목록 [{text, words:[{text, x0,y0,x1,y1}]}] (좌표는 원래 화면 기준)
async function bzOCR(src, rect, scale){
  const w = await bzWorker();
  const r = await w.recognize(bzPrep(src, rect, scale), {}, {blocks:true, text:true});
  const lines = (r.data.blocks||[]).flatMap(b=>b.paragraphs.flatMap(p=>p.lines));
  const map = bb => ({x0:rect.x + bb.x0/scale, y0:rect.y + bb.y0/scale, x1:rect.x + bb.x1/scale, y1:rect.y + bb.y1/scale});
  return lines.map(l=>({ text:l.text.trim(), ...map(l.bbox), words:l.words.map(wd=>({text:wd.text, ...map(wd.bbox)})) })).filter(l=>l.text);
}
const bzNorm = t => String(t).replace(/\s+/g,"").replace(/\[?부여로만획득\]?/g,"").replace(/피혜/g,"피해").replace(/치[멍멩맹]타/g,"치명타").replace(/적[중충증][률를룰율물듈]/g,"적중률").replace(/치명타로적[충증]/g,"치명타로적중").replace(/혜드/g,"헤드").replace(/[*~]+(?=\+)/g,"").replace(/적중[룰를름롤]/g,"적중률").replace(/치[멍멍명]타/g,"치명타").replace(/치명다/g,"치명타").replace(/공격럭/g,"공격력").replace(/중가/g,"증가").replace(/적[예애]게/g,"적에게").replace(/증가힌/g,"증가한").replace(/[*~ㄱ-ㅣ十]+(?=\d)/g,"+").replace(/[|]/g,"");   // '+'가 ㅜ·*·~ 등으로 읽힌 것 바로잡기
// 줄에서 붙어 있는 낱말들로 문구 찾기 → 그 낱말들을 감싸는 상자
function bzFind(lines, phrase){
  const out = [];
  for(const l of lines){
    let acc = "", marks = [];
    l.words.forEach((w,i)=>{ const t = bzNorm(w.text); marks.push([acc.length, acc.length + t.length, i]); acc += t; });
    let at = acc.indexOf(phrase);
    while(at >= 0){
      const ws = marks.filter(m=>m[1] > at && m[0] < at + phrase.length).map(m=>l.words[m[2]]);
      if(ws.length) out.push({x0:Math.min(...ws.map(w=>w.x0)), y0:Math.min(...ws.map(w=>w.y0)), x1:Math.max(...ws.map(w=>w.x1)), y1:Math.max(...ws.map(w=>w.y1))});
      at = acc.indexOf(phrase, at + 1);
    }
  }
  return out;
}
// 숫자 색 → 등급 (화면 원본 픽셀에서 진한 색만 골라 색상(hue) 중앙값)
function bzGradeAt(ctx, box){
  const x = Math.max(0, Math.floor(box.x0)), y = Math.max(0, Math.floor(box.y0)), w = Math.max(1, Math.ceil(box.x1 - box.x0)), h = Math.max(1, Math.ceil(box.y1 - box.y0));
  let d; try{ d = ctx.getImageData(x, y, w, h).data; }catch(e){ return null; }
  const hs = [];
  for(let i=0;i<d.length;i+=4){
    const r=d[i]/255, g=d[i+1]/255, b=d[i+2]/255, mx=Math.max(r,g,b), mn=Math.min(r,g,b), s = mx ? (mx-mn)/mx : 0;
    if(s < .35 || mx < .45) continue;
    let hh = mx===r ? ((g-b)/(mx-mn)) % 6 : mx===g ? (b-r)/(mx-mn) + 2 : (r-g)/(mx-mn) + 4; hh *= 60; if(hh < 0) hh += 360;
    hs.push(hh);
  }
  if(hs.length < 6) return null;
  hs.sort((a,b)=>a-b); const m = hs[hs.length>>1];
  return m >= 160 && m < 245 ? "low" : m >= 245 && m < 335 ? "mid" : m >= 60 && m < 160 ? "min" : "top";
}
// 줄들 → 효과 목록 [{text, tier, rule, grade}]
function bzParse(lines, ctx){
  // 줄 앞에 붙은 아이콘 찌꺼기(한 글자)는 버림
  // 줄 맨 앞 아이콘이 글자로 잘못 읽힌 것(1~2글자)은, 바로 뒤에 효과 첫 낱말이 오면 잘라냄
  const START = /^(.{0,2}?)(치명|특화|신속|제압|인내|숙련|체력|힘|민첩|지능|무기|공격|추가|적에게|재사용|백어택|헤드어택|방향성|아군|대상|파티|최대|스킬|자신|악마|무력화|생명력|물리|마법|전투|몬스터|시드|이동기)/;
  const rows = lines.map(l=>{ let t = bzNorm(l.text).replace(/^[^가-힣0-9(]+/, ""); const m = t.match(START); if(m && m[1]) t = t.slice(m[1].length);
    return {t, words:l.words}; }).filter(r=>r.t.length >= 2);
  // 문장 단위로 묶기: 능력치 줄(체력 +4500 등)은 한 줄이 한 효과, 문장은 '다.'로 끝날 때까지 이어 붙임
  const sents = []; let cur = null;
  for(const r of rows){
    if(BZ_STAT.test(r.t)){ if(cur){ sents.push(cur); cur = null; } sents.push({t:r.t, words:r.words, stat:true}); continue; }
    // 문장 끝('다.')을 잘못 읽어 다음 효과가 붙어버리는 것 방지: 앞 문장에 이미 '증가/감소'가 있고 이 줄이 효과 첫머리로 시작하면 새 효과
    if(cur && /(증가|감소)(한|힌|시킨|된)[다디댜]?\.?$/.test(cur.t) && BZ_HEAD.test(r.t) && !BZ_CONT.test(r.t)){ sents.push(cur); cur = null; }
    if(!cur) cur = {t:"", words:[]};
    cur.t += r.t; cur.words.push(...r.words);
    if(/(다|디|댜)\.?,?(\(.*\))?$|\)$/.test(r.t)){ sents.push(cur); cur = null; }
  }
  if(cur) sents.push(cur);
  // 이어지는 문장(해당 효과는… / 아군 공격력 강화 효과가… / 공격이 치명타로… 등)은 앞 효과에 합치기
  const effs = [];
  for(const s of sents){
    const prev = effs[effs.length-1];
    if(prev && !prev.stat && !s.stat && BZ_CONT.test(s.t)){ prev.t += s.t; prev.words.push(...s.words); continue; }
    effs.push({...s});
  }
  return effs.map(e=>{
    const rule = BZ_RULES.find(r=>r.test(e.t));
    const nums = e.words.filter(w=>/\d/.test(w.text));
    const grades = nums.map(w=>bzGradeAt(ctx, w)).filter(Boolean);
    const cnt = {}; grades.forEach(g=>cnt[g]=(cnt[g]||0)+1);
    const grade = Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0] || null;
    return {text:e.t.replace(/\+/g," +").slice(0,80), tier:rule?.tier||null, rule:rule?.name||"", grade, key: rule?.name || e.t.replace(/[\d.,+%]/g,"").slice(0,40)};
  });
}
// 한 화면 처리: 어떤 화면인지 알아낸 뒤, 그 부분만 크게 다시 읽어서 효과 계산
async function bzProcess(canvas){
  const ctx = canvas.getContext("2d", {willReadFrequently:true}), W = canvas.width, H = canvas.height;
  const full = await bzOCR(canvas, {x:0, y:0, w:W, h:H}, Math.min(1.5, 2800 / W));
  BZ.debug = {full};
  const clip = r => { const x = Math.max(0, r.x), y = Math.max(0, r.y); return {x, y, w:Math.max(1, Math.min(W, r.x + r.w) - x), h:Math.max(1, Math.min(H, r.y + r.h) - y)}; };
  const sel = bzFind(full, "효과선택")[0];
  // '고정 효과' 제목: 바로 아래(제목 높이의 4~14배 안)에 '부여 효과' 제목이 있는 것 (설명 문장 속 '고정 효과는…'은 제외)
  const grants = bzFind(full, "부여효과");
  let fixedH = null, grantH = null;
  for(const fH of bzFind(full, "고정효과").sort((a,b)=>a.y0-b.y0)){
    const h = fH.y1 - fH.y0, g = grants.find(b=>b.y0 > fH.y1 + 3*h && b.y0 < fH.y1 + 16*h && Math.abs(b.x0 - fH.x0) < 4*h);
    if(g){ fixedH = fH; grantH = g; break; }
  }
  // '고정 효과' 글자를 잘 못 읽었을 때: '부여 효과' 제목 위쪽 같은 줄 위치에 '고정'이 있으면 그걸로
  if(!fixedH) for(const g of grants){
    const h = g.y1 - g.y0, fH = bzFind(full, "고정").find(b=>b.y1 < g.y0 - 3*h && b.y1 > g.y0 - 16*h && Math.abs(b.x0 - g.x0) < 2*h);
    if(fH){ fixedH = {...fH, y1:fH.y0 + h}; grantH = g; break; }
  }
  if(sel){
    const w = sel.x1 - sel.x0, cx = (sel.x0 + sel.x1)/2, lock = bzFind(full, "잠긴효과").find(b=>b.y0 > sel.y1);
    const y0 = sel.y1 + 0.85*w, y1 = lock ? lock.y0 - 2 : sel.y1 + 3.6*w;
    const lLines = await bzOCR(canvas, clip({x:cx - 4.9*w, y:y0, w:4.35*w, h:y1 - y0}), 3), left = bzParse(lLines, ctx);
    const rRect = clip({x:cx + 0.25*w, y:y0, w:4.3*w, h:y1 - y0});
    const rLines = await bzOCR(canvas, rRect, 3), right = bzParse(rLines, ctx);
    return {kind:"sel", left, right, rRect, raw:{left:lLines.map(l=>l.text), right:rLines.map(l=>l.text)}};
  }
  if(fixedH){
    const h = fixedH.y1 - fixedH.y0, y0 = fixedH.y1 + 0.3*h, y1 = grantH ? grantH.y0 - 0.3*h : fixedH.y1 + 8*h;
    const list = bzParse(await bzOCR(canvas, clip({x:fixedH.x0 - 0.6*h, y:y0, w:27*h, h:y1 - y0}), 3), ctx);
    // 지켜볼 자리: 고정 효과 칸(다른 팔찌를 고르면 바뀜) / 고정~부여 효과 칸 전체(가운데에 '효과 변환 중…' 빛)
    const fRect = clip({x:fixedH.x0 + 1.5*h, y:y0, w:22*h, h:y1 - y0});
    const gRect = clip({x:fixedH.x0 - 0.6*h, y:fixedH.y0, w:26*h, h:(grantH ? grantH.y1 + 6.5*h : fixedH.y1 + 15*h) - fixedH.y0});
    return {kind:"grant", list, fRect, gRect};
  }
  // 팔찌 설명 창: '아크 패시브 포인트 효과' (또는 '효과 부여 불가') 줄을 기준으로 그 위쪽을 크게 읽어서 '팔찌 효과' 부분을 찾음
  const ends = [...bzFind(full, "아크패시브"), ...bzFind(full, "효과부여불가"), ...bzFind(full, "효과부여가능")].sort((a,b)=>a.y0-b.y0);
  for(const end of ends){
    const h = end.y1 - end.y0;
    const lines = await bzOCR(canvas, clip({x:end.x0 - 1.5*h, y:end.y0 - 30*h, w:23*h, h:30*h}), 3);
    const at = lines.findIndex(l=>/팔찌효과/.test(bzNorm(l.text)));
    if(at < 0) continue;
    const body = [];
    for(const l of lines.slice(at + 1)){ if(/효과부여|아크패시브|포인트효과/.test(bzNorm(l.text))) break; body.push(l); }
    return {kind:"tip", list:bzParse(body, ctx)};
  }
  return {kind:"none"};
}
function bzSetStatus(t){ BZ.status = t; const el = document.getElementById("bz-status"); if(el) el.textContent = t; }
// 결과 반영 + 알림 (같은 결과는 다시 알리지 않음)
function bzApply(res, quiet){
  const at = Date.now(), key = JSON.stringify(res);
  const same = key === BZ.lastKey; BZ.lastKey = key;
  let title = "", lines = [];
  if(res.kind==="grant"){ BZ.fixed = {list:res.list, at};
    if(BZ.video && res.gRect) bzWatch({glow:res.gRect, change:res.fRect});   /* '효과 변환 중…' 빛, 다른 팔찌 고르기(고정 효과 바뀜)를 지켜봄 */
    title = `고정 효과 기억함 · ${fmt(bzSum(res.list))}점`; lines = res.list.map(bzLine); }
  else if(res.kind==="sel"){
    const f = bzSum(BZ.fixed?.list), l = f + bzSum(res.left), r = f + bzSum(res.right);
    BZ.sel = {left:res.left, right:res.right, at, raw:res.raw};
    if(BZ.video && res.rRect) bzWatch({glow:res.rRect});   // 공유 화면이면 '재변환'을 지켜봤다가 다시 읽음
    title = `왼쪽(기존) ${fmt(l)}점 · 오른쪽(신규) ${fmt(r)}점`;
    lines = [l===r ? "두 쪽 점수가 같아요" : l > r ? `왼쪽이 ${fmt(l-r)}점 높아요 → 기존 효과 유지` : `오른쪽이 ${fmt(r-l)}점 높아요 → 신규 효과 선택`, BZ.fixed ? `고정 효과 ${fmt(f)}점 포함` : "고정 효과를 아직 못 읽었어요 (효과 부여 화면을 먼저 띄워 주세요)"];
  }
  else if(res.kind==="tip"){ const t = bzSum(res.list); BZ.tip = {list:res.list, at}; title = `장착 팔찌 점수 ${fmt(t)}점`; lines = res.list.map(bzLine); }
  else { bzWatch(null); if(!quiet) bzSetStatus("팔찌 화면을 찾지 못했어요. 효과 부여 / 효과 선택 / 팔찌 설명 창이 보이는 화면인지 확인해 주세요."); return; }
  bzSaveState();
  bzSetStatus(`${{grant:"효과 부여 화면",sel:"효과 선택 화면",tip:"팔찌 설명 창"}[res.kind]}을 읽었어요 · ${new Date(at).toLocaleTimeString("ko-KR")}`);
  if(!same) bzNotify(title, lines);
  if(ui.page==="brace") render();
}
const bzTierName = k => BZ_TIERS.find(t=>t.k===k)?.name || "";
// 알림 한 줄: 효과 (등급, 티어) 점수 — 예: 치명/특화/신속 (최하, 2티어+) 32점
const bzLine = e => { const tag = [BZ_GRADES.find(g=>g.k===e.grade)?.name, bzTierName(bzT(e)) || "점수 없음"].filter(Boolean).join(", ");
  return `${e.rule || e.text}${tag ? ` (${tag})` : ""} ${fmt(bzScore(bzT(e), e.grade))}점`; };
// 티어 고르기 상자 (기본 티어엔 '기본' 표시, 바꾼 건 강조)
function bzTierSelect(key, base, cur, cls=""){
  const opt = (v, t) => `<option value="${v}" ${v===(cur||"none")?"selected":""}>${t}${v===(base||"none")?" (기본)":""}</option>`;
  return `<select class="bz-tsel ${cls} ${(cur||"none")!==(base||"none")?"changed":""}" data-bzkey="${esc(key)}" data-base="${base||"none"}" aria-label="티어 고르기">${BZ_TIERS.map(t=>opt(t.k, t.name)).join("")}${opt("none","점수 없음")}</select>`;
}
function bzNotify(title, lines){
  if(ui.alarm!==false) chime(1);
  if(notifPerm()==="granted"){ try{ const n = new Notification(title, {body:lines.slice(0,4).join("\n"), tag:"loacheck-brace", renotify:true, silent:true}); n.onclick = ()=>{ window.focus(); n.close(); }; setTimeout(()=>n.close(), 8000); }catch(e){} }
  const box = document.getElementById("toasts"), id = "t" + (++toastSeq), el = document.createElement("div");
  el.className = "toast"; el.id = id;
  el.innerHTML = `<div class="toast-head"><b>${esc(title)}</b><button class="toast-x" data-act="toast-close" data-t="${id}" aria-label="알림 닫기">×</button></div><p>${lines.map(esc).join("<br>")}</p>`;
  box.appendChild(el); setTimeout(()=>closeToast(id), 8000);
}
async function bzRun(canvas, quiet){
  if(BZ.busy) return; BZ.busy = true; BZ.err = "";
  try{ bzSetStatus("읽는 중…"); bzApply(await bzProcess(canvas), quiet); }
  catch(e){ BZ.err = e.message || String(e); bzSetStatus(BZ.err); }
  BZ.busy = false;
}
// 붙여넣기 / 파일로 읽기
async function bzFromBlob(blob){
  // 붙여넣은 그림을 붙여넣기 칸에 작게 보여줌
  try{ if(BZ.preview) URL.revokeObjectURL(BZ.preview); BZ.preview = URL.createObjectURL(blob); const im = document.getElementById("bz-prev"); if(im){ im.src = BZ.preview; im.hidden = false; } }catch(e){}
  const img = await createImageBitmap(blob), c = document.createElement("canvas");
  c.width = img.width; c.height = img.height; c.getContext("2d").drawImage(img, 0, 0);
  await bzRun(c, false);
}
// 화면 공유: 1.5초마다 화면이 바뀌었는지 보고, 바뀐 뒤 멈추면 읽음
async function bzStart(){
  try{
    await askNotif();
    BZ.stream = await navigator.mediaDevices.getDisplayMedia({video:{frameRate:2}, audio:false});
  }catch(e){ bzSetStatus("화면 공유를 시작하지 못했어요. (취소했거나 브라우저가 지원하지 않아요)"); return; }
  const v = document.createElement("video"); v.muted = true; v.srcObject = BZ.stream; await v.play().catch(()=>{});
  BZ.video = v; BZ.prevSig = BZ.lastSig = null;
  BZ.stream.getVideoTracks()[0].addEventListener("ended", bzStop);
  bzSetStatus(BZ.mode==="key" ? "화면 공유 중이에요. 팔찌 화면을 띄우고 '/' 키를 누르면 읽어요." : "화면을 보고 있어요. 팔찌 효과 부여 / 효과 선택 / 팔찌 설명 창을 띄우면 자동으로 읽어요.");
  BZ.timer = setInterval(bzTick, 1500); render();
  bzWorker().catch(e=>bzSetStatus(e.message));
}
function bzStop(){
  clearInterval(BZ.timer); BZ.timer = null; bzWatch(null);
  BZ.stream?.getTracks().forEach(t=>t.stop()); BZ.stream = null; BZ.video = null;
  bzSetStatus("화면 공유를 멈췄어요."); render();
}
function bzSig(v){
  const c = bzSig.c ||= document.createElement("canvas"); c.width = 48; c.height = 27;
  const g = c.getContext("2d", {willReadFrequently:true}); g.drawImage(v, 0, 0, 48, 27);
  const d = g.getImageData(0, 0, 48, 27).data, out = new Uint8Array(48*27);
  for(let i=0;i<out.length;i++) out[i] = (d[i*4] + d[i*4+1] + d[i*4+2]) / 3;
  return out;
}
const bzDiff = (a, b) => { if(!a || !b) return 999; let s = 0; for(let i=0;i<a.length;i++) s += Math.abs(a[i]-b[i]); return s / a.length; };
async function bzTick(){
  const v = BZ.video; if(BZ.mode!=="auto" || !v || BZ.busy || !v.videoWidth) return;
  const sig = bzSig(v), stable = bzDiff(sig, BZ.prevSig) < 2; BZ.prevSig = sig;
  if(!stable || bzDiff(sig, BZ.lastSig) < 3) return;   // 움직이는 중이거나, 지난번 읽은 화면과 같음
  BZ.lastSig = sig;
  const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext("2d").drawImage(v, 0, 0);
  await bzRun(c, true);
}
/* 화면 지켜보기 (화면 공유 중일 때만)
   - glow: 금빛 빛('효과 부여 중…' / '효과 변환 중…')이 나타났다가 사라지면 0.5초 뒤 다시 읽음
       · 효과 선택 화면: 오른쪽(신규 효과) 칸 → 재변환
       · 효과 부여 화면: 고정·부여 효과 칸 → 효과 변환 (끝나면 효과 선택 화면이 나옴)
   - change: 효과 부여 화면의 고정 효과 칸 글자가 바뀌고 멈추면(다른 팔찌를 고름) 다시 읽음 */
function bzWatch(o){
  clearInterval(BZ.selTimer); BZ.selTimer = null; BZ.selWatch = null;
  if(!o || !BZ.video) return;
  BZ.selWatch = {glow:o.glow, change:o.change||null, phase:"idle", at:0, base:o.change ? bzRegion(BZ.video, o.change) : null, last:null, moving:false, still:0};
  BZ.selTimer = setInterval(bzSelTick, 250);
}
// 칸 가운데(빛이 나타나는 자리)에서 금빛 점의 비율
function bzGold(v, rect){
  const c = bzGold.c ||= document.createElement("canvas"), W = 64, H = 40; c.width = W; c.height = H;
  const g = c.getContext("2d", {willReadFrequently:true});
  g.drawImage(v, rect.x + rect.w*0.3, rect.y + rect.h*0.25, rect.w*0.4, rect.h*0.6, 0, 0, W, H);
  const d = g.getImageData(0, 0, W, H).data; let n = 0;
  for(let i=0;i<d.length;i+=4) if(d[i]>190 && d[i+1]>130 && d[i+2]<140 && d[i]-d[i+2]>80) n++;
  return n / (W*H);
}
// 칸을 작게 줄인 밝기 모양 (글자가 바뀌었는지 비교용)
function bzRegion(v, rect){
  const c = bzRegion.c ||= document.createElement("canvas"), W = 96, H = 24; c.width = W; c.height = H;
  const g = c.getContext("2d", {willReadFrequently:true});
  g.drawImage(v, rect.x, rect.y, rect.w, rect.h, 0, 0, W, H);
  const d = g.getImageData(0, 0, W, H).data, out = new Uint8Array(W*H);
  for(let i=0;i<out.length;i++) out[i] = Math.max(d[i*4], d[i*4+1], d[i*4+2]);
  return out;
}
async function bzRescan(){
  const v = BZ.video; if(!v) return;
  const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext("2d").drawImage(v, 0, 0);
  BZ.lastKey = ""; await bzRun(c, false);
}
async function bzSelTick(){
  const w = BZ.selWatch, v = BZ.video; if(!w || !v || !v.videoWidth || BZ.busy) return;
  const gold = bzGold(v, w.glow), now = Date.now();
  if(w.phase==="idle" && gold > 0.015){ w.phase = "glow"; w.at = now; bzSetStatus("효과 바뀌는 중… 끝나면 다시 읽을게요"); return; }
  if(w.phase==="glow"){
    if(gold < 0.004){ w.phase = "settle"; w.at = now; }
    else if(now - w.at > 6000) w.phase = "idle";   // 너무 오래 빛나면 다른 화면으로 보고 처음부터
    return;
  }
  if(w.phase==="settle"){ if(now - w.at >= 500){ w.phase = "idle"; await bzRescan(); } return; }
  // 고정 효과 칸: 글자가 바뀌었다가(다른 팔찌) 0.5초 동안 그대로면 다시 읽음
  if(w.change){
    const sig = bzRegion(v, w.change), dBase = bzDiff(sig, w.base), dLast = bzDiff(sig, w.last); w.last = sig;
    if(dBase > 2.5){ if(dLast < 1){ if(++w.still >= 2){ w.base = sig; w.still = 0; await bzRescan(); } } else w.still = 0; }
    else w.still = 0;
  }
}

// '/' 키: 공유 중인 화면을 지금 읽기 (입력칸에 글자를 쓰는 중이면 무시)

  const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext("2d").drawImage(v, 0, 0);

document.addEventListener("keydown", e=>{
  if(e.key!=="/" || e.ctrlKey || e.altKey || e.metaKey || e.repeat) return;
  const t = e.target; if(t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
  if(!BZ.stream && ui.page!=="brace") return;   // 팔찌 점수를 안 쓰는 중이면 그냥 둠

document.addEventListener("dragover", e=>{ const d = e.target.closest?.("#bz-drop"); if(!d) return; e.preventDefault(); d.classList.add("over"); });
document.addEventListener("dragleave", e=>{ e.target.closest?.("#bz-drop")?.classList.remove("over"); });
document.addEventListener("drop", e=>{
  const d = e.target.closest?.("#bz-drop"); if(!d) return; e.preventDefault(); d.classList.remove("over");
  const f = [...(e.dataTransfer?.files||[])].find(x=>x.type.startsWith("image/")); if(f) bzFromBlob(f); else bzSetStatus("그림 파일만 놓을 수 있어요.");
});
document.addEventListener("paste", e=>{
  if(ui.page!=="brace") return;
  const it = [...(e.clipboardData?.items||[])].find(i=>i.type.startsWith("image/"));
  if(it){ e.preventDefault(); bzFromBlob(it.getAsFile()); }
});

let rendering = false;
function countUp(el, from, to){
  const pre = el.dataset.pre || "", t0 = performance.now(), dur = 450;
  el.dataset.shown = from;
  const step = now => {
    if(!el.isConnected) return;
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3), v = Math.round(from + (to - from) * e);
    el.dataset.shown = v; el.textContent = `${pre}${fmt(v)} G`;
    if(k < 1) requestAnimationFrame(step); else delete el.dataset.shown;
  };
  requestAnimationFrame(step);
}
function render(){
  const app = document.getElementById("app");
  if(!ui.authReady || !ui.user){
    const a0=document.activeElement, id0=a0&&a0.id;
    app.innerHTML = !ui.authReady ? `<div class="loading">불러오는 중…</div>` : loginView();
    if(id0){ const el=document.getElementById(id0); if(el){ el.focus({preventScroll:true}); try{ const n=el.value.length; el.setSelectionRange(n,n); }catch(e){} } }
    return;
  }
  const active = document.activeElement, aid = active && active.id, sel = aid && active.selectionStart != null ? [active.selectionStart, active.selectionEnd] : null;
  const first = new Map();
  app.querySelectorAll("[data-card]").forEach(el=>first.set(el.dataset.card, el.getBoundingClientRect().top));
  const sheetScroll = app.querySelector(".sheet")?.scrollTop || 0;
  // 게이지 이전 값 기억 → 다시 그린 뒤 이전 값에서 새 값으로 움직이게
  const prevG = new Map();
  app.querySelectorAll("[data-gkey]").forEach(el=>prevG.set(el.dataset.gkey, parseFloat(el.style.getPropertyValue("--v"))||0));
  // 골드 막대·골드 숫자·레이드 관문 칸도 이전 상태 기억
  const prevB = new Map(), prevN = new Map(), prevP = new Map();
  app.querySelectorAll("[data-bkey]").forEach(el=>prevB.set(el.dataset.bkey, el.style.width));
  app.querySelectorAll("[data-nkey]").forEach(el=>prevN.set(el.dataset.nkey, Number(el.dataset.shown ?? el.dataset.n)));
  app.querySelectorAll("[data-pkey]").forEach(el=>prevP.set(el.dataset.pkey, el.classList.contains("on")));

  const body = ui.page==="specs" ? specListPage() : ui.page==="spec" ? specDetailPage() : ui.page==="history" ? historyPage() : ui.page==="fusion" ? fusionPage() : ui.page==="spec2" ? spec2Page() : ui.page==="brace" ? bracePage() : ui.page==="inv" ? invPage()
    : `<main class="board" data-view="${ui.view}">${pickerBar()}${dailyPanel()}${weeklyPanel()}</main>`;
  rendering = true;
  app.innerHTML = header() + body + settingsSheet();
  const top = app.querySelector(".top"); if(top) document.documentElement.style.setProperty("--top-h", top.offsetHeight + "px");

  if(sheetScroll) app.querySelector(".sheet").scrollTop = sheetScroll;
  if(aid){ const el=document.getElementById(aid); if(el){ el.focus({preventScroll:true}); if(sel && el.setSelectionRange) try{ el.setSelectionRange(sel[0],sel[1]); }catch(e){} }
    // 눌러만 두고 아직 안 쓴 입력칸은 다시 그린 뒤에도 빈 칸 상태 유지
    if(el && focusSess && focusSess.id===aid && !focusSess.edited){ focusSess.orig = el.value; focusSess.ph = el.placeholder; blankField(el); } }
  rendering = false;
  if(ui.page==="fusion") fzAnimateChart();
  if(ui.s2Grade) placeS2Pop();
  if(ui.invFocus){ const el = app.querySelector(`[data-inv-name="${ui.invFocus}"]`); ui.invFocus = null; if(el) el.focus(); }
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
    app.querySelectorAll("[data-gkey]").forEach(el=>{
      const from = prevG.get(el.dataset.gkey); if(from==null) return;
      const to = parseFloat(el.style.getPropertyValue("--v"))||0;
      if(Math.abs(from-to) > 0.001) try{ el.animate([{width:`${from*100}%`},{width:`${to*100}%`}], {duration:300, easing:"ease", pseudoElement:"::before"}); }catch(e){}
    });
    // 골드 막대: 이전 길이 → 새 길이
    app.querySelectorAll("[data-bkey]").forEach(el=>{
      const from = prevB.get(el.dataset.bkey); if(from==null || from===el.style.width) return;
      el.animate([{width:from},{width:el.style.width}], {duration:450, easing:"cubic-bezier(.2,.8,.2,1)"});
    });
    // 골드 숫자: 이전 값에서 새 값까지 세어 올라감/내려감
    app.querySelectorAll("[data-nkey]").forEach(el=>{
      const from = prevN.get(el.dataset.nkey), to = Number(el.dataset.n);
      if(from==null || !Number.isFinite(from) || from===to) return;
      countUp(el, from, to);
    });
    // 레이드 관문 칸: 새로 깬 칸은 왼쪽부터 보라색이 채워지고, 되돌린 칸은 비워짐
    app.querySelectorAll("[data-pkey]").forEach(el=>{
      const was = prevP.get(el.dataset.pkey), on = el.classList.contains("on");
      if(was==null || was===on) return;
      el.animate([{backgroundSize: was ? "100% 100%, auto" : "0% 100%, auto"}, {backgroundSize: on ? "100% 100%, auto" : "0% 100%, auto"}], {duration:320, easing:"ease"});
    });
    app.querySelectorAll("[data-card]").forEach(el=>{
      const f = first.get(el.dataset.card); if(f==null) return;
      const dy = f - el.getBoundingClientRect().top;
      if(Math.abs(dy) > 1) el.animate([{transform:`translateY(${dy}px)`},{transform:"none"}], {duration:400, easing:"cubic-bezier(.2,.8,.2,1)"});
    });
  }
}

      S.inv.rows = S.inv.rows.filter(r=>r.id!==rid); for(const m of Object.values(S.inv.counts)) delete m[rid]; ui.invDel = null; commit(); break; }
    case "inv-step": { const cid = b.dataset.id, rid = b.dataset.rid, d = Number(b.dataset.d);
      const m = (S.inv.counts[cid] ||= {}); const v = Math.max(0, (m[rid]||0) + d); if(v) m[rid] = v; else delete m[rid]; commit(); break; }
    case "bz-watch": if(BZ.stream) bzStop(); else bzStart(); break;

    case "raid": { const p=P(id), t=b.dataset.r, n=(RAIDS[t]||[0]).length, cur=Math.min(p.raids[t]||0,n), next = cur>=n ? 0 : cur+1;
      // 마지막 관문을 깨서 레이드가 숨겨질 때: 보라색 칸이 다 채워진 뒤 사라짐
      if(next===n && !ui.showCleared.has(id) && !matchMedia("(prefers-reduced-motion: reduce)").matches){

        const pip = b.querySelectorAll(".pips i")[cur];
        if(pip){ pip.classList.add("on"); pip.animate([{backgroundSize:"0% 100%, auto"},{backgroundSize:"100% 100%, auto"}],{duration:320,easing:"ease"}); }
        // 관문 칸이 차는 동안 골드 게이지(캐릭터·원정대)도 같이 오름 → 다 오른 뒤 레이드 버튼이 사라짐
        const gain = (RAIDS[t]||[0])[cur] || 0, c = byIdS(id), g = goldOf(c);
        const total = S.roster.reduce((a,x)=>{ const y=goldOf(x); return {earned:a.earned+y.earned, max:a.max+y.max}; }, {earned:0,max:0});
        growGold(`gold-${id}`, g.max ? (g.earned+gain)/g.max : 0, g.max-g.earned-gain);
        growGold("gold-total", total.max ? (total.earned+gain)/total.max : 0, total.earned+gain);
        setTimeout(()=>{ b.animate([{opacity:1,transform:"none"},{opacity:0,transform:"scale(.92)"}],{duration:200,easing:"ease-in",fill:"forwards"}); }, 330);
