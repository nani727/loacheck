const byIdS = id => S.roster.find(c=>c.id===id);
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if(a==="close-bg" && e.target!==b) return;   // 시트 안쪽 클릭은 무시
  switch(a){
    case "login-submit": doLogin(); break;
    case "menu": if(ui.menu) menuBack(); else { ui.menu=true; ui.menuClosing=false; pushNav(); render(); } break;
    case "menu-close": menuBack(); break;
    case "go-main": goPage("main"); break;
    case "go-specs": goPage("specs"); break;
    case "go-history": ui.page="history"; pushNav(); render(); window.scrollTo(0,0); break;
    case "open-spec": ui.page="spec"; ui.specId=id; ui.drafts={}; pushNav(); render(); window.scrollTo(0,0); break;
    case "back": if((history.state?.depth||0) > 0) history.back(); else { ui.page = ui.page==="main" ? "main" : "specs"; replaceNav(); render(); window.scrollTo(0,0); } break;
    case "grid": { const sp=SPEC(id), k=b.dataset.k, v=Number(b.dataset.v); sp.grid[k] = sp.grid[k]===v ? null : v; syncBase(id); commit(); break; }
    case "api-save": S.apiKey=ui.apiKeyInput.trim(); ui.apiKeyInput=""; ui.apiMsg="API 키를 저장했어요. 휴대폰 앱에서도 같이 쓰여요."; ui.apiErr=false; commit(); break;
    case "api-search": apiSearch(); break;
    case "api-refresh": apiRefresh(); break;
    case "api-cancel": ui.apiFound=null; ui.apiMsg=""; render(); break;
    case "api-apply": { const before=S.roster.length; applyRosterImport(ui.apiFound, ui.apiChecked); ui.apiFound=null; ui.apiMsg=`원정대를 ${S.roster.length}명으로 맞췄어요. (이전 ${before}명)`; ui.apiErr=false; dOrd.order=wOrd.order=null; wMemo.key=null; commit(); break; }
    case "login-toggle": ui.signUp=!ui.signUp; ui.loginMsg=""; render(); break;
    case "login-reset": doReset(); break;
    case "logout": ui.settings=false; ui.page="main"; replaceNav(); signOut(auth); break;
    case "view": ui.view=b.dataset.v; saveUi(); render(); break;
    case "edit": ui.edit=!ui.edit; ui.lifeInput=""; render(); break;
    case "slot": ui.sortSlot=!ui.sortSlot; dOrd.order=wOrd.order=null; saveUi(); render(); break;
    case "settings": { const fromMenu = ui.menu && history.state?.menu; ui.menu=false; ui.settings=true; ui.armDel=null; if(!ui.apiName) ui.apiName=[...S.roster].sort(bySlot)[0]?.name||""; if(fromMenu) replaceNav(); else pushNav(); render(); break; }
    case "close": case "close-bg": closeSettings(); break;
    case "hw": { const h=P(id).daily[b.dataset.k];
      // 체크해서 숨겨지는 줄은 스르륵 접힌 뒤 사라짐
      const hides = !h.done && !ui.edit && !ui.showClearedDaily.has(id);
      const after = !h.done ? h.gauge - (h.gauge>=1 ? 1 : 0) : h.gauge;
      finishRow(b.closest(".row"), hides, ()=>toggleHw(h), {ratio:after/MAX_GAUGE, text:SLIDE_TEXT.rest(after)}); break; }
    case "gauge": { const h=P(id).daily[b.dataset.k]; h.gauge=Math.max(0,Math.min(MAX_GAUGE,h.gauge+Number(b.dataset.d))); commit(); break; }
    case "exp": S.expedition[b.dataset.k]=!S.expedition[b.dataset.k]; commit(); break;
    case "toast-close": closeToast(b.dataset.t); break;
    case "toast-done": { S.expedition[b.dataset.k]=true; commit();
      const t=document.getElementById(b.dataset.t), left=(t?.dataset.items||"").split(",").filter(k=>k && k!==b.dataset.k);
      if(!left.length) closeToast(b.dataset.t); else { t.dataset.items=left.join(","); b.remove(); t.querySelector("p").textContent = "아직 안 한 숙제: " + left.map(k=>EXP_NAME[k]).join(" · "); }
      break; }
    case "alarm-toggle": ui.alarm = !ui.alarm; saveUi(); render(); break;
    case "alarm-test": testAlarm(0); break;
    case "alarm-test5": testAlarm(5000); break;
    case "notif-allow": askNotif().then(render); break;
    case "exp-toggle": ui.expOpen=!ui.expOpen; render(); break;
    case "show-cleared-daily": if(ui.showClearedDaily.has(id)) ui.showClearedDaily.delete(id); else ui.showClearedDaily.add(id); render(); break;
    case "show-cleared": if(ui.showCleared.has(id)) ui.showCleared.delete(id); else ui.showCleared.add(id); render(); break;
    case "raid": { const p=P(id), t=b.dataset.r, n=(RAIDS[t]||[0]).length, cur=Math.min(p.raids[t]||0,n), next = cur>=n ? 0 : cur+1;
      // 마지막 관문을 깨서 레이드가 숨겨질 때: 보라색 칸이 다 채워진 뒤 사라짐
      if(next===n && !ui.showCleared.has(id) && !matchMedia("(prefers-reduced-motion: reduce)").matches){
        b.style.pointerEvents="none";
        const pip = b.querySelectorAll(".pips i")[cur];
        if(pip){ pip.classList.add("on"); pip.animate([{backgroundSize:"0% 100%, auto"},{backgroundSize:"100% 100%, auto"}],{duration:320,easing:"ease"}); }
        setTimeout(()=>{ b.animate([{opacity:1,transform:"none"},{opacity:0,transform:"scale(.92)"}],{duration:200,easing:"ease-in",fill:"forwards"}).finished.catch(()=>{}).then(()=>{ p.raids[t]=next; commit(); }); }, 330);
      } else { p.raids[t]=next; commit(); }
      break; }
    case "para": { const p=P(id), v = b.dataset.v!=null ? 0 : Math.max(0,Math.min(PARADISE_MAX,p.paradise+Number(b.dataset.d))); setWeekly(b, id, "para", v); break; }
    case "medal": { const p=P(id); finishRow(b.closest(".row"), !p.medal && !ui.showCleared.has(id), ()=>{ p.medal=!p.medal; }); break; }
    case "hourglass": { const p=P(id); finishRow(b.closest(".row"), !p.hourglass && !ui.showCleared.has(id), ()=>{ p.hourglass=!p.hourglass; }); break; }
    case "sign": { const p=P(id); setWeekly(b, id, "sign", Math.max(0,Math.min(SIGN_MAX,p.sign+Number(b.dataset.d)))); break; }
    case "honor": { const p=P(id); setWeekly(b, id, "honor", Math.max(0,Math.min(HONOR_MAX,p.honor+Number(b.dataset.d)))); break; }
    case "setting": S.settings[b.dataset.k]=!S.settings[b.dataset.k]; commit(); break;
    case "life-use": { const now=Date.now(), st=lifeStatus(now); S.life={energy:Math.max(0,st.cur-LIFE_USE), ts: st.cur>=MAX_LIFE?now:st.lastTick}; flash("use"); commit(); break; }
    case "life-save": { const v=parseInt(ui.lifeInput,10); if(!Number.isFinite(v)) break; S.life={energy:Math.max(0,Math.min(MAX_LIFE,v)), ts:Date.now()}; ui.lifeInput=""; flash("save"); commit(); break; }
    case "add": { const id2="c"+Date.now().toString(36); const next=Math.max(0,...S.roster.map(c=>c.chaNum))+1; S.roster.push({id:id2,name:"새 캐릭터",job:"",level:1710,chaNum:next}); commit(); setTimeout(()=>{ const el=document.getElementById("r-name-"+id2); el&&el.select(); },0); break; }
    case "del": if(ui.armDel!==id){ ui.armDel=id; render(); } else { S.roster=S.roster.filter(c=>c.id!==id); delete S.progress[id]; ui.armDel=null; commit(); } break;
  }
});
// 메뉴 닫기 (밀려 들어가는 애니메이션 후 제거). instant=true면 바로 닫음
function closeMenu(instant){
  if(!ui.menu) return render();
  if(instant || matchMedia("(prefers-reduced-motion: reduce)").matches){ ui.menu=false; ui.menuClosing=false; return render(); }
  ui.menuClosing=true; document.querySelector(".menu")?.classList.add("closing");
  setTimeout(()=>{ ui.menu=false; ui.menuClosing=false; render(); }, 180);
}

/* ───────────── 뒤로가기 (브라우저 기록) ───────────── */
// 화면을 옮길 때마다 기록을 남겨서, 브라우저/휴대폰 뒤로가기를 누르면 사이트를 나가지 않고 이전 화면으로 돌아감
// (앱은 BackHandler로 같은 동작: 메뉴 닫기 → 설정/스펙 → 이전 화면)
const navState = depth => ({loa:1, depth, page:ui.page, specId:ui.specId, settings:!!ui.settings, menu:!!ui.menu});
function pushNav(){ history.pushState(navState((history.state?.depth||0)+1), ""); }
function replaceNav(){ history.replaceState(navState(history.state?.depth||0), ""); }
// 메뉴에서 다른 화면을 고르면: 메뉴 기록을 그 화면으로 바꿈 (뒤로가기 → 메뉴 열기 전 화면)
function goPage(page){
  const fromMenu = ui.menu && history.state?.menu;
  if(page===ui.page && !ui.settings){ menuBack(); return; }
  ui.page = page; ui.settings = false; ui.menu = false; ui.menuClosing = false;
  if(fromMenu) replaceNav(); else pushNav();
  render(); window.scrollTo(0,0);
}
function menuBack(){ if(history.state?.menu) history.back(); else closeMenu(); }
function closeSettings(){ ui.armDel=null; if(history.state?.settings) history.back(); else { ui.settings=false; render(); } }
window.addEventListener("popstate", e=>{
  const st = (e.state && e.state.loa) ? e.state : {page:"main"};
  const moved = st.page!==ui.page || (st.specId||null)!==(ui.specId||null);
  ui.page = st.page || "main"; ui.specId = st.specId || null; ui.settings = !!st.settings; ui.armDel = null;
  if(ui.page==="spec" && !byIdS(ui.specId)) ui.page = "specs";
  if(!st.menu && ui.menu) closeMenu(moved); else { ui.menu = !!st.menu && ui.menu; render(); }
  if(moved) window.scrollTo(0,0);
});
history.replaceState({loa:1, depth:0, page:"main", specId:null, settings:false, menu:false}, "");

/* ───────────── 숨겨지는 줄 애니메이션 ───────────── */
// 체크해서 사라지는 줄은 높이를 줄이며 스르륵 접고 나서 저장 (앱 AnimatedVisibility shrinkVertically와 같은 느낌)
function collapseRow(el){
  const gap = parseFloat(getComputedStyle(el.parentElement).rowGap) || 0;
  const h = el.getBoundingClientRect().height;
  el.style.overflow = "hidden"; el.style.minHeight = "0"; el.style.pointerEvents = "none";
  const a = el.animate([{height:h+"px", opacity:1, marginTop:"0px"}, {height:"0px", opacity:0, marginTop:(-gap)+"px"}],
    {duration:280, easing:"cubic-bezier(.4,0,.2,1)", fill:"forwards"});
  return a.finished.catch(()=>{});
}
// gaugeTo = {ratio, text}: 숨기기 전에 게이지를 새 값까지 먼저 움직임 → 끝나면 접힘
function finishRow(rowEl, hides, apply, gaugeTo){
  if(hides && rowEl && !matchMedia("(prefers-reduced-motion: reduce)").matches){
    rowEl.querySelector(".chk")?.setAttribute("aria-pressed","true");   // 체크 표시를 먼저 보여줌
    rowEl.style.pointerEvents = "none";
    let wait = 0;
    const g = rowEl.querySelector(".gauge");
    if(g && gaugeTo){
      const cur = parseFloat(g.style.getPropertyValue("--v"))||0;
      rowEl.querySelector(".slide")?.classList.remove("dragging");
      if(Math.abs(cur - gaugeTo.ratio) > 0.001){ g.style.setProperty("--v", gaugeTo.ratio); wait = 330; }
      const t = rowEl.querySelector(".gval"); if(t && gaugeTo.text!=null) t.textContent = gaugeTo.text;
    }
    setTimeout(()=>collapseRow(rowEl).then(()=>{ apply(); commit(); }), wait);
  } else { apply(); commit(); }
}
// 주간 게이지 값 바꾸기 (버튼·슬라이더 공용). 끝나서 숨겨지면 접는 애니메이션
function setWeekly(srcEl, id, kind, v){
  const p = P(id), done = kind==="para" ? v===0 : kind==="sign" ? v>=SIGN_MAX : v===0;
  const was = kind==="para" ? p.paradise===0 : kind==="sign" ? p.sign>=SIGN_MAX : p.honor===0;
  const set = ()=>{ if(kind==="para") p.paradise=v; else if(kind==="sign") p.sign=v; else p.honor=v; };
  const max = kind==="para" ? PARADISE_MAX : kind==="sign" ? SIGN_MAX : HONOR_MAX;
  finishRow(srcEl?.closest(".row"), done && !was && !ui.showCleared.has(id), set, {ratio:v/max, text:SLIDE_TEXT[kind](v)});
}

/* ───────────── 게이지 슬라이더 (누르거나 끌어서 조절) ───────────── */
// 끄는 동안 게이지가 손가락을 따라오고, 놓으면 가장 가까운 정수(휴게는 0.5칸)로 맞춰 저장
let slide = null;
function slideRatio(e){ const r = slide.g.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)); }
function slideShow(e){
  const ratio = slideRatio(e), raw = ratio*slide.max, snapped = Math.round(raw/slide.step)*slide.step;
  slide.g.style.setProperty("--v", ratio);
  const t = slide.w.querySelector(".gval"); if(t) t.textContent = SLIDE_TEXT[slide.kind](snapped);
  return snapped;
}
function slideApply(v){
  const {kind, id, k, w} = slide; slide = null;
  if(kind==="rest"){ P(id).daily[k].gauge = Math.max(0, Math.min(MAX_GAUGE, v)); commit(); }
  else setWeekly(w, id, kind, v);
}
document.addEventListener("pointerdown", e=>{
  const w = e.target.closest("[data-slide]"); if(!w || e.button>0) return;
  slide = {w, g:w.querySelector(".gauge"), kind:w.dataset.slide, id:w.dataset.id, k:w.dataset.k, max:+w.dataset.max, step:+w.dataset.step, pid:e.pointerId, moved:false};
  try{ w.setPointerCapture(e.pointerId); }catch(err){}
  w.classList.add("dragging");
  if(e.pointerType==="mouse"){ e.preventDefault(); slideShow(e); }
});
document.addEventListener("pointermove", e=>{ if(slide && e.pointerId===slide.pid){ slide.moved=true; slideShow(e); } });
document.addEventListener("pointerup", e=>{ if(slide && e.pointerId===slide.pid){ slide.w.classList.remove("dragging"); slideApply(slideShow(e)); } });
document.addEventListener("pointercancel", e=>{ if(slide && e.pointerId===slide.pid){ slide = null; render(); } });   // 세로로 스크롤하면 취소 → 원래 값

/* ───────────── 스펙 입력칸: 누르면 비워서 바로 입력 ───────────── */
// 원래 값은 흐리게 보이고, 아무것도 안 쓰고 나가면 원래 값으로 돌아감 (앱 DebouncedField clearOnFocus와 같음)
let focusSess = null;
function blankField(el){ el.dataset.ph ??= el.placeholder; if(el.value) el.placeholder = el.value; el.value = ""; }
document.addEventListener("focusin", e=>{
  const el = e.target; if(rendering || !el.dataset?.spec || el.dataset.spec==="power") return;
  focusSess = {id:el.id, edited: ui.drafts[el.id]!=null, orig:el.value, ph:el.placeholder};
  if(!focusSess.edited) blankField(el);
});
document.addEventListener("focusout", e=>{
  const el = e.target; if(rendering || !el.dataset?.spec) return;
  const sess = focusSess && focusSess.id===el.id ? focusSess : null; focusSess = null;
  if(ui.drafts[el.id]!=null){ setTimeout(()=>applySpecInput(el), 0); return; }   // 입력했으면 바로 저장 (다음 칸으로 포커스가 옮겨간 뒤)
  if(sess && !sess.edited){ el.value = sess.orig; el.placeholder = sess.ph; delete el.dataset.ph; }
});

/* ───────────── 카오스 게이트·필드 보스 알림 (웹 전용) ───────────── */
// 오늘 열리는 날인데 아직 안 했으면, 매시 58분(정시 2분 전)에 오른쪽 아래 토스트로 알려줌
const EXP_NAME = {chaos:"카오스 게이트", field:"필드 보스"};
let alarmTimer = null, lastAlarm = "", toastSeq = 0;
function expTodo(at=Date.now()){
  const day = loaDay(at), d = dow(day), fresh = day !== S.lastDaily;   // 06시가 막 지나는 경우 새 날로 봄
  const out = [];
  if(CHAOS_DAYS.includes(d) && (fresh || !S.expedition.chaos)) out.push("chaos");
  if(BOSS_DAYS.includes(d) && (fresh || !S.expedition.field)) out.push("field");
  return out;
}
function checkAlarm(force){
  if(!ui.user || (!ui.alarm && !force)) return;
  const now = new Date(), min = now.getUTCMinutes();
  if(!force && min !== 58 && min !== 59) return;          // 58분 (탭이 잠깐 느려도 59분까지는 띄움)
  const key = now.toISOString().slice(0,13);
  if(!force && lastAlarm === key) return;
  const todo = expTodo(Date.now() + 120000);
  if(!todo.length && !force) return;
  lastAlarm = key;
  const hour = (now.getUTCHours() + 9 + 1) % 24;          // 한국 시간 기준 다음 정시
  alarmOut(force && !todo.length ? ["chaos","field"] : todo, hour);
}
function scheduleAlarm(){
  clearTimeout(alarmTimer);
  const now = new Date();
  alarmTimer = setTimeout(()=>{ checkAlarm(); scheduleAlarm(); }, (60 - now.getSeconds())*1000 - now.getMilliseconds() + 200);   // 매 분 0초마다 확인
}
// ── PC 알림 (윈도우 알림: 게임·다른 창 위에도 뜸) + 소리 ──
const notifPerm = () => ("Notification" in window) ? Notification.permission : "unsupported";
const notifText = () => ({granted:"허용됨 · 다른 프로그램(게임) 위에도 윈도우 알림으로 떠요.", denied:"차단됨 · 주소창 왼쪽 자물쇠 → 알림 '허용'으로 바꿔 주세요.",
  default:"'허용하기'를 누르고 브라우저 창에서 '허용'을 고르세요.", unsupported:"이 브라우저는 PC 알림을 지원하지 않아요. (PC의 크롬·엣지에서 사용해 주세요)"})[notifPerm()];
async function askNotif(){ try{ if(notifPerm()==="default") await Notification.requestPermission(); }catch(e){} }
function osNotify(items, hour){
  if(notifPerm()!=="granted") return;
  try{
    const n = new Notification(`⏰ 2분 뒤 ${hour}시 정각이에요`, {body:`아직 안 한 숙제: ${items.map(k=>EXP_NAME[k]).join(" · ")}`, tag:"loacheck-exp", renotify:true, requireInteraction:false, silent:true});
    n.onclick = ()=>{ window.focus(); n.close(); };
    setTimeout(()=>n.close(), 5000);   // 윈도우 알림은 5초 뒤 저절로 사라짐
  }catch(e){}
}
let actx = null;
function audio(){
  if(!actx){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; actx = new C(); }
  if(actx.state==="suspended") actx.resume().catch(()=>{});
  return actx;
}
// 브라우저 정책상 소리는 사용자가 한 번 클릭한 뒤부터 낼 수 있음 → 첫 클릭 때 소리 장치를 준비해 둠
["pointerdown","keydown"].forEach(t=>document.addEventListener(t, ()=>audio(), {capture:true, passive:true}));
function chime(times=2){
  const vol = (ui.volume||0)/100, c = audio(); if(vol<=0 || !c) return;
  const t0 = c.currentTime + 0.05;
  for(let r=0; r<times; r++) [[880,0],[1174.66,.16],[1567.98,.32]].forEach(([f,d])=>{
    const t = t0 + r*1.1 + d, o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.6*vol, t+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+0.7);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+0.75);
  });
}
async function testAlarm(delay){
  await askNotif(); render();
  if(delay){ const b=document.querySelector('[data-act="alarm-test5"]'); if(b) b.textContent="5초 뒤 울려요…"; }
  setTimeout(()=>{ const hour=(new Date().getUTCHours()+9+1)%24; alarmOut(["chaos","field"], hour); render(); }, delay);
}
function alarmOut(items, hour){ showToast(items, hour); osNotify(items, hour); chime(); }
function showToast(items, hour){
  const box = document.getElementById("toasts"), id = "t" + (++toastSeq);
  const el = document.createElement("div");
  el.className = "toast"; el.id = id; el.dataset.items = items.join(",");
  el.innerHTML = `<div class="toast-head"><b>⏰ 2분 뒤 ${hour}시 정각이에요</b><button class="toast-x" data-act="toast-close" data-t="${id}" aria-label="알림 닫기">×</button></div>
    <p>아직 안 한 숙제: ${items.map(k=>EXP_NAME[k]).join(" · ")}</p>
    <div class="toast-items">${items.map(k=>`<button data-act="toast-done" data-t="${id}" data-k="${k}">${EXP_NAME[k]} 완료</button>`).join("")}</div>`;
  box.appendChild(el);
  setTimeout(()=>closeToast(id), 180000);                  // 3분 뒤 자동으로 닫힘
}
function closeToast(id){
  const el = document.getElementById(id); if(!el || el.classList.contains("out")) return;
  el.classList.add("out"); setTimeout(()=>el.remove(), 230);
}
try{ const u = JSON.parse(localStorage.getItem("loacheck-ui")||"{}"); ui.alarm = u.alarm !== false; ui.volume = Number.isFinite(u.volume) ? u.volume : 60; }catch(e){ ui.alarm = true; ui.volume = 60; }
scheduleAlarm();

let flashTimer=null;
function flash(k){ ui.flash=k; clearTimeout(flashTimer); flashTimer=setTimeout(()=>{ ui.flash=null; render(); },800); }

document.addEventListener("input", e=>{
  if(e.target.dataset?.spec){
    const el = e.target; ui.drafts[el.id] = el.value;
    if(focusSess && focusSess.id===el.id) focusSess.edited = true;
    clearTimeout(specTimers[el.id]);
    specTimers[el.id] = setTimeout(()=>{ const cur=document.getElementById(el.id); applySpecInput(cur||el); }, 2000);
    return;
  }
  if(e.target.id==="alarm-vol"){ ui.volume = Number(e.target.value); saveUi(); const t=document.getElementById("vol-text"); if(t) t.textContent = ui.volume>0 ? `음량 ${ui.volume}%` : "소리 끔"; return; }
  if(e.target.id==="api-key"){ ui.apiKeyInput=e.target.value.trim(); const b=document.querySelector('[data-act="api-save"]'); if(b) b.disabled=!ui.apiKeyInput; return; }
  if(e.target.id==="api-name"){ ui.apiName=e.target.value; return; }
  if(e.target.id==="login-email" || e.target.id==="login-pw"){
    if(e.target.id==="login-email") ui.loginEmail=e.target.value; else ui.loginPw=e.target.value;
    const b=document.getElementById("login-submit"); if(b && !ui.busy) b.disabled = !(ui.loginEmail.includes("@") && ui.loginPw.length>=6);
    return;
  }
  if(e.target.id==="life-input"){
    const v = e.target.value.replace(/\D/g,"").slice(0,5);
    if(v!==e.target.value) e.target.value=v;
    ui.lifeInput=v; const s=document.getElementById("life-save"); if(s && ui.flash!=="save") s.disabled=!v;
  }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Enter" && e.target.dataset?.spec){ applySpecInput(e.target); return; }
  if(e.key==="Escape" && ui.menu){ menuBack(); return; }
  if(e.key==="Enter" && (e.target.id==="login-email" || e.target.id==="login-pw")){ doLogin(); return; }
  if(e.key==="Enter" && e.target.id==="api-name" && S.apiKey && !ui.apiBusy){ apiSearch(); return; }
  if(e.key==="Enter" && e.target.id==="life-input" && ui.lifeInput){ document.getElementById("life-save")?.click(); }
  if(e.key==="Enter" && e.target.dataset?.field){ e.target.blur(); }
  if(e.key==="Escape"){ if(ui.settings){ closeSettings(); } else if(ui.edit){ ui.edit=false; render(); } }
});
document.addEventListener("change", e=>{
  if(e.target.id==="alarm-vol"){ chime(1); return; }   // 손을 떼면 그 크기로 한 번 들려줌
  if(e.target.id==="sp-gear"){ const id=e.target.dataset.id; SPEC(id).gear=e.target.value; syncBase(id); commit(); return; }
  const ck = e.target.dataset?.apiCheck;
  if(ck!=null){ if(e.target.checked) ui.apiChecked.add(ck); else ui.apiChecked.delete(ck); return; }
  const f=e.target.dataset?.field; if(!f) return;
  const c=byIdS(e.target.dataset.id); if(!c) return;
  if(f==="level"||f==="chaNum"){ const n = f==="level" ? parseFloat(e.target.value) : parseInt(e.target.value,10); if(!Number.isFinite(n)) { e.target.value=c[f]; return; } c[f]=n; }
  else { const v=e.target.value.trim(); if(f==="name" && !v){ e.target.value=c.name; return; } c[f]=v; }
  commit();
});

// 1분마다: 06시 초기화 확인 + 생기 회복 반영. 앱으로 돌아올 때도 즉시 확인.
function tick(){ if(!ui.user) return; if(applyResets()) commit(); else render(); }
setInterval(tick, 60000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ tick(); checkAlarm(); scheduleAlarm(); } });

render();
</script>
</body>
