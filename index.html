<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B111E" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
<title>로아췍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 고정 상단바 → 넓은 화면(≥1040px)은 일일|주간 2단, 좁은 화면은 탭으로 한쪽씩 */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --surface-done:#ECEFF4; --surface-warn:#FFF7E0;
  --line:#E0E4EC; --line-strong:#C9CFDA; --line-warn:#F2A900;
  --fg:#161A23; --muted:#687083; --faint:#9AA1B0;
  --accent:#3F51B5; --accent-fg:#3647A6; --accent-soft:rgba(63,81,181,.11);
  --guardian:#2196F3; --kurzan:#2E9E50; --gauge-empty:#E2E6EE; --seg-gap:#FFFFFF;
  --gold:#F29100; --gold-fg:#B86A00; --danger:#D93025;
  --shadow:0 1px 2px rgba(22,26,35,.06),0 4px 14px rgba(22,26,35,.05);
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B111E; --surface:#172030; --surface-done:#111824; --surface-warn:#13282C;
  --line:#26324A; --line-strong:#34425E; --line-warn:#00D9E6;
  --fg:#DCD7D1; --muted:#97A3B6; --faint:#66728A;
  --accent:#5466CC; --accent-fg:#A7B1E8; --accent-soft:rgba(110,128,230,.16);
  --guardian:#33ABDE; --kurzan:#1DAB51; --gauge-empty:#2C3850; --seg-gap:#172030;
  --gold:#CC7A00; --gold-fg:#FFAA2B; --danger:#FF6B5E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.18);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B111E; --surface:#172030; --surface-done:#111824; --surface-warn:#13282C;
  --line:#26324A; --line-strong:#34425E; --line-warn:#00D9E6;
  --fg:#DCD7D1; --muted:#97A3B6; --faint:#66728A;
  --accent:#5466CC; --accent-fg:#A7B1E8; --accent-soft:rgba(110,128,230,.16);
  --guardian:#33ABDE; --kurzan:#1DAB51; --gauge-empty:#2C3850; --seg-gap:#172030;
  --gold:#CC7A00; --gold-fg:#FFAA2B; --danger:#FF6B5E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.18);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* ── 상단바 ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-size:19px;font-weight:700;letter-spacing:-.02em}
.brand b i{font-style:normal;color:var(--accent-fg)}
.sync{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap}
.sync::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--faint)}
.sync[data-s="synced"]::before{background:var(--kurzan)}
.sync[data-s="saving"]::before,.sync[data-s="connecting"]::before{background:var(--gold)}
.sync[data-s="error"]::before{background:var(--danger)}
.tabs{display:flex;background:var(--surface-done);border:1px solid var(--line);border-radius:999px;padding:3px;margin-left:auto}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;color:var(--muted);font-size:13.5px}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.tools{display:flex;gap:6px}
.tool{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;height:38px;padding:0 10px;color:var(--muted);font-weight:600;font-size:13px}
.tool svg{width:18px;height:18px;flex:none}
.tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-fg)}
.tool .t{display:none}

/* ── 보드 ── */
.board{max-width:1240px;margin:0 auto;display:grid;gap:28px;padding-block:18px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.board[data-view="daily"] .panel-weekly,.board[data-view="weekly"] .panel-daily{display:none}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:0 2px}
.panel-head h2{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.panel-head span{color:var(--muted);font-size:13px}
@media (min-width:1040px){
  .board{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .board[data-view] .panel{display:flex}
  .tabs{display:none}
  .tools{margin-left:auto}
  .tool .t{display:inline}
}
@media (min-width:640px){.tool .t{display:inline}}

/* ── 공통 부품 ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.card.done{background:var(--surface-done);box-shadow:none}
.card.done .cname{color:var(--muted)}
.card.warn{background:var(--surface-warn);border-color:var(--line-warn)}
.chead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:2px}
.cname{font-size:16px;font-weight:700}
.cmeta{color:var(--muted);font-size:12.5px}
.ctag{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.card.warn .ctag{color:var(--gold-fg);border-color:var(--line-warn)}
.row{display:flex;align-items:center;gap:10px;min-height:34px}
.lbl{width:84px;flex:none;font-size:14px}
.card.done .lbl{color:var(--muted)}
.gwrap{flex:3 1 0;display:flex;align-items:center;gap:8px;min-width:96px;max-width:220px}
.gauge{--n:5;--v:0;position:relative;flex:1;height:13px;border-radius:3px;background:var(--gauge-empty);overflow:hidden}
.gauge::before{content:"";position:absolute;inset:0 auto 0 0;width:calc(var(--v) * 100%);background:var(--c,var(--guardian))}
.gauge::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(100% / var(--n) - 2px),var(--seg-gap) calc(100% / var(--n) - 2px) calc(100% / var(--n)))}
.gval{font-size:12px;color:var(--muted);width:34px;flex:none}
/* 게이지 슬라이더: 모양은 그대로, 누르거나 끌어서 값 조절 (세로 스크롤은 그대로 됨) */
.slide{cursor:pointer;touch-action:pan-y;user-select:none;-webkit-user-select:none;align-self:stretch}
.slide .gauge{pointer-events:none}
.slide.dragging .gauge::before{transition:none}
.gauge::before{transition:width .3s ease}
.spacer{flex:1}
.step{display:flex;gap:4px}
.sbtn{width:32px;height:32px;border:1px solid var(--line-strong);background:var(--surface);border-radius:7px;font-weight:700;font-size:17px;line-height:1;display:grid;place-items:center;color:var(--fg)}
.sbtn:hover{border-color:var(--accent)}
.chk{width:32px;height:32px;flex:none;border:1.5px solid var(--faint);background:transparent;border-radius:7px;display:grid;place-items:center;padding:0}
.chk svg{width:18px;height:18px;opacity:0}
.chk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.chk[aria-pressed="true"] svg{opacity:1}
.chk:hover{border-color:var(--accent)}

/* ── 일일: 생기 / 카게·필보 ── */
.strip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.life-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.life-top b{font-weight:600}
.life-top .num{font-weight:700}
.life-top .eta{margin-left:auto;color:var(--kurzan);font-size:13px;font-weight:600}
.bar{height:10px;border-radius:999px;background:var(--gauge-empty);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--c,var(--kurzan));transition:width .35s ease}
.life-edit{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.life-edit input{flex:1;min-width:120px;height:38px;border:1px solid var(--line-strong);border-radius:9px;background:var(--bg);color:var(--fg);padding:0 12px;font:inherit}
.pbtn{height:38px;padding:0 14px;border-radius:9px;border:1.5px solid var(--kurzan);background:transparent;font-weight:700}
.pbtn:disabled{border-color:var(--line);color:var(--faint);cursor:default}
.pbtn.ok{background:var(--kurzan);color:#fff;border-color:var(--kurzan)}
.exp{display:flex;gap:10px;flex-wrap:wrap}
.exp-head{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:0;text-align:left;color:var(--muted);font-weight:600;font-size:13.5px}
.exp-head span{flex:1}
.exp-head svg{width:18px;height:18px;transition:transform .2s}
.exp-head[aria-expanded="true"] svg{transform:rotate(180deg)}
.exp-head:disabled{cursor:default}
.reddot{width:7px;height:7px;border-radius:50%;background:var(--danger);flex:none}
.exp-item{flex:1 1 160px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.exp-item .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.exp-item.chaos .ico{background:linear-gradient(160deg,#6A3FB5,#2C1B57)}
.exp-item.boss .ico{background:linear-gradient(160deg,#C2552B,#5A1F0D)}
.exp-item.solo{border:0;padding:0}
.exp-item.estate .ico{background:linear-gradient(160deg,#3E9A5A,#174A2A)}
.exp-item b{flex:1;font-weight:600}
.exp-item.on b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.note{color:var(--muted);font-size:13px}

/* ── 주간 ── */
.raids{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.raid{position:relative;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 10px 8px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.raid:hover{border-color:var(--accent)}
.raid .rn{font-weight:700;font-size:14px}
.pips{display:flex;gap:3px}
.pips i{flex:1;height:5px;border-radius:2px;background:linear-gradient(var(--accent),var(--accent)) left/0% 100% no-repeat,var(--gauge-empty);transition:background-size .3s ease}
.pips i.on{background-size:100% 100%}
.raid .rg{font-size:12px;color:var(--gold-fg);font-weight:600}
.goldrow{display:flex;align-items:center;gap:12px}
.cleared-toggle{display:flex;align-items:center;justify-content:center;gap:4px;border:0;background:none;color:var(--muted);font-size:12.5px;padding:2px 0 0;margin-bottom:-4px}
.cleared-toggle svg{width:16px;height:16px;transition:transform .2s}
.cleared-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.goldrow .bar{flex:1;height:9px}
.goldrow .bar>i{--c:var(--gold)}
.goldrow .g{font-weight:700;color:var(--gold-fg);font-size:13.5px;white-space:nowrap}
.sub{border-top:1px dashed var(--line);padding-top:6px;display:flex;flex-direction:column;gap:2px}
.total{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.total .goldrow .bar{height:11px}
.total-top{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px}

.cards{display:flex;flex-direction:column;gap:10px}
.empty{border:1px dashed var(--line-strong);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent-fg);font-weight:600;padding:0;text-decoration:underline}

/* ── 설정 시트 ── */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,8,15,.45);display:flex;justify-content:flex-end}
.sheet{width:min(520px,100%);height:100%;background:var(--bg);overflow-y:auto;border-left:1px solid var(--line);
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.sheet-head{display:flex;align-items:center;justify-content:space-between}
.sheet-head h2{margin:0;font-size:19px}
.group h3{margin:0 0 6px;font-size:13px;color:var(--accent-fg);letter-spacing:.02em}
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px}
.opt{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt div{flex:1;min-width:0}
.opt b{display:block;font-weight:600}
.opt small{color:var(--muted);font-size:12.5px}
.sw{width:44px;height:26px;border-radius:999px;border:0;background:var(--line-strong);position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.roster{display:flex;flex-direction:column;gap:8px;padding:10px 0}
.rrow{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 72px 48px 34px;gap:6px;align-items:center}
.rrow.head{font-size:11.5px;color:var(--muted)}
.api{display:flex;flex-direction:column;gap:10px;padding:12px 0}
.api-row{display:flex;gap:8px;flex-wrap:wrap}
.api-row input{flex:1;min-width:140px;height:38px;border:1px solid var(--line-strong);border-radius:9px;background:var(--bg);color:var(--fg);padding:0 12px;font:inherit}
.api-row .tool{height:38px}
.api-msg{font-size:12.5px;color:var(--kurzan)}
.api-msg.err{color:var(--danger)}
.found{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;max-height:340px;overflow-y:auto}
.found label{display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.found label:last-child{border-bottom:0}
.found input{width:18px;height:18px;accent-color:var(--accent)}
.found b{display:block;font-size:14px}
.found small{color:var(--muted);font-size:12px}
.rrow input{width:100%;min-width:0;height:34px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--fg);padding:0 8px;font:inherit;font-size:13.5px}
.del{width:34px;height:34px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--muted);padding:0;font-size:12px}
.del.arm{border-color:var(--danger);color:var(--danger);width:auto;padding:0 6px}
.add{height:38px;border:1px dashed var(--line-strong);border-radius:9px;background:none;font-weight:600;color:var(--accent-fg)}
.fine{font-size:12.5px;color:var(--muted);margin:0}
/* ── 로그인 ── */
.login{min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login-card{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px 24px;display:flex;flex-direction:column;gap:12px}
.login-card h1{margin:0;font-size:28px;letter-spacing:-.02em}
.login-card h1 i{font-style:normal;color:var(--accent-fg)}
.login-card p{margin:0;color:var(--muted);font-size:13.5px}
.login-card label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600}
.login-card input{height:44px;border:1px solid var(--line-strong);border-radius:10px;background:var(--bg);color:var(--fg);padding:0 12px;font:inherit;font-size:15px}
.mainbtn{height:46px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:700;font-size:15px}
.mainbtn:disabled{opacity:.45;cursor:default}
.msg{font-size:13px;color:var(--danger)}
.msg.ok{color:var(--kurzan)}
.login-links{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:4px}
.loading{min-height:60vh;display:grid;place-items:center;color:var(--muted)}
/* ── 메뉴 패널 (오른쪽 15%, 본문은 밀리지 않음) ── */
.menu-scrim{position:fixed;inset:0;z-index:15;background:transparent}
.menu{position:fixed;top:0;right:0;bottom:0;z-index:16;width:clamp(220px,15vw,320px);background:var(--surface);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.12);
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-right:env(safe-area-inset-right,0px);display:flex;flex-direction:column;animation:menuIn .22s cubic-bezier(.2,.8,.2,1)}
.menu.closing{animation:menuOut .18s ease-in forwards}
@keyframes menuIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes menuOut{to{transform:translateX(100%)}}
.menu-head{display:flex;align-items:center;justify-content:space-between;padding:0 14px 10px;font-weight:700;color:var(--muted);font-size:12.5px;letter-spacing:.04em}
.menu-row{display:flex;align-items:center;gap:12px;border:0;border-top:1px solid var(--line);background:none;padding:15px 16px;text-align:left;font-size:15px;font-weight:600;color:var(--fg)}
.menu-row:last-child{border-bottom:1px solid var(--line)}
.menu-row svg{width:20px;height:20px;color:var(--muted);flex:none}
.menu-row[aria-current="page"]{background:var(--accent-soft);color:var(--accent-fg)}
.menu-row[aria-current="page"] svg{color:var(--accent-fg)}
.menu-row:hover{background:var(--surface-done)}

/* ── 스펙 현황 ── */
:root{--sec-grid:#0E8FC7;--sec-refine:#D9640A;--sec-adv:#D02B2E;--sec-spec:#3E9A08;--pick:#93B6FF;--pick-fg:#0B111E;--pick-line:#3F51B5;--slot:#E7EAF0;--field-bg:#F3F6FF;--field-fg:#3F51B5}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sec-grid:#1BA9E8;--sec-refine:#F07A1A;--sec-adv:#E5383B;--sec-spec:#5AD10F;--slot:#1A2232;--field-bg:#151C2B;--field-fg:#93B6FF}}
:root[data-theme="dark"]{--sec-grid:#1BA9E8;--sec-refine:#F07A1A;--sec-adv:#E5383B;--sec-spec:#5AD10F;--slot:#1A2232;--field-bg:#151C2B;--field-fg:#93B6FF}
.page{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:18px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page-head{display:flex;align-items:center;gap:10px}
.page-head h2{margin:0;font-size:19px;flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.page-head h2 small{font-size:13px;color:var(--muted);font-weight:500}
/* 스펙 수정 화면: 캐릭터 이름 줄은 스크롤해도 위에 고정 */
.page-head.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--top-h,59px));z-index:4;background:var(--bg);margin:-8px -16px 0;padding:8px 16px 10px;border-bottom:1px solid var(--line)}
.spec-card{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.spec-card:hover{border-color:var(--accent)}
.spec-card .info{flex:1;min-width:0}
.spec-card b{font-size:16px}
.spec-card small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.spec-card .nums{display:flex;gap:14px;font-size:13px;color:var(--muted);text-align:right}
.spec-card .nums b{display:block;font-size:15px;color:var(--fg)}
.spec-card svg{width:18px;height:18px;color:var(--faint);flex:none}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-title{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;border-bottom:3px solid var(--sec);padding-bottom:6px}
.sec-title h3{margin:0;font-size:24px;font-weight:800;color:var(--sec);letter-spacing:-.02em}
.sec-title select{border:1px solid var(--line-strong);background:var(--bg);color:var(--fg);border-radius:8px;padding:5px 8px;font:inherit;font-size:13px}
.grid-wrap{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);column-gap:10px}
.grid-col{text-align:center;color:var(--sec);font-weight:700;font-size:18px;padding:4px 0 10px}
.grid-row{display:contents}
.grid-row>*{padding:10px 0}
.grid-row:not(:last-child)>*{border-bottom:2px dashed var(--line-strong)}
.grid-lbl{display:grid;place-items:center;color:var(--sec);font-weight:800;font-size:20px;min-width:30px}
.gcell{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gbtn{height:34px;border:0;border-radius:7px;background:var(--slot);color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums;padding:0}
.gbtn[aria-pressed="true"]{background:var(--pick);color:var(--pick-fg);font-weight:700}
.parts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.parts{grid-template-columns:repeat(2,minmax(0,1fr))}.plabel{width:46px;font-size:13px}}
.part{display:flex;gap:5px;min-width:0}
.plabel{flex:none;width:56px;display:grid;place-items:center;border-radius:9px;border:2px solid var(--sec);background:color-mix(in srgb,var(--sec) 14%,var(--surface));color:var(--sec);font-weight:700;font-size:14px}
.pval{flex:1;min-width:0;min-height:44px;display:flex;align-items:stretch;border-radius:9px;border:2px solid var(--pick-line);background:var(--field-bg);color:var(--field-fg);padding:0;overflow:hidden;cursor:text}
.pval input{border:0;background:transparent;color:inherit;font:inherit;text-align:center;font-variant-numeric:tabular-nums;min-width:0;padding:0 3px;margin:0;height:auto;cursor:text}
.pval input:focus{outline:none;background:color-mix(in srgb,var(--field-fg) 14%,transparent);border-radius:4px}
.pval input::placeholder{color:var(--field-fg);opacity:.35}
.pval .big{font-size:19px;flex:1 1 0;width:0;text-align:right}
.pval .small{font-size:11.5px;flex:1 1 0;width:0;text-align:left;padding-top:11px}
.pval .full{font-size:19px;flex:1 1 0;width:0}
.stat-row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 20px;color:var(--sec);font-size:20px;font-weight:600}
.stat-row span{display:flex;align-items:baseline;gap:8px}
.stat-row b{font-variant-numeric:tabular-nums}
.stat-row input{width:7.5em;border:0;border-bottom:2px solid var(--sec);background:transparent;color:var(--sec);font:inherit;font-weight:700;font-variant-numeric:tabular-nums;padding:0 2px}
.stat-row input:focus{outline:none}
.hint{font-size:12px;color:var(--muted);margin:0}
.hist-week{display:flex;flex-direction:column;gap:12px}
.hist-week+.hist-week{border-top:2px dashed var(--line-strong);padding-top:16px}
.hist-week h3{margin:0;font-size:13px;color:var(--muted);font-weight:600}
.hist-char{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.hist-char b{display:block;margin-bottom:6px}
.hist-char ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px;font-variant-numeric:tabular-nums}
:root{--honor:#AF29C5}
/* ── 카게·필보 알림 토스트 (오른쪽 아래) ── */
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:10px;width:min(340px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;background:var(--surface);border:1px solid var(--line-strong);border-left:4px solid var(--gold);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:8px;animation:toastIn .28s cubic-bezier(.2,.8,.2,1)}
.toast.out{animation:toastOut .22s ease-in forwards}
@keyframes toastIn{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes toastOut{to{transform:translateX(30px);opacity:0}}
.toast-head{display:flex;align-items:center;gap:8px}
.toast-head b{flex:1;font-size:14.5px}
.toast-x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.toast-x:hover{background:var(--surface-done)}
.toast p{margin:0;color:var(--muted);font-size:13px}
.toast-items{display:flex;flex-wrap:wrap;gap:6px}
.toast-items button{height:32px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);padding:0 10px;font-weight:600;font-size:13px}
.toast-items button:hover{border-color:var(--accent);color:var(--accent-fg)}
.vol{width:150px;accent-color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div id="app"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-auth.js";
import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/12.12.0/firebase-firestore.js";

/* ───────────── Firebase 연결 정보 (Firebase 콘솔 → 웹 앱의 firebaseConfig) ───────────── */
const firebaseConfig = {
  apiKey: "AIzaSyBAj13bBs7aCehZWaMvAJjitt-yC7nAcmE",
  authDomain: "loacheck-6fdfd.firebaseapp.com",
  projectId: "loacheck-6fdfd",
  storageBucket: "loacheck-6fdfd.firebasestorage.app",
  messagingSenderId: "666551983975",
  appId: "1:666551983975:web:6fc788503e765de0aed9c2",
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const fdb = getFirestore(fbApp);

/* ───────────── 고정 데이터 ───────────── */
// 레이드 관문별 골드 (패치로 바뀌면 여기 숫자만 수정)
const RAIDS = {
  "2막":[5500,11000], "3막":[4000,7000,10000], "4막":[10000,17000],
  "종막":[11000,21000], "세르카":[13000,19000]
};
const raidTitlesFor = lv => lv >= 1710 ? ["4막","종막","세르카"] : ["2막","3막","4막"];
const DEFAULT_ROSTER = [
  {id:"c1",name:"라바샥",job:"소울이터",level:1710,chaNum:1},
  {id:"c2",name:"베샤몔",job:"데모닉",level:1710,chaNum:2},
  {id:"c3",name:"아크틕",job:"차원술사",level:1710,chaNum:3},
  {id:"c4",name:"예배댱",job:"발키리",level:1700,chaNum:4},
  {id:"c5",name:"세라믝",job:"기상술사",level:1710,chaNum:5},
  {id:"c6",name:"아이언맨이될래요",job:"스카우터",level:1710,chaNum:6},
];
const MAX_GAUGE=5, PARADISE_MAX=5, SIGN_MAX=3, HONOR_MAX=3, HOURGLASS_LV=1730;
const MAX_LIFE=11500, LIFE_TICK=30, TICK_MS=600000, LIFE_USE=4240;
const DAYS=["일","월","화","수","목","금","토"];
const CHAOS_DAYS=[1,4,6,0], BOSS_DAYS=[2,5,0];

/* ───────────── 로아 시간 (한국 06:00 기준) ───────────── */
// 게임 날짜 = 1970-01-01부터 센 날 수. 한국(+9h)에서 6시간 빼면 UTC+3h.
const loaDay = (t=Date.now()) => Math.floor((t + 3*3600e3) / 86400e3);
const dow = d => ((d + 4) % 7 + 7) % 7;               // 0=일 … 3=수
const weekStart = d => d - ((dow(d) - 3 + 7) % 7);    // 가장 최근 수요일
function dayLabel(d){ const x=new Date(d*86400e3); return `${x.getUTCMonth()+1}월 ${x.getUTCDate()}일 (${DAYS[dow(d)]})`; }

/* ───────────── 상태 ───────────── */
function freshState(){
  return { v:1,
    settings:{guardian:true, kurzan:true, guild:true, raids:true, paradise:false, medal:false, sign:false, honor:true, hourglass:true, estateBox:true, sortOnlyAll:false},
    roster: DEFAULT_ROSTER.map(c=>({...c})), progress:{},
    expedition:{chaos:false, field:false, estateBox:false},
    life:{energy:MAX_LIFE, ts:Date.now()},
    lastDaily: loaDay(), lastWeekly: loaDay(), updatedAt: Date.now(), apiKey: "",
    specs: {}, specHistory: {weekStart: weekStart(loaDay()), base: {}, archive: []} };
}
function normalize(d){
  const s=freshState(); if(!d || typeof d!=="object") return s;
  return { v:1,
    settings:{...s.settings, ...(d.settings||{})},
    roster: Array.isArray(d.roster) ? d.roster.map(c=>({id:String(c.id), name:String(c.name??""), job:String(c.job??""), level:Number(c.level)||0, chaNum:Number(c.chaNum)||0})) : s.roster,
    progress: (d.progress && typeof d.progress==="object") ? d.progress : {},
    expedition:{chaos:!!d.expedition?.chaos, field:!!d.expedition?.field, estateBox:!!d.expedition?.estateBox},
    life:{energy:Number(d.life?.energy ?? MAX_LIFE), ts:Number(d.life?.ts || Date.now())},
    lastDaily: Number.isFinite(d.lastDaily) ? d.lastDaily : loaDay(),
    lastWeekly: Number.isFinite(d.lastWeekly) ? d.lastWeekly : loaDay(),
    updatedAt: Number(d.updatedAt)||0,
    apiKey: typeof d.apiKey==="string" ? d.apiKey : "",
    specs: (d.specs && typeof d.specs==="object") ? d.specs : {},
    specHistory: {
      weekStart: Number.isFinite(d.specHistory?.weekStart) ? d.specHistory.weekStart : weekStart(loaDay()),
      base: (d.specHistory?.base && typeof d.specHistory.base==="object") ? d.specHistory.base : {},
      archive: Array.isArray(d.specHistory?.archive) ? d.specHistory.archive : [] } };
}
function P(id){
  const p = S.progress[id] ||= {};
  p.daily ||= {};
  for (const k of ["guardian","kurzan"]) p.daily[k] = {done:false,gauge:0,used:0,...(p.daily[k]||{})};
  p.daily.guild = {done:false,...(p.daily.guild||{})};
  p.raids ||= {};
  if(!Number.isFinite(p.paradise)) p.paradise = PARADISE_MAX;
  p.medal = !!p.medal;
  if(!Number.isFinite(p.sign)) p.sign = 0;
  if(!Number.isFinite(p.honor)) p.honor = HONOR_MAX;   // 명예 부여: 3/3에서 시작, 0이면 완료
  p.hourglass = !!p.hourglass;                          // 할의 모래시계 (1730 이상)
  return p;
}

let S = freshState();
let localKey = "loacheck-state";
const ui = { page:"main", specId:null, menu:false, drafts:{}, showClearedDaily:new Set(), showCleared:new Set(), expOpen:true, expKey:"", view:"daily", edit:false, sortSlot:false, settings:false, lifeInput:"", flash:null, armDel:null,
  apiKeyInput:"", apiName:"", apiFound:null, apiChecked:new Set(), apiMsg:"", apiErr:false, apiBusy:false,
  authReady:false, user:null, signUp:false, loginEmail:"", loginPw:"", loginMsg:"", loginOk:false, busy:false };
try{ const u=JSON.parse(localStorage.getItem("loacheck-ui")||"{}"); ui.view=u.view==="weekly"?"weekly":"daily"; ui.sortSlot=!!u.sortSlot; }catch(e){}
const saveUi = () => { try{ localStorage.setItem("loacheck-ui", JSON.stringify({view:ui.view, sortSlot:ui.sortSlot, alarm:ui.alarm!==false, volume:ui.volume})); }catch(e){} };

/* ───────────── 초기화 (매일 06시 / 수요일 06시) ───────────── */
function applyResets(){
  const today = loaDay(); let changed = false;
  const passed = today - S.lastDaily;
  if (passed >= 1){
    for (const c of S.roster){
      const p = P(c.id);
      for (const k of ["guardian","kurzan"]){
        const h = p.daily[k];
        const missed = h.done ? passed - 1 : passed;   // 마지막 날 했으면 그날은 휴게 안 쌓임
        h.gauge = Math.min(MAX_GAUGE, h.gauge + 0.5*missed);
        h.done = false; h.used = 0;
      }
      p.daily.guild.done = false;
    }
    S.expedition = {...S.expedition, chaos:false, field:false};   // 영지 상자(주간)는 그대로
    S.lastDaily = today; changed = true;
  } else if (passed < 0){ S.lastDaily = today; changed = true; }
  if (S.lastWeekly < weekStart(today)){
    for (const c of S.roster){ const p=P(c.id); p.raids={}; p.paradise=PARADISE_MAX; p.medal=false; p.sign=0; p.honor=HONOR_MAX; p.hourglass=false; }
    S.expedition.estateBox = false;   // 주간 원정대 숙제
    S.lastWeekly = today; changed = true;
  }
  if (specRollover()) changed = true;
  return changed;
}

/* ───────────── 스펙 현황 (앱 data/Spec.kt와 같은 규칙) ───────────── */
const GRID = [["oSun","질서","해"],["cSun","혼돈","해"],["oMoon","질서","달"],["cMoon","혼돈","달"],["oStar","질서","별"],["cStar","혼돈","별"]];
const GRID_VALUES = [10,14,17,18,19,20];
const PARTS = [["helmet","투구"],["shoulder","견갑"],["chest","상의"],["pants","하의"],["gloves","장갑"],["weapon","무기"]];
const GEAR = {tremor:{name:"운명의 전율", base:1675}, fury:{name:"운명의 업화", base:1590}};
const ADV_MAX = 4000, REFINE_MAX = 25;
const fin = v => typeof v==="number" && Number.isFinite(v);
function blankSpec(){
  return { gear:null, grid:Object.fromEntries(GRID.map(g=>[g[0],null])),
    refine:Object.fromEntries(PARTS.map(p=>[p[0],{lv:null,exp:0}])),
    adv:Object.fromEntries(PARTS.map(p=>[p[0],null])), power:null };
}
function normSpec(x){
  const b = blankSpec(); if(!x || typeof x!=="object") return b;
  b.gear = (x.gear==="tremor"||x.gear==="fury") ? x.gear : null;
  for(const [k] of GRID){ const v=x.grid?.[k]; b.grid[k] = GRID_VALUES.includes(v) ? v : null; }
  for(const [k] of PARTS){
    const r = x.refine?.[k] || {};
    b.refine[k] = {lv: fin(r.lv) ? r.lv : null, exp: fin(r.exp) ? r.exp : 0};
    b.adv[k] = fin(x.adv?.[k]) ? x.adv[k] : null;
  }
  b.power = fin(x.power) ? x.power : null;
  return b;
}
const SPEC = id => (S.specs[id] = normSpec(S.specs[id]));
const advStage = v => Math.min(40, Math.floor((v||0)/100));
// 아이템 레벨 = 6부위 평균 (소수 셋째 자리부터 버림), 부위 = 기본값(전율 1675/업화 1590) + 재련×5 (+ 업화만 상급재련 단계×1). 재련이 하나라도 비면 계산 안 함.
function specItemLevel(sp){
  if(PARTS.some(([k])=>sp.refine[k].lv==null)) return null;
  const gear = sp.gear||"tremor", base = GEAR[gear].base;
  const avg = PARTS.reduce((a,[k])=>a + base + sp.refine[k].lv*5 + (gear==="fury" ? advStage(sp.adv[k]) : 0), 0) / 6;
  return Math.floor(avg*100 + 1e-6) / 100;   // 게임처럼 버림 (1734.1666 → 1734.16)
}
const f2 = v => (Math.round(v*100)/100).toFixed(2);
const pad4 = v => String(v).padStart(4,"0");
const refText = r => r.lv + (r.exp>0 ? `(${f2(r.exp)})` : "");
// 주 시작 시점(base) → 지금(cur) 변화 기록. 처음 입력(빈칸→값)은 기록하지 않음.
function specDiffLines(b, c){
  const out = [];
  for(const [k,col,row] of GRID) if(b.grid[k]!=null && c.grid[k]!=null && c.grid[k]>b.grid[k]) out.push(`${col}의 ${row} ${b.grid[k]} -> ${c.grid[k]}`);
  for(const [k,name] of PARTS){
    const x=b.refine[k], y=c.refine[k];
    if(x.lv!=null && y.lv!=null && (x.lv!==y.lv || f2(x.exp)!==f2(y.exp))) out.push(`${name} 재련 ${refText(x)} -> ${refText(y)}`);
  }
  for(const [k,name] of PARTS) if(b.adv[k]!=null && c.adv[k]!=null && b.adv[k]!==c.adv[k]) out.push(`${name} 상급재련 ${pad4(b.adv[k])} -> ${pad4(c.adv[k])}`);
  const li=specItemLevel(b), lc=specItemLevel(c);
  if(li!=null && lc!=null && f2(li)!==f2(lc)) out.push(`아이템 레벨 ${f2(li)} -> ${f2(lc)}`);
  if(b.power!=null && c.power!=null && f2(b.power)!==f2(c.power)) out.push(`전투력 ${f2(b.power)} -> ${f2(c.power)}`);
  return out;
}
// 처음 입력한 값은 이번 주 시작값으로 삼음
function syncBase(id){
  const cur = SPEC(id), h = S.specHistory, b = normSpec(h.base[id]);
  if(b.gear==null && cur.gear!=null) b.gear = cur.gear;
  for(const [k] of GRID) if(b.grid[k]==null && cur.grid[k]!=null) b.grid[k] = cur.grid[k];
  for(const [k] of PARTS){
    if(b.refine[k].lv==null && cur.refine[k].lv!=null) b.refine[k] = {...cur.refine[k]};
    if(b.adv[k]==null && cur.adv[k]!=null) b.adv[k] = cur.adv[k];
  }
  if(b.power==null && cur.power!=null) b.power = cur.power;
  h.base[id] = b;
}
// 수요일 06시가 지나면: 지난주 기록을 보관함(archive)으로 옮기고, 지금 스펙을 새 주의 시작값으로
function specRollover(){
  const ws = weekStart(loaDay()), h = S.specHistory;
  if(h.weekStart >= ws) return false;
  const chars = [];
  for(const c of [...S.roster].sort(bySlot)){
    const lines = specDiffLines(normSpec(h.base[c.id]), SPEC(c.id));
    if(lines.length) chars.push({name:c.name, lines});
  }
  if(chars.length) h.archive.unshift({weekStart:h.weekStart, chars});
  h.archive = h.archive.slice(0, 26);
  h.base = Object.fromEntries(S.roster.map(c=>[c.id, JSON.parse(JSON.stringify(SPEC(c.id)))]));
  h.weekStart = ws;
  return true;
}

/* ───────────── 계산 ───────────── */
function toggleHw(h){
  if(!h.done){ const cost = h.gauge >= 1 ? 1 : 0; h.gauge -= cost; h.used = cost; h.done = true; }
  else { h.gauge = Math.min(MAX_GAUGE, h.gauge + (h.used||0)); h.used = 0; h.done = false; }
}
function lifeStatus(now=Date.now()){
  const el = Math.max(0, now - S.life.ts), ticks = Math.floor(el / TICK_MS);
  const cur = Math.max(0, Math.min(MAX_LIFE, S.life.energy + ticks*LIFE_TICK));
  const miss = MAX_LIFE - cur;
  let mins = 0;
  if (miss > 0){ const need = Math.ceil(miss / LIFE_TICK); mins = Math.ceil((TICK_MS - el % TICK_MS + (need-1)*TICK_MS) / 60000); }
  return {cur, mins, lastTick: S.life.ts + ticks*TICK_MS};
}
function raidsOf(c){
  const p = P(c.id);
  return raidTitlesFor(c.level).map(t=>{
    const gates = RAIDS[t] || [30000];
    const cleared = Math.min(p.raids[t]||0, gates.length);
    return {title:t, gates, cleared, full: cleared>=gates.length,
      earned: gates.slice(0,cleared).reduce((a,b)=>a+b,0), max: gates.reduce((a,b)=>a+b,0)};
  });

// 설정의 '표시할 숙제'에서 켠 것만 (앱 AppSettings.showsDaily / visibleGaugeHomeworks와 같음)
const shownGauge = () => ["guardian","kurzan"].filter(k=>S.settings[k]!==false);

const dailyDone = c => { const d=P(c.id).daily; return shownDaily().every(k=>d[k].done); };
const hasHourglass = c => (Number(c.level)||0) >= HOURGLASS_LV;
const weeklyDone = c => { const p=P(c.id); return (S.settings.raids===false || raidsOf(c).every(r=>r.full)) && (!S.settings.paradise||p.paradise===0) && (!S.settings.medal||p.medal) && (!S.settings.sign||p.sign>=SIGN_MAX)
  && (S.settings.honor===false||p.honor===0) && (S.settings.hourglass===false||!hasHourglass(c)||p.hourglass); };
const gaugeSum = c => { const d=P(c.id).daily; return shownGauge().reduce((a,k)=>a + d[k].gauge + (S.settings.sortOnlyAll ? d[k].used : 0), 0); };
// 아이템 레벨 표시: 1712.50 (앱 formatItemLevel과 같음)

// '카던' 이름은 레벨에 따라 다름 (저장 키는 그대로 kurzan, 앱 chaosContentName과 같음)

const goldOf = c => raidsOf(c).reduce((a,r)=>({earned:a.earned+r.earned, max:a.max+r.max}), {earned:0,max:0});
const bySlot = (a,b) => a.chaNum-b.chaNum || a.name.localeCompare(b.name,"ko");
function dailyCmp(a,b){ if(ui.sortSlot) return bySlot(a,b); return (dailyDone(a)-dailyDone(b)) || (gaugeSum(b)-gaugeSum(a)) || a.name.localeCompare(b.name,"ko"); }
function weeklyCmp(a,b){ if(ui.sortSlot) return bySlot(a,b); const ga=goldOf(a), gb=goldOf(b); return (weeklyDone(a)-weeklyDone(b)) || ((gb.max-gb.earned)-(ga.max-ga.earned)) || a.name.localeCompare(b.name,"ko"); }

// 정렬은 0.4초 늦게 따라감 (체크하자마자 카드가 튀지 않게)
const dOrd={order:null,timer:null}, wOrd={order:null,timer:null}, wMemo={key:null,order:null};
function settle(o, target, hold){
  const same = o.order && o.order.length===target.length && target.every(id=>o.order.includes(id));
  if(!same){ clearTimeout(o.timer); o.timer=null; o.order=target; return o.order; }
  if(o.order.join()===target.join()){ clearTimeout(o.timer); o.timer=null; return o.order; }
  if(!hold){ clearTimeout(o.timer); o.timer=setTimeout(()=>{ o.timer=null; o.order=null; render(); }, 400); }
  return o.order;
}
function weeklyTarget(){
  // 관문 하나 깰 때마다 움직이지 않도록, 레이드 완료/주간 완료가 바뀔 때만 다시 계산
  const key = (ui.sortSlot?"s":"g") + JSON.stringify(S.settings) + S.roster.map(c=>c.id+":"+raidsOf(c).map(r=>+r.full).join("")+(+weeklyDone(c))).join("|");
  if(key!==wMemo.key) wMemo.key=key, wMemo.order=[...S.roster].sort(weeklyCmp).map(c=>c.id);
  return wMemo.order;
}

/* ───────────── 저장 & 기기 간 동기화 (Firebase) ───────────── */
// 저장 위치: users/{계정id}/data/state  — 휴대폰 앱과 같은 문서, 같은 형식
let docRef=null, unsub=null, initialSynced=false, dirty=false, saving=false, saveAgain=false, lastSavedKey="", saveTimer=null, loadTimer=null, syncState="connecting";
const SYNC_TEXT = {connecting:"동기화 연결 중…", saving:"저장 중…", synced:"휴대폰과 동기화됨", error:"동기화 실패 · 이 브라우저에는 저장됨", slow:"서버 응답이 늦어요"};
// 키 순서와 저장 시각을 무시하고 내용만 비교
const sortKeys = v => Array.isArray(v) ? v.map(sortKeys) : (v && typeof v==="object") ? Object.keys(v).sort().reduce((o,k)=>(o[k]=sortKeys(v[k]),o),{}) : v;
const keyOf = obj => JSON.stringify(sortKeys({...obj, updatedAt:0}));
function setSync(s){ syncState=s; const el=document.querySelector("[data-sync]"); if(el){ el.dataset.s=s; el.textContent=SYNC_TEXT[s]; } }
function saveLocal(){ try{ localStorage.setItem(localKey, JSON.stringify(S)); }catch(e){} }
function commit(){ S.updatedAt=Date.now(); saveLocal(); render(); dirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(flush, 500); }
async function flush(){
  if(!docRef || !initialSynced) return;
  if(saving){ saveAgain=true; return; }
  saving=true; setSync("saving");
  const snapshot = JSON.parse(JSON.stringify(S)), key = keyOf(snapshot);
  try{ await setDoc(docRef, snapshot); lastSavedKey=key; if(keyOf(S)===key) dirty=false; setSync("synced"); }
  catch(e){ setSync("error"); setTimeout(()=>{ if(dirty) flush(); }, 3000); }
  finally{ saving=false; if(saveAgain){ saveAgain=false; flush(); } }
}
function onSnap(snap){
  if(snap.metadata.hasPendingWrites) return;
  const definitive = !snap.metadata.fromCache;
  if(definitive) clearTimeout(loadTimer);
  const first = definitive && !initialSynced;
  if(definitive) initialSynced = true;
  if(!snap.exists()){ if(first) flush(); else if(definitive) setSync("synced"); return; }   // 처음이면 이 브라우저 기록을 올림
  const data = snap.data(), key = keyOf(data);
  if(key===lastSavedKey){ if(definitive) setSync("synced"); return; }
  if(!first && (dirty || saving)) return;   // 방금 여기서 바꾼 게 더 최신 → 곧 덮어씀
  S = normalize(data); lastSavedKey=key; dirty=false; clearTimeout(saveTimer);
  dOrd.order=wOrd.order=null; wMemo.key=null;
  const changed = applyResets(); saveLocal(); render();
  setSync(definitive ? "synced" : "connecting");
  if(changed) commit();
}
onAuthStateChanged(auth, user=>{
  if(unsub){ unsub(); unsub=null; }
  clearTimeout(loadTimer); clearTimeout(saveTimer);
  ui.authReady = true; ui.user = user; ui.busy = false;
  docRef = null; initialSynced = false; dirty = false; saving = false; lastSavedKey = "";
  if(user){
    localKey = "loacheck-state-" + user.uid;
    try{ S = normalize(JSON.parse(localStorage.getItem(localKey))); }catch(e){ S = freshState(); }
    if(applyResets()) saveLocal();
    dOrd.order=wOrd.order=null; wMemo.key=null;
    docRef = doc(fdb, "users", user.uid, "data", "state");
    setSync("connecting");
    loadTimer = setTimeout(()=>setSync("slow"), 10000);
    unsub = onSnapshot(docRef, {includeMetadataChanges:true}, onSnap, ()=>{ clearTimeout(loadTimer); setSync("error"); });   // 앱과 같게: 서버 연결 신호도 받음
  }
  render();
});

// 앱 data/LostArkApi.kt와 같은 동작. 원정대 목록: GET /characters/{이름}/siblings
const LOA_API = "https://developer-lostark.game.onstove.com";
async function fetchSiblings(name){
  if(!S.apiKey) throw new Error("먼저 API 키를 저장해 주세요.");
  if(!name.trim()) throw new Error("캐릭터 이름을 입력해 주세요.");
  let res;
  try{
    res = await fetch(`${LOA_API}/characters/${encodeURIComponent(name.trim())}/siblings`,
      {headers:{accept:"application/json", authorization:"bearer "+S.apiKey}});
  }catch(e){
    throw new Error("웹에서는 로스트아크 서버에 연결하지 못했어요. 휴대폰 앱의 설정에서 불러오면 웹에도 자동으로 반영돼요.");
  }
  if(res.status===401) throw new Error("API 키가 올바르지 않아요. 키를 다시 확인해 주세요.");
  if(res.status===429) throw new Error("요청이 너무 많아요. 1분 뒤 다시 시도해 주세요.");
  if(res.status===503) throw new Error("로스트아크 서버 점검 중이에요. 나중에 다시 시도해 주세요.");
  if(!res.ok) throw new Error(`정보를 불러오지 못했어요. (오류 ${res.status})`);
  const data = await res.json().catch(()=>null);
  if(!Array.isArray(data) || !data.length) throw new Error("캐릭터를 찾을 수 없어요. 이름을 확인해 주세요.");
  return data.map(o=>({server:String(o.ServerName||""), name:String(o.CharacterName||""), job:String(o.CharacterClassName||""),
    level: parseFloat(String(o.ItemAvgLevel||"0").replace(/,/g,""))||0})).sort((a,b)=>b.level-a.level);
}
const newId = () => "c" + Math.random().toString(36).slice(2,12);
// 체크한 캐릭터는 추가/갱신, 불러온 목록에 있지만 체크 해제한 캐릭터는 제거, 목록에 없는 캐릭터는 그대로
function applyRosterImport(found, checked){
  const byName = Object.fromEntries(found.map(f=>[f.name,f]));
  const next = [];
  for(const c of S.roster){
    const f = byName[c.name];
    if(!f) next.push(c);
    else if(checked.has(c.name)) next.push({...c, job:f.job, level:f.level});
    else delete S.progress[c.id];
  }
  let num = Math.max(0, ...S.roster.map(c=>c.chaNum)) + 1;
  for(const f of found) if(checked.has(f.name) && !S.roster.some(c=>c.name===f.name)) next.push({id:newId(), name:f.name, job:f.job, level:f.level, chaNum:num++});
  S.roster = next;
}
async function apiSearch(){
  ui.apiBusy=true; ui.apiMsg="불러오는 중…"; ui.apiErr=false; render();
  try{
    const list = await fetchSiblings(ui.apiName);
    const main = list.find(f=>f.name===ui.apiName.trim())?.server;
    ui.apiFound = list.sort((a,b)=>((a.server===main?0:1)-(b.server===main?0:1)) || b.level-a.level);
    ui.apiChecked = new Set(list.filter(f=>S.roster.some(c=>c.name===f.name)).map(f=>f.name));
    ui.apiMsg = "원정대에 넣을 캐릭터를 체크하고 '적용'을 누르세요. 체크를 해제한 캐릭터는 목록에서 빠져요.";
  }catch(e){ ui.apiMsg=e.message; ui.apiErr=true; }
  ui.apiBusy=false; render();
}
async function apiRefresh(){
  if(!S.roster.length) return;
  ui.apiBusy=true; ui.apiMsg="레벨을 불러오는 중…"; ui.apiErr=false; render();
  try{
    const first = [...S.roster].sort(bySlot)[0];
    const byName = Object.fromEntries((await fetchSiblings(first.name)).map(f=>[f.name,f]));
    let changed = 0;
    S.roster = S.roster.map(c=>{ const f=byName[c.name]; if(!f || (f.job===c.job && f.level===c.level)) return c; changed++; return {...c, job:f.job, level:f.level}; });
    ui.apiMsg = changed ? `${changed}명의 직업·레벨을 갱신했어요.` : "이미 최신 레벨이에요.";
    if(changed) commit();
  }catch(e){ ui.apiMsg=e.message; ui.apiErr=true; }
  ui.apiBusy=false; render();
}

      ${showBoss ? `<div class="exp-item boss ${S.expedition.field?"on":""}"><span class="ico">필보</span><b>필드 보스</b>${chk(S.expedition.field,"exp",'data-k="field"',"필드 보스 완료")}</div>` : ""}
    </div>`;

  const order = settle(dOrd, [...S.roster].sort(dailyCmp).map(c=>c.id), ui.edit);
  const byId = Object.fromEntries(S.roster.map(c=>[c.id,c]));
  const cards = order.map(id=>byId[id]).filter(Boolean).map(dailyCard).join("");

  return `<section class="panel panel-daily">
    <div class="panel-head"><h2>일일 숙제</h2><span class="num">${dayLabel(today)}</span></div>
    <div class="strip">
      <div class="life-top"><b>생활의 기운</b><span class="num">${fmt(life.cur)} <span class="note">/ ${fmt(MAX_LIFE)}</span></span><span class="eta">${eta}</span></div>
      <div class="bar"><i style="width:${life.cur/MAX_LIFE*100}%"></i></div>
      ${lifeEdit}
    </div>
    <div class="strip">${exp}</div>
    <div class="cards">${cards || emptyRoster()}</div>
  </section>`;
}

function dailyCard(c){
  const d = P(c.id).daily, done = dailyDone(c);
  const warn = shownGauge().some(k=>d[k].gauge>=MAX_GAUGE && !d[k].done);
  const row = (k, label, color) => {
    const h = d[k];
    return `<div class="row"><span class="lbl">${label}</span>
      ${slideGauge("rest", c.id, k, h.gauge, MAX_GAUGE, 0.5, color, `${c.name} ${label} 휴식 게이지`)}
      ${ui.edit ? `<div class="step"><button class="sbtn" data-act="gauge" data-id="${c.id}" data-k="${k}" data-d="-0.5" aria-label="${label} 휴게 줄이기">−</button><button class="sbtn" data-act="gauge" data-id="${c.id}" data-k="${k}" data-d="0.5" aria-label="${label} 휴게 늘리기">+</button></div>` : ""}
      <span class="spacer"></span>${chk(h.done,"hw",`data-id="${c.id}" data-k="${k}"`,`${c.name} ${label} 완료`)}</div>`;
  };
  // 끝낸 일일 숙제는 숨김. '완료한 숙제 N개 보기' 또는 수정 모드에서 다시 보임 (앱 DailyCharacterCard와 같은 동작)
  const showCleared = ui.edit || ui.showClearedDaily.has(c.id);
  const show = k => showCleared || !d[k].done;
  const clearedCount = shownDaily().filter(k=>d[k].done).length;
  return `<article class="card ${done?"done":""} ${warn?"warn":""}" data-card="d-${c.id}">
    <div class="chead"><span class="cname">${esc(c.name)}</span><span class="cmeta">${esc(c.job)} · Lv.${fmtLv(c.level)}</span>${warn?`<span class="ctag">휴게 가득</span>`:done?`<span class="ctag">완료</span>`:""}</div>
    ${S.settings.guardian!==false && show("guardian") ? row("guardian","가디언 토벌","--guardian") : ""}
    ${S.settings.kurzan!==false && show("kurzan") ? row("kurzan",chaosName(c.level),"--kurzan") : ""}
    ${S.settings.guild && show("guild") ? `<div class="row"><span class="lbl">길드 출석</span><span class="spacer"></span>${chk(d.guild.done,"hw",`data-id="${c.id}" data-k="guild"`,`${c.name} 길드 출석 완료`)}</div>` : ""}
    ${clearedCount && !ui.edit ? `<button class="cleared-toggle" data-act="show-cleared-daily" data-id="${c.id}" aria-expanded="${showCleared}">${showCleared ? "완료한 숙제 숨기기" : `완료한 숙제 ${clearedCount}개 보기`}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>` : ""}
  </article>`;
}

function weeklyPanel(){
  const order = settle(wOrd, weeklyTarget(), false);
  const byId = Object.fromEntries(S.roster.map(c=>[c.id,c]));
  const total = S.roster.reduce((a,c)=>{ const g=goldOf(c); return {earned:a.earned+g.earned, max:a.max+g.max}; }, {earned:0,max:0});
  const cards = order.map(id=>byId[id]).filter(Boolean).map(weeklyCard).join("");
  const start = weekStart(loaDay());
  return `<section class="panel panel-weekly">
    <div class="panel-head"><h2>주간 숙제</h2><span class="num">${dayLabel(start).replace(/ \(.\)/,"")} 수요일부터</span></div>
    ${S.settings.raids===false ? "" : `<div class="total">
      <div class="total-top"><span>원정대 획득 골드</span><span class="num">${fmt(total.max)} G 중</span></div>
      <div class="goldrow"><div class="bar"><i data-bkey="gold-total" style="width:${total.max?total.earned/total.max*100:0}%;--c:var(--gold)"></i></div><span class="g num" data-nkey="gold-total" data-n="${total.earned}">${fmt(total.earned)} G</span></div>
    </div>`}
    ${S.settings.estateBox!==false ? `<div class="strip"><div class="exp"><div class="exp-item estate solo ${S.expedition.estateBox?"on":""}"><span class="ico">영지</span><b>영지 활동 지원 상자 구입</b>${chk(!!S.expedition.estateBox,"exp",'data-k="estateBox"',"영지 활동 지원 상자 구입 완료")}</div></div></div>` : ""}
    <div class="cards">${cards || emptyRoster()}</div>

}

// 끝낸 주간 숙제(다 깬 레이드, 낙원 0, 메달 교환, 이정표 3/3, 명예 0/3, 모래시계)는 숨기고,
// '완료한 숙제 N개 보기'를 누르면 다시 보여줌 (앱 WeeklyCharacterCard와 같은 동작)
function weeklyCard(c){
  const p = P(c.id), raids = raidsOf(c), g = goldOf(c), done = weeklyDone(c);
  const showCleared = ui.showCleared.has(c.id);
  const raidsOn = S.settings.raids!==false;
  const shownRaids = showCleared ? raids : raids.filter(r=>!r.full);
  const paraDone = p.paradise===0, signDone = p.sign>=SIGN_MAX, honorDone = p.honor===0;
  const honorOn = S.settings.honor!==false, glassOn = S.settings.hourglass!==false && hasHourglass(c);
  const clearedCount = (raidsOn ? raids.filter(r=>r.full).length : 0) + (S.settings.paradise && paraDone ? 1 : 0) + (S.settings.medal && p.medal ? 1 : 0) + (S.settings.sign && signDone ? 1 : 0)
    + (honorOn && honorDone ? 1 : 0) + (glassOn && p.hourglass ? 1 : 0);

  const tiles = shownRaids.map(r=>`<button class="raid" data-act="raid" data-id="${c.id}" data-r="${esc(r.title)}"
      aria-label="${esc(c.name)} ${esc(r.title)} ${r.cleared}/${r.gates.length}관문. ${r.full?"누르면 0관문으로 되돌림":"누르면 다음 관문 클리어"}">
      <span class="rn">${esc(r.title)}</span>
      <span class="pips">${r.gates.map((_,i)=>`<i data-pkey="${c.id}-${esc(r.title)}-${i}" class="${i<r.cleared?"on":""}"></i>`).join("")}</span>
      <span class="rg num">${r.full ? "완료 · 누르면 되돌림" : `${r.cleared+1}관 +${fmt(r.gates[r.cleared])}`}</span>
    </button>`).join("");
  const extras = [];
  if(S.settings.paradise && (showCleared || !paraDone)) extras.push(`<div class="row"><span class="lbl">낙원:천상</span>${slideGauge("para",c.id,"",p.paradise,PARADISE_MAX,1,"--guardian",`${c.name} 낙원`)}<span class="spacer"></span>
      <div class="step"><button class="sbtn" data-act="para" data-id="${c.id}" data-v="0" aria-label="낙원 0으로">0</button><button class="sbtn" data-act="para" data-id="${c.id}" data-d="-1" aria-label="낙원 줄이기">−</button><button class="sbtn" data-act="para" data-id="${c.id}" data-d="1" aria-label="낙원 늘리기">+</button></div></div>`);
  if(S.settings.medal && (showCleared || !p.medal)) extras.push(`<div class="row"><span class="lbl">클리어 메달</span><span class="note">교환</span><span class="spacer"></span>${chk(p.medal,"medal",`data-id="${c.id}"`,`${c.name} 클리어 메달 교환 완료`)}</div>`);
  if(S.settings.sign && (showCleared || !signDone)) extras.push(`<div class="row"><span class="lbl">이정표 미션</span>${slideGauge("sign",c.id,"",p.sign,SIGN_MAX,1,"--kurzan",`${c.name} 이정표 미션`)}<span class="spacer"></span>
      <div class="step"><button class="sbtn" data-act="sign" data-id="${c.id}" data-d="-1" aria-label="이정표 줄이기">−</button><button class="sbtn" data-act="sign" data-id="${c.id}" data-d="1" aria-label="이정표 늘리기">+</button></div></div>`);
  if(honorOn && (showCleared || !honorDone)) extras.push(`<div class="row"><span class="lbl">명예 부여</span>${slideGauge("honor",c.id,"",p.honor,HONOR_MAX,1,"--honor",`${c.name} 명예 부여`)}<span class="spacer"></span>
      <div class="step"><button class="sbtn" data-act="honor" data-id="${c.id}" data-d="-1" aria-label="명예 부여 줄이기">−</button><button class="sbtn" data-act="honor" data-id="${c.id}" data-d="1" aria-label="명예 부여 늘리기">+</button></div></div>`);
  if(glassOn && (showCleared || !p.hourglass)) extras.push(`<div class="row"><span class="lbl" style="white-space:nowrap">할의 모래시계</span><span class="spacer"></span>${chk(p.hourglass,"hourglass",`data-id="${c.id}"`,`${c.name} 할의 모래시계 완료`)}</div>`);
  const allRaidsDone = raids.every(r=>r.full);
  return `<article class="card ${done?"done":""}" data-card="w-${c.id}">
    <div class="chead"><span class="cname">${esc(c.name)}</span><span class="cmeta">${esc(c.job)} · Lv.${fmtLv(c.level)}</span>${done?`<span class="ctag">완료</span>`:""}</div>
    ${raidsOn && tiles ? `<div class="raids">${tiles}</div>` : ""}
    ${raidsOn && (showCleared || !allRaidsDone) ? `<div class="goldrow"><div class="bar"><i data-bkey="gold-${c.id}" style="width:${g.max?g.earned/g.max*100:0}%;--c:var(--gold)"></i></div><span class="g num" data-nkey="gold-${c.id}" data-n="${g.max-g.earned}" data-pre="남은 ">남은 ${fmt(g.max-g.earned)} G</span></div>` : ""}
    ${extras.length ? `<div class="sub">${extras.join("")}</div>` : ""}
    ${clearedCount ? `<button class="cleared-toggle" data-act="show-cleared" data-id="${c.id}" aria-expanded="${showCleared}">${showCleared ? "완료한 숙제 숨기기" : `완료한 숙제 ${clearedCount}개 보기`}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>` : ""}
  </article>`;
}

      <div class="sec-title"><h3>재련</h3>

      <div class="parts">${refine}</div>

function historyPage(){
  const h = S.specHistory;
  const weekLabel = ws => dayLabel(ws).replace(/ \(.\)/,"") + " 수요일 주";
  const block = chars => chars.map(ch=>`<div class="hist-char"><b>${esc(ch.name)}</b><ul>${ch.lines.map(l=>`<li>${esc(l)}</li>`).join("")}</ul></div>`).join("");
  const current = [...S.roster].sort(bySlot).map(c=>({name:c.name, lines:specDiffLines(normSpec(h.base[c.id]), SPEC(c.id))})).filter(x=>x.lines.length);
  const weeks = [`<div class="hist-week"><h3>이번 주 · ${weekLabel(h.weekStart)}</h3>${current.length ? block(current) : `<p class="hint">이번 주 스펙업 기록이 아직 없어요.</p>`}</div>`]
    .concat(h.archive.map(w=>`<div class="hist-week"><h3>${weekLabel(w.weekStart)}</h3>${block(w.chars||[])}</div>`));
  return `<main class="page">
    <div class="page-head"><button class="tool" data-act="back" aria-label="뒤로">${ICON.back}</button><h2>스펙업 히스토리</h2></div>
    ${weeks.join("")}
  </main>`;
}

// 스펙 숫자 입력 적용 (입력을 멈추고 2초 뒤, 또는 Enter)
const specTimers = {};
function applySpecInput(el){
  const id = el.dataset.id, k = el.dataset.k, kind = el.dataset.spec, raw = el.value.trim();
  delete ui.drafts[el.id]; clearTimeout(specTimers[el.id]);
  const sp = SPEC(id);
  if(kind==="lv"){ const n=parseInt(raw,10); sp.refine[k].lv = raw==="" ? null : (Number.isFinite(n) ? Math.max(0,Math.min(REFINE_MAX,n)) : sp.refine[k].lv); }
  else if(kind==="exp"){ const n=parseFloat(raw); sp.refine[k].exp = raw==="" ? 0 : (Number.isFinite(n) ? Math.max(0,Math.min(99.99,Math.round(n*100)/100)) : sp.refine[k].exp); }
  else if(kind==="adv"){ const n=parseInt(raw,10); sp.adv[k] = raw==="" ? null : (Number.isFinite(n) ? Math.max(0,Math.min(ADV_MAX,n)) : sp.adv[k]); }
  else if(kind==="power"){ const n=parseFloat(raw.replace(/,/g,"")); sp.power = raw==="" ? null : (Number.isFinite(n) ? Math.max(0,Math.round(n*100)/100) : sp.power); }
  syncBase(id); commit();
}

let rendering = false;
function countUp(el, from, to){
  const pre = el.dataset.pre || "", t0 = performance.now(), dur = 450;
  el.dataset.shown = from;
  const step = now => {
    if(!el.isConnected) return;
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3), v = Math.round(from + (to - from) * e);
    el.dataset.shown = v; el.textContent = `${pre}${fmt(v)} G`;
    if(k < 1) requestAnimationFrame(step); else delete el.dataset.shown;
  };
  requestAnimationFrame(step);
}
function render(){
  const app = document.getElementById("app");
  if(!ui.authReady || !ui.user){
    const a0=document.activeElement, id0=a0&&a0.id;
    app.innerHTML = !ui.authReady ? `<div class="loading">불러오는 중…</div>` : loginView();
    if(id0){ const el=document.getElementById(id0); if(el){ el.focus({preventScroll:true}); try{ const n=el.value.length; el.setSelectionRange(n,n); }catch(e){} } }
    return;
  }
  const active = document.activeElement, aid = active && active.id, sel = aid && active.selectionStart != null ? [active.selectionStart, active.selectionEnd] : null;
  const first = new Map();
  app.querySelectorAll("[data-card]").forEach(el=>first.set(el.dataset.card, el.getBoundingClientRect().top));
  const sheetScroll = app.querySelector(".sheet")?.scrollTop || 0;
  // 게이지 이전 값 기억 → 다시 그린 뒤 이전 값에서 새 값으로 움직이게
  const prevG = new Map();
  app.querySelectorAll("[data-gkey]").forEach(el=>prevG.set(el.dataset.gkey, parseFloat(el.style.getPropertyValue("--v"))||0));
  // 골드 막대·골드 숫자·레이드 관문 칸도 이전 상태 기억
  const prevB = new Map(), prevN = new Map(), prevP = new Map();
  app.querySelectorAll("[data-bkey]").forEach(el=>prevB.set(el.dataset.bkey, el.style.width));
  app.querySelectorAll("[data-nkey]").forEach(el=>prevN.set(el.dataset.nkey, Number(el.dataset.shown ?? el.dataset.n)));
  app.querySelectorAll("[data-pkey]").forEach(el=>prevP.set(el.dataset.pkey, el.classList.contains("on")));

  const body = ui.page==="specs" ? specListPage() : ui.page==="spec" ? specDetailPage() : ui.page==="history" ? historyPage()
    : `<main class="board" data-view="${ui.view}">${dailyPanel()}${weeklyPanel()}</main>`;
  rendering = true;
  app.innerHTML = header() + body + menuPanel() + settingsSheet();
  const top = app.querySelector(".top"); if(top) document.documentElement.style.setProperty("--top-h", top.offsetHeight + "px");

  if(sheetScroll) app.querySelector(".sheet").scrollTop = sheetScroll;
  if(aid){ const el=document.getElementById(aid); if(el){ el.focus({preventScroll:true}); if(sel && el.setSelectionRange) try{ el.setSelectionRange(sel[0],sel[1]); }catch(e){} }
    // 눌러만 두고 아직 안 쓴 입력칸은 다시 그린 뒤에도 빈 칸 상태 유지
    if(el && focusSess && focusSess.id===aid && !focusSess.edited){ focusSess.orig = el.value; focusSess.ph = el.placeholder; blankField(el); } }
  rendering = false;
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches){
    app.querySelectorAll("[data-gkey]").forEach(el=>{
      const from = prevG.get(el.dataset.gkey); if(from==null) return;
      const to = parseFloat(el.style.getPropertyValue("--v"))||0;
      if(Math.abs(from-to) > 0.001) try{ el.animate([{width:`${from*100}%`},{width:`${to*100}%`}], {duration:300, easing:"ease", pseudoElement:"::before"}); }catch(e){}
    });
    // 골드 막대: 이전 길이 → 새 길이
    app.querySelectorAll("[data-bkey]").forEach(el=>{
      const from = prevB.get(el.dataset.bkey); if(from==null || from===el.style.width) return;
      el.animate([{width:from},{width:el.style.width}], {duration:450, easing:"cubic-bezier(.2,.8,.2,1)"});
    });
    // 골드 숫자: 이전 값에서 새 값까지 세어 올라감/내려감
    app.querySelectorAll("[data-nkey]").forEach(el=>{
      const from = prevN.get(el.dataset.nkey), to = Number(el.dataset.n);
      if(from==null || !Number.isFinite(from) || from===to) return;
      countUp(el, from, to);
    });
    // 레이드 관문 칸: 새로 깬 칸은 왼쪽부터 보라색이 채워지고, 되돌린 칸은 비워짐
    app.querySelectorAll("[data-pkey]").forEach(el=>{
      const was = prevP.get(el.dataset.pkey), on = el.classList.contains("on");
      if(was==null || was===on) return;
      el.animate([{backgroundSize: was ? "100% 100%, auto" : "0% 100%, auto"}, {backgroundSize: on ? "100% 100%, auto" : "0% 100%, auto"}], {duration:320, easing:"ease"});
    });
    app.querySelectorAll("[data-card]").forEach(el=>{
      const f = first.get(el.dataset.card); if(f==null) return;
      const dy = f - el.getBoundingClientRect().top;
      if(Math.abs(dy) > 1) el.animate([{transform:`translateY(${dy}px)`},{transform:"none"}], {duration:400, easing:"cubic-bezier(.2,.8,.2,1)"});
    });
  }
}
